<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doutor Chácara Retro - Portal de Jogos Clássicos</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d11;
      color: #ffffff;
      text-align: center;
    }

    /* SEÇÃO DE CAPA - AJUSTADA PARA O TAMANHO EXATO DA JANELA DO SITE */
    .hero-background {
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to bottom, rgba(13, 13, 17, 0.2), rgba(13, 13, 17, 0.85)),
        url('fundo.jpg.jpg');
      
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 40px 20px;
    }

    .btn-jogar {
      display: inline-block;
      background-color: #ff0055;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 50px;
      text-decoration: none;
      border: 2px solid #ffffff;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      transition: all 0.3s ease;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .btn-jogar:hover {
      background-color: #00ffcc;
      color: #000000;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.9);
      transform: scale(1.08);
    }

    .subtitulo-rodape {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d1d1e0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* ÁREA DO EMULADOR E SELEÇÃO DE JOGOS */
    #area-arcade {
      min-height: 100vh;
      padding: 60px 20px;
      background-color: #121218;
    }

    .seletor-jogos {
      margin-bottom: 25px;
    }

    .seletor-jogos select {
      background-color: #1a1a24;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
    }

    .status-controle {
      display: inline-block;
      padding: 10px 20px;
      background-color: #1a1a24;
      border: 1px solid #33334d;
      border-radius: 20px;
      font-size: 0.95rem;
      color: #ffcc00;
      margin-bottom: 20px;
    }

    #emulator-container {
      width: 800px;
      height: 600px;
      max-width: 100%;
      margin: 0 auto;
      border: 3px solid #00ffcc;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      background-color: #000;
      position: relative;
    }

    @media (max-width: 768px) {
      #emulator-container {
        height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- CAPA PRINCIPAL (AJUSTADA AO TAMANHO DA TELA) -->
  <header class="hero-background">
    <a href="#area-arcade" class="btn-jogar">COMEÇAR JOGO RETRO</a>
    <p class="subtitulo-rodape">SEU PORTAL DE JOGOS CLÁSSICOS</p>
  </header>

  <!-- ÁREA DE JOGOS DA PLATAFORMA -->
  <main id="area-arcade">
    <h2>Arcade Retro - Selecione seu Jogo</h2>
    <p style="margin-top: 5px; color: #a0a0b0; margin-bottom: 15px;">Conecte seu controle de PS2 / USB ou teclado para jogar.</p>

    <!-- Menu para trocar de jogo -->
    <div class="seletor-jogos">
      <label for="game-select">Escolha a ROM: </label>
      <select id="game-select" onchange="trocarJogo(this.value)">
        <option value="ffight.zip">Final Fight (FFIGHT)</option>
        <option value="neobombe.zip">Neo Bomberman (NEOBOMBE)</option>
        <option value="sf2ce.zip">Street Fighter II' Champion Edition (SF2CE)</option>
      </select>
    </div>
    
    <!-- Painel de Status do Joystick -->
    <div class="status-controle" id="gamepad-status">
      🎮 Status: Conecte seu controle USB/PS2 e pressione qualquer botão.
    </div>

    <!-- Contêiner do Emulador -->
    <div id="emulator-container">
      <div id="game"></div>
    </div>
  </main>

  <!-- SCRIPT DE INICIALIZAÇÃO DO EMULATORJS -->
  <script type="text/javascript">
    function iniciarEmulador(rom) {
      var container = document.getElementById('emulator-container');
      container.innerHTML = '<div id="game"></div>';

      window.EJS_player = '#game';
      window.EJS_core = 'mame'; 
      window.EJS_gameUrl = rom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_smooth = false;
      window.EJS_startOnLoaded = false;
      window.EJS_defaultControls = true;
      window.EJS_gamepadType = 'standard';

      var script = document.createElement('script');
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.body.appendChild(script);
    }

    // Inicializa o primeiro jogo ao carregar a página
    window.onload = function() {
      iniciarEmulador('ffight.zip');
    };

    // Função para alterar a ROM quando selecionar no menu
    function trocarJogo(rom) {
      window.location.reload(); // Recarrega a página para limpar o núcleo MAME e carregar a nova ROM
    }
  </script>

  <!-- RECONHECIMENTO DE CONTROLE USB / PS2 -->
  <script>
    window.addEventListener("gamepadconnected", (e) => {
      const statusDiv = document.getElementById("gamepad-status");
      statusDiv.style.color = "#00ffcc";
      statusDiv.innerHTML = `🎮 Controle Detectado: <strong>${e.gamepad.id}</strong>`;
    });

    window.addEventListener("gamepaddisconnected", (e) => {
      const statusDiv = document.getElementById("gamepad-status");
      statusDiv.style.color = "#ff3366";
      statusDiv.innerHTML = "🎮 Controle Desconectado.";
    });
  </script>

</body>
</html>
