<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doutor Chácara Retro & Família - P2P Multiplayer</title>
  <!-- PEERJS LIBRARY CORRIGIDA -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    html, body {
      width: 100vw; height: 100vh; background-color: #000; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center; overflow: hidden; user-select: none;
    }
    
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000;
    }
    #gameCanvas { background: #000; width: 100vw; height: 100vh; object-fit: fill; display: block; }

    /* HUD NO JOGO */
    #hud {
      position: absolute; top: 15px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none; font-size: 1.1rem; font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .hud-box { background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 12px; border: 1px solid #00ffcc; }

    /* MENU LOGIN / SALAS E SELEÇÃO DE PERSONAGEM */
    #auth-menu {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 10, 18, 0.95); backdrop-filter: blur(10px);
      z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: #fff; padding: 20px; overflow-y: auto;
    }

    #auth-menu h1 { color: #00ffcc; font-size: 2rem; text-shadow: 0 0 12px #00ffcc; letter-spacing: 1px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
    .form-group input {
      padding: 12px; border-radius: 8px; border: 1px solid #00ffcc; background: rgba(0,0,0,0.7);
      color: #fff; text-align: center; font-size: 1rem; outline: none;
    }

    .auth-toggle { display: flex; gap: 10px; margin-bottom: 5px; }
    .btn-tab {
      background: transparent; color: #888; border: none; font-size: 0.95rem; font-weight: bold;
      cursor: pointer; padding: 5px 12px; border-bottom: 2px solid transparent;
    }
    .btn-tab.active { color: #00ffcc; border-bottom: 2px solid #00ffcc; }

    .char-select-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 480px; margin-top: 5px;
    }
    .char-card {
      border: 2px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 8px 6px; background: rgba(255,255,255,0.05);
      cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .char-card:hover { transform: translateY(-3px); border-color: rgba(0,255,204,0.5); }
    .char-card.selected { border-color: #00ffcc; background: rgba(0, 255, 204, 0.2); transform: scale(1.05); }
    .char-card div.avatar { width: 38px; height: 44px; border-radius: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }

    .btn-play {
      background: #00ffcc; color: #000; font-size: 1.1rem; font-weight: bold;
      padding: 14px 35px; border-radius: 25px; border: none; cursor: pointer;
      box-shadow: 0 0 15px rgba(0,255,204,0.4); margin-top: 10px; width: 100%; max-width: 320px;
      transition: all 0.2s;
    }
    .btn-play:hover { background: #00cca3; transform: scale(1.02); }

    /* BARRA INFERIOR DE UTILITÁRIOS E ÁUDIO */
    .bottom-bar {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: rgba(10, 10, 18, 0.6);
      backdrop-filter: blur(5px); padding: 6px 14px; border-radius: 20px;
      border: 1px solid rgba(0, 255, 204, 0.3); z-index: 15;
    }
    .btn-tool {
      background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; cursor: pointer;
    }
    .btn-tool:hover { background: rgba(0, 255, 204, 0.2); }

    /* CONTROLES VIRTUAIS EXCLUSIVOS PARA CELULAR */
    .touch-controls {
      position: absolute; bottom: 65px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 25px; pointer-events: none; z-index: 20;
    }
    .d-pad { display: flex; gap: 12px; pointer-events: auto; }
    .btn-touch {
      width: 65px; height: 65px; border-radius: 50%; font-size: 1.4rem; font-weight: bold;
      border: 2px solid rgba(0,255,204,0.6); display: flex; justify-content: center; align-items: center; color: #fff;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); user-select: none;
      box-shadow: 0 0 10px rgba(0,255,204,0.2);
    }
    .btn-touch:active { background: rgba(0,255,204,0.5); transform: scale(0.92); }
    .action-buttons { display: flex; gap: 15px; pointer-events: auto; }
    .btn-jump { background: rgba(0, 136, 255, 0.5); border-color: #0088ff; }
    .btn-attack { background: rgba(255, 0, 85, 0.5); border-color: #ff0055; }

    #auth-alert { color: #ff4d6d; font-size: 0.85rem; height: 18px; font-weight: bold; }
    #room-id-display {
      background: rgba(0, 255, 204, 0.15); border: 1px dashed #00ffcc; color: #00ffcc;
      padding: 6px 12px; border-radius: 8px; font-family: monospace; font-size: 0.95rem; user-select: text;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="auth-menu">
      <h1>DOUTOR CHÁCARA RETRO</h1>
      <p style="color:#aaa; font-size:0.85rem;">Multiplayer Real PeerJS (Sem Servidor Pago)</p>
      
      <div class="auth-toggle">
        <button class="btn-tab active" id="tab-host" onclick="switchRoomMode('host')">Criar Sala</button>
        <button class="btn-tab" id="tab-join" onclick="switchRoomMode('join')">Entrar em Sala</button>
      </div>

      <div class="form-group">
        <input type="text" id="auth-user" placeholder="Seu Nome / Apelido" maxlength="14" value="Jogador">
        <input type="text" id="room-code" placeholder="Código da Sala (ex: 1234)" style="display:none;" maxlength="10">
      </div>

      <div id="room-id-box" style="display:block;">
        <span style="font-size:0.8rem; color:#aaa;">Código da sua Sala:</span>
        <div id="room-id-display">Gerando...</div>
      </div>

      <div id="auth-alert"></div>

      <p style="font-size:0.9rem; color:#00ffcc; margin-top:2px;">Escolha seu Personagem da Família:</p>
      <div class="char-select-grid" id="char-grid"></div>

      <button class="btn-play" id="btn-submit" onclick="handleStartGame()">CRIAR SALA E JOGAR ▶</button>
    </div>

    <div id="hud">
      <div class="hud-box" id="hud-player">Jogador: --</div>
      <div class="hud-box" id="hud-score">Pontos: 0</div>
      <div class="hud-box" id="hud-lives">Vidas: ❤️❤️❤️</div>
      <div class="hud-box" id="hud-stage">Fase: 1</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="bottom-bar">
      <button class="btn-tool" id="btn-music" onclick="toggleMusic()">🔊 Música: ON</button>
      <button class="btn-tool" onclick="toggleFullScreen()">⛶ Tela Cheia</button>
    </div>

    <div class="touch-controls">
      <div class="d-pad">
        <div class="btn-touch" id="btn-left">◀</div>
        <div class="btn-touch" id="btn-right">▶</div>
      </div>
      <div class="action-buttons">
        <div class="btn-touch btn-attack" id="btn-attack">⚔️</div>
        <div class="btn-touch btn-jump" id="btn-jump">▲</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const bgImageEven = new Image();
    bgImageEven.src = "fundo.jpg.jpg";

    const bgOddUrls = [
      "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80",
      "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=80",
      "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=1200&q=80"
    ];
    const bgOddImages = bgOddUrls.map(url => {
      const img = new Image(); img.src = url; return img;
    });

    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.noteIndex = 0;
        this.timer = null;
        this.notes = [110, 130.81, 146.83, 164.81, 130.81, 110, 98, 110, 146.83, 164.81, 196, 164.81];
      }
      init() {
        if(!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playSynthNote(freq) {
        if(!this.ctx || !this.isPlaying) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }
      startMusic() {
        this.init();
        if(this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true;
        if(!this.timer) {
          this.timer = setInterval(() => {
            this.playSynthNote(this.notes[this.noteIndex]);
            this.noteIndex = (this.noteIndex + 1) % this.notes.length;
          }, 200);
        }
      }
      stopMusic() {
        this.isPlaying = false;
        if(this.timer) { clearInterval(this.timer); this.timer = null; }
      }
      playHitSound() {
        if(!this.ctx) return;
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
    }
    const audio = new RetroAudio();
    let musicEnabled = true;

    function toggleMusic() {
      musicEnabled = !musicEnabled;
      const btn = document.getElementById("btn-music");
      if(musicEnabled) {
        btn.innerText = "🔊 Música: ON";
        audio.startMusic();
      } else {
        btn.innerText = "🔇 Música: OFF";
        audio.stopMusic();
      }
    }

    const CHARACTERS = {
      dr_chacara: { name: "Dr. Chácara", coatColor: "#ffffff", hatColor: "#c2b280", bootsColor: "#8b4513" },
      dona_chacara: { name: "Dona Chácara", coatColor: "#1b4965", hatColor: "#d8b4e2", bootsColor: "#a4133c" },
      chacarinha: { name: "Chacarinha", coatColor: "#ff4d6d", hatColor: "#ffbe0b", bootsColor: "#7209b7" },
      chacarim: { name: "Chacarim", coatColor: "#ff7b00", hatColor: "#d00000", bootsColor: "#000000" },
      tio_chacara: { name: "Tio Chácara", coatColor: "#2a9d8f", hatColor: "#6c757d", bootsColor: "#351f08" },
      vovo_chacara: { name: "Vovô Chácara", coatColor: "#e9c46a", hatColor: "#582f0e", bootsColor: "#a3b18a", isOld: true }
    };

    let selectedCharKey = 'dr_chacara';
    let currentRoomMode = 'host';
    let myRoomId = "chacara-" + Math.floor(1000 + Math.random() * 9000);
    let username = "";
    let currentStage = 1;
    let score = 0;
    let gameLoopRunning = false;

    let peer = null;
    let connections = {};
    let otherPlayers = {};

    const localPlayer = {
      id: '', x: 80, y: 100, width: 38, height: 75,
      vx: 0, vy: 0, speed: 6, grounded: false, facing: 'right',
      attacking: false, lives: 3, charKey: 'dr_chacara', name: ''
    };

    let enemies = [];

    window.addEventListener('load', () => {
      document.getElementById("room-id-display").innerText = myRoomId;
    });

    function initPeer(customId = null) {
      if (peer) peer.destroy();
      peer = customId ? new Peer(customId) : new Peer();

      peer.on('open', (id) => {
        localPlayer.id = id;
        if(currentRoomMode === 'host') {
          myRoomId = id;
          document.getElementById("room-id-display").innerText = id;
        }
      });

      peer.on('connection', (conn) => {
        setupConnection(conn);
      });

      peer.on('error', (err) => {
        console.error(err);
        document.getElementById("auth-alert").innerText = "Erro na conexão P2P. Tente outro código.";
      });
    }

    function setupConnection(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
      });

      conn.on('data', (data) => {
        if(data.type === 'state') {
          otherPlayers[data.id] = data;
        }
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        delete otherPlayers[conn.peer];
      });
    }

    function broadcastState() {
      const stateData = {
        type: 'state', id: localPlayer.id, name: username,
        charKey: selectedCharKey, x: localPlayer.x, y: localPlayer.y,
        facing: localPlayer.facing, attacking: localPlayer.attacking
      };

      Object.values(connections).forEach(conn => {
        if(conn.open) conn.send(stateData);
      });
    }

    function switchRoomMode(mode) {
      currentRoomMode = mode;
      document.getElementById("tab-host").classList.toggle("active", mode === 'host');
      document.getElementById("tab-join").classList.toggle("active", mode === 'join');
      document.getElementById("room-id-box").style.display = mode === 'host' ? 'block' : 'none';
      document.getElementById("room-code").style.display = mode === 'join' ? 'block' : 'none';
      document.getElementById("btn-submit").innerText = mode === 'host' ? "CRIAR SALA E JOGAR ▶" : "ENTRAR E JOGAR ▶";
      document.getElementById("auth-alert").innerText = "";
    }

    function handleStartGame() {
      const uInput = document.getElementById("auth-user").value.trim();
      if(!uInput) {
        document.getElementById("auth-alert").innerText = "Por favor, informe seu nome!";
        return;
      }
      username = uInput;
      localPlayer.name = username;
      localPlayer.charKey = selectedCharKey;

      if(currentRoomMode === 'host') {
        initPeer(myRoomId);
      } else {
        const targetRoomCode = document.getElementById("room-code").value.trim();
        if(!targetRoomCode) {
          document.getElementById("auth-alert").innerText = "Digite o código da sala para entrar!";
          return;
        }
        initPeer();
        setTimeout(() => {
          if (peer) {
            const conn = peer.connect(targetRoomCode);
            setupConnection(conn);
          }
        }, 1000);
      }

      document.getElementById("auth-menu").style.display = "none";
      document.getElementById("hud-player").innerText = `Jogador: ${username}`;

      if(musicEnabled) audio.startMusic();
      resetPlayer();
      spawnEnemies();
      
      if(!gameLoopRunning) {
        gameLoopRunning = true;
        requestAnimationFrame(gameLoop);
      }
    }

    const charGrid = document.getElementById("char-grid");
    Object.keys(CHARACTERS).forEach(key => {
      const c = CHARACTERS[key];
      const card = document.createElement("div");
      card.className = `char-card ${key === selectedCharKey ? 'selected' : ''}`;
      card.onclick = () => {
        document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
        card.classList.add('selected');
        selectedCharKey = key;
      };
      card.innerHTML = `
        <div class="avatar" style="background:${c.coatColor}; border:3px solid ${c.hatColor};"></div>
        <span style="font-size:0.75rem; font-weight:bold;">${c.name}</span>
      `;
      charGrid.appendChild(card);
    });

    function spawnEnemies() {
      enemies = [];
      const count = 3 + currentStage * 2;
      for(let i = 0; i < count; i++) {
        enemies.push({
          x: 400 + Math.random() * (canvas.width - 500),
          y: canvas.height - 110,
          width: 30, height: 30,
          vx: (Math.random() > 0.5 ? 1 : -1) * (1.5 + currentStage * 0.3),
          color: "#e63946"
        });
      }
    }

    function resetPlayer() {
      localPlayer.x = 80;
      localPlayer.y = canvas.height - 155;
      localPlayer.vx = 0; localPlayer.vy = 0;
    }

    const keys = { left: false, right: false };
    window.addEventListener("keydown", e => {
      if(e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
      if(e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
      if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") {
        if(localPlayer.grounded) { localPlayer.vy = -13; localPlayer.grounded = false; }
      }
      if(e.code === "KeyZ" || e.code === "KeyJ") attack();
    });

    window.addEventListener("keyup", e => {
      if(e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
      if(e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    });

    function bindTouch(id, onPress, onRelease) {
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener("touchstart", (e) => { e.preventDefault(); onPress(); });
      el.addEventListener("touchend", (e) => { e.preventDefault(); if(onRelease) onRelease(); });
    }

    bindTouch("btn-left", () => keys.left = true, () => keys.left = false);
    bindTouch("btn-right", () => keys.right = true, () => keys.right = false);
    bindTouch("btn-jump", () => { if(localPlayer.grounded) { localPlayer.vy = -13; localPlayer.grounded = false; } });
    bindTouch("btn-attack", () => attack());

    function attack() {
      if(!localPlayer.attacking) {
        localPlayer.attacking = true;
        audio.playHitSound();
        
        for(let idx = enemies.length - 1; idx >= 0; idx--) {
          const enemy = enemies[idx];
          const attackRange = localPlayer.facing === 'right' ? 
            (enemy.x >= localPlayer.x && enemy.x <= localPlayer.x + localPlayer.width + 45) :
            (enemy.x + enemy.width >= localPlayer.x - 45 && enemy.x <= localPlayer.x);
          
          if(attackRange && Math.abs(enemy.y - localPlayer.y) < 50) {
            enemies.splice(idx, 1);
            score += 100;
            document.getElementById("hud-score").innerText = `Pontos: ${score}`;
          }
        }
        setTimeout(() => localPlayer.attacking = false, 250);
      }
    }

    function update() {
      if(keys.left) { localPlayer.vx = -localPlayer.speed; localPlayer.facing = 'left'; }
      else if(keys.right) { localPlayer.vx = localPlayer.speed; localPlayer.facing = 'right'; }
      else { localPlayer.vx = 0; }

      localPlayer.vy += 0.65;
      localPlayer.x += localPlayer.vx;
      localPlayer.y += localPlayer.vy;

      if(localPlayer.x < 0) localPlayer.x = 0;
      if(localPlayer.x + localPlayer.width > canvas.width) localPlayer.x = canvas.width - localPlayer.width;

      const groundY = canvas.height - 80;
      if(localPlayer.y + localPlayer.height >= groundY) {
        localPlayer.y = groundY - localPlayer.height;
        localPlayer.vy = 0;
        localPlayer.grounded = true;
      }

      enemies.forEach(enemy => {
        enemy.x += enemy.vx;
        if(enemy.x <= 50 || enemy.x + enemy.width >= canvas.width - 50) enemy.vx *= -1;

        if(Math.abs(enemy.x - localPlayer.x) < 25 && Math.abs(enemy.y - localPlayer.y) < 30) {
          localPlayer.lives--;
          updateHudLives();
          resetPlayer();
          if(localPlayer.lives <= 0) {
            alert("Game Over! Reiniciando...");
            localPlayer.lives = 3; score = 0; currentStage = 1;
            document.getElementById("hud-score").innerText = "Pontos: 0";
            document.getElementById("hud-stage").innerText = "Fase: 1";
            updateHudLives();
            spawnEnemies();
          }
        }
      });

      if(enemies.length === 0) nextStage();

      broadcastState();
    }

    function updateHudLives() {
      let hearts = "";
      for(let i = 0; i < localPlayer.lives; i++) hearts += "❤️";
      document.getElementById("hud-lives").innerText = `Vidas: ${hearts}`;
    }

    function nextStage() {
      currentStage++;
      document.getElementById("hud-stage").innerText = `Fase: ${currentStage}`;
      resetPlayer();
      spawnEnemies();
    }

    function drawBackground() {
      if (currentStage % 2 === 0) {
        if(bgImageEven.complete && bgImageEven.naturalWidth !== 0) {
          ctx.drawImage(bgImageEven, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = "#1b2a4a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      } else {
        const bgImg = bgOddImages[(currentStage - 1) % bgOddImages.length];
        if (bgImg.complete && bgImg.naturalWidth !== 0) {
          ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      ctx.fillStyle = "#2d6a4f"; ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
      ctx.fillStyle = "#52b788"; ctx.fillRect(0, canvas.height - 80, canvas.width, 10);
    }

    function drawCharacter(p, name, charKey) {
      const charData = CHARACTERS[charKey] || CHARACTERS.dr_chacara;
      ctx.save();
      ctx.translate(p.x, p.y);

      if(p.facing === 'left') {
        ctx.translate(p.width, 0); ctx.scale(-1, 1);
      }

      ctx.fillStyle = charData.coatColor; ctx.fillRect(4, 20, p.width - 8, 35);
      ctx.fillStyle = "#ffdbac"; ctx.fillRect(8, 6, 22, 16);

      if (charData.isOld) {
        ctx.fillStyle = "#e0e0e0"; ctx.fillRect(6, 4, 26, 6);
      }

      ctx.fillStyle = charData.hatColor;
      ctx.fillRect(-2, 1, p.width + 4, 6);
      ctx.fillRect(6, -5, p.width - 12, 6);

      ctx.fillStyle = charData.bootsColor;
      ctx.fillRect(6, 55, 10, 20); ctx.fillRect(22, 55, 10, 20);

      if(p.attacking) {
        ctx.fillStyle = "#ffcc00"; ctx.fillRect(p.width, 15, 25, 8);
      }

      ctx.restore();

      ctx.fillStyle = "#00ffcc";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(name || "Jogador", p.x + p.width/2, p.y - 10);
    }

    function drawEnemies() {
      enemies.forEach(enemy => {
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        ctx.arc(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.width/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.fillRect(enemy.x + 6, enemy.y + 8, 5, 5);
        ctx.fillRect(enemy.x + 18, enemy.y + 8, 5, 5);
      });
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      update();

      drawCharacter(localPlayer, username, selectedCharKey);

      Object.values(otherPlayers).forEach(op => {
        drawCharacter(op, op.name, op.charKey);
      });

      drawEnemies();
      requestAnimationFrame(gameLoop);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    }
  </script>
</body>
</html>
