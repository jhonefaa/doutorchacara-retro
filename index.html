<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doutor Chácara Retro - Portal de Jogos Clássicos</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d11;
      color: #ffffff;
      text-align: center;
    }

    /* SEÇÃO DE CAPA - TAMANHO EXATO DA TELA DO SITE */
    .hero-background {
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to bottom, rgba(13, 13, 17, 0.2), rgba(13, 13, 17, 0.85)),
        url('fundo.jpg.jpg');
      
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 40px 20px;
    }

    .btn-jogar {
      display: inline-block;
      background-color: #ff0055;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 50px;
      text-decoration: none;
      border: 2px solid #ffffff;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      transition: all 0.3s ease;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .btn-jogar:hover {
      background-color: #00ffcc;
      color: #000000;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.9);
      transform: scale(1.08);
    }

    .subtitulo-rodape {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d1d1e0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* ÁREA DO EMULADOR E SELEÇÃO DE JOGOS */
    #area-arcade {
      min-height: 100vh;
      padding: 60px 20px;
      background-color: #121218;
    }

    .seletor-jogos {
      margin-bottom: 25px;
    }

    .seletor-jogos select {
      background-color: #1a1a24;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
    }

    .status-controle {
      display: inline-block;
      padding: 10px 20px;
      background-color: #1a1a24;
      border: 1px solid #33334d;
      border-radius: 20px;
      font-size: 0.95rem;
      color: #ffcc00;
      margin-bottom: 20px;
    }

    #emulator-frame {
      width: 800px;
      height: 600px;
      max-width: 100%;
      margin: 0 auto;
      border: 3px solid #00ffcc;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      background-color: #000;
    }

    @media (max-width: 768px) {
      #emulator-frame {
        height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- CAPA PRINCIPAL -->
  <header class="hero-background">
    <a href="#area-arcade" class="btn-jogar">COMEÇAR JOGO RETRO</a>
    <p class="subtitulo-rodape">SEU PORTAL DE JOGOS CLÁSSICOS</p>
  </header>

  <!-- ÁREA DE JOGOS -->
  <main id="area-arcade">
    <h2>Arcade Retro - Selecione seu Jogo</h2>
    <p style="margin-top: 5px; color: #a0a0b0; margin-bottom: 15px;">Conecte seu controle USB/PS2 ou utilize o teclado.</p>

    <!-- Menu para trocar de jogo -->
    <div class="seletor-jogos">
      <label for="game-select">Escolha o jogo: </label>
      <select id="game-select" onchange="trocarJogo(this.value)">
        <option value="ffight.zip">Final Fight</option>
        <option value="neobombe.zip">Neo Bomberman</option>
        <option value="sf2ce.zip">Street Fighter II' Champion Edition</option>
      </select>
    </div>
    
    <!-- Status do Controle USB/PS2 -->
    <div class="status-controle" id="gamepad-status">
      🎮 Status: Conecte seu controle USB/PS2 e pressione qualquer botão.
    </div>

    <!-- TELA DO EMULADOR (MAME) -->
    <iframe id="emulator-frame" src="about:blank"></iframe>
  </main>

  <script>
    function carregarJogo(rom) {
      const iframe = document.getElementById('emulator-frame');
      const doc = iframe.contentWindow.document;

      const htmlContent = `
        <!DOCTYPE html>
        <html>
        <head>
          <style>
            body { margin: 0; background: #000; height: 100vh; overflow: hidden; }
            #game { width: 100%; height: 100%; }
          </style>
        </head>
        <body>
          <div id="game"></div>
          <script type="text/javascript">
            EJS_player = '#game';
            EJS_core = 'mame';
            EJS_gameUrl = '${rom}';
            EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            EJS_smooth = false;
            EJS_startOnLoaded = false;
            EJS_defaultControls = true;
            EJS_gamepadType = 'standard';
          <\/script>
          <script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script>
        </body>
        </html>
      `;

      doc.open();
      doc.write(htmlContent);
      doc.close();
    }

    // Carrega o jogo inicial (Final Fight) ao abrir a página
    window.onload = function() {
      carregarJogo('ffight.zip');
    };

    // Função para trocar a ROM pelo menu
    function trocarJogo(rom) {
      carregarJogo(rom);
    }

    // Detector do controle USB na janela principal
    window.addEventListener("gamepadconnected", (e) => {
      const statusDiv = document.getElementById("gamepad-status");
      statusDiv.style.color = "#00ffcc";
      statusDiv.innerHTML = `🎮 Controle Detectado: <strong>${e.gamepad.id}</strong>`;
    });

    window.addEventListener("gamepaddisconnected", (e) => {
      const statusDiv = document.getElementById("gamepad-status");
      statusDiv.style.color = "#ff3366";
      statusDiv.innerHTML = "🎮 Controle Desconectado.";
    });
  </script>

</body>
</html>
