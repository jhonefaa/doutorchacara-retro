<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doutor Chácara - Alfabetização Arcade Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    html, body {
      width: 100%; height: 100%; background-color: #0d0d11; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center; overflow: hidden; user-select: none;
    }
    
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center; background: #000;
    }
    #gameCanvas {
      background: #000; width: 100%; height: 100%; object-fit: contain; display: block;
    }

    /* CONTROLES VIRTUAIS TOUCH */
    .touch-controls {
      position: absolute; bottom: 20px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 30px; pointer-events: none; z-index: 5;
    }
    
    /* JOYSTICK ANALÓGICO 360° */
    #joystick-zone {
      width: 120px; height: 120px; background: rgba(255, 255, 255, 0.15);
      border: 2px solid #00ffcc; border-radius: 50%; position: relative;
      pointer-events: auto; touch-action: none;
    }
    #joystick-stick {
      width: 50px; height: 50px; background: #00ffcc; border-radius: 50%;
      position: absolute; top: 35px; left: 35px;
      box-shadow: 0 0 10px #00ffcc; pointer-events: none;
    }

    /* BOTÕES DE AÇÃO */
    .action-buttons { display: flex; gap: 15px; pointer-events: auto; }
    .btn-action {
      width: 65px; height: 65px; border-radius: 50%; font-size: 0.9rem; font-weight: bold;
      border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,255,255,0.3);
      display: flex; justify-content: center; align-items: center; color: #fff;
    }
    .btn-jump { background: #0088ff; }
    .btn-attack { background: #ff0055; }

    /* UI DE MODAIS E BOTÕES */
    #btn-fullscreen {
      position: absolute; top: 15px; right: 15px; background: rgba(0, 255, 204, 0.2);
      border: 1px solid #00ffcc; color: #00ffcc; padding: 8px 15px; border-radius: 20px;
      font-size: 0.8rem; font-weight: bold; cursor: pointer; z-index: 10;
    }
    
    .overlay-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 10, 18, 0.95); border: 2px solid #00ffcc;
      border-radius: 20px; padding: 25px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
      z-index: 20; display: none; flex-direction: column; align-items: center; gap: 15px;
      width: 85%; max-width: 450px; color: #fff;
    }

    .overlay-panel h2 { color: #00ffcc; font-size: 1.5rem; }
    .overlay-panel p { font-size: 1.1rem; }
    
    .btn-main {
      background: #00ffcc; color: #000; font-size: 1.1rem; font-weight: bold;
      padding: 12px 28px; border-radius: 25px; border: none; cursor: pointer;
      box-shadow: 0 0 15px #00ffcc; margin-top: 10px;
    }

    input[type="text"] {
      padding: 10px 15px; border-radius: 10px; border: 2px solid #00ffcc;
      background: #111; color: #fff; font-size: 1.1rem; text-align: center; width: 80%;
    }

    .leaderboard-list {
      width: 100%; max-height: 180px; overflow-y: auto; text-align: left;
      font-family: monospace; font-size: 0.95rem; background: rgba(255,255,255,0.05);
      padding: 10px; border-radius: 10px; border: 1px solid #333;
    }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #444; }
  </style>
</head>
<body>

  <div id="game-container">
    <button id="btn-fullscreen" onclick="toggleFullScreen()">TELA CHEIA ⛶</button>
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- PAINEL INICIAR FASE / TRANSIÇÃO -->
    <div id="panel-stage-start" class="overlay-panel">
      <h2 id="stage-title">FASE 1</h2>
      <p id="stage-instruction">Destrua os alvos solicitados!</p>
      <div id="stage-score-info"></div>
      <button class="btn-main" onclick="startStage()">INICIAR FASE ▶</button>
    </div>

    <!-- PAINEL GAME OVER & REGISTRO DE NOME -->
    <div id="panel-game-over" class="overlay-panel">
      <h2 style="color: #ff0055;">GAME OVER</h2>
      <p id="game-over-reason">Você perdeu a fase!</p>
      <p>Sua pontuação: <strong id="final-score">0</strong></p>
      <input type="text" id="player-name" placeholder="Digite seu nome" maxlength="12">
      <button class="btn-main" onclick="saveScoreAndRestart()">SALVAR RECORD '🔄</button>
      
      <h3 style="margin-top: 10px; color: #ffcc00; font-size: 1rem;">🏆 TOP 10 RECORDES</h3>
      <div class="leaderboard-list" id="leaderboard-list"></div>
    </div>

    <div class="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-stick"></div>
      </div>

      <div class="action-buttons">
        <div class="btn-action btn-jump" id="touch-jump">PULO</div>
        <div class="btn-action btn-attack" id="touch-attack">ATAQUE</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    const panelStageStart = document.getElementById("panel-stage-start");
    const panelGameOver = document.getElementById("panel-game-over");
    const stageTitle = document.getElementById("stage-title");
    const stageInstruction = document.getElementById("stage-instruction");
    const stageScoreInfo = document.getElementById("stage-score-info");
    const finalScoreTxt = document.getElementById("final-score");
    const playerNameInput = document.getElementById("player-name");
    const leaderboardList = document.getElementById("leaderboard-list");

    // SINTETIZADOR DE ÁUDIO (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'attack') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'hitTarget') {
        // NOVO SOM: Raio atingiu o alvo correto (Laser / Cristal Impact)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'hitWrong') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // SINTETIZADOR DE VOZ
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    let currentStage = 1;
    const maxStages = 27;
    let score = 0;
    let gameOver = false;
    let stageStarted = false;
    let stageMissionText = "";
    let winMessage = "";
    let walkCycle = 0;

    const player = {
      x: 50, y: 280, width: 35, height: 70,
      vx: 0, vy: 0, speed: 4.8, friction: 0.82,
      grounded: false, crouching: false, facing: 'right', aimingUp: false,
      attacking: false, attackTimer: 0, attackMaxTime: 12
    };

    const gravity = 0.65;
    const groundY = 370;
    const weapon = { x: 0, y: 0, length: 0, maxLength: 150 };

    const stageRules = {
      1: {
        title: "FASE 1: LETRAS MINÚSCULAS",
        instruction: "ATENÇÃO: Destrua APENAS as letras MINÚSCULAS (a-f)!",
        isValid: (char) => char === char.toLowerCase() && isNaN(char),
        generateChar: () => ['A','B','C','D','E','F','a','b','c','d','e','f'][Math.floor(Math.random() * 12)]
      },
      2: {
        title: "FASE 2: NÚMEROS PARES",
        instruction: "ATENÇÃO: Destrua APENAS os NÚMEROS PARES!",
        isValid: (char) => !isNaN(char) && parseInt(char) % 2 === 0,
        generateChar: () => ['1','2','3','4','5','6','7','8','9'][Math.floor(Math.random() * 9)]
      }
    };

    function getRuleForStage(stage) {
      if (stageRules[stage]) return stageRules[stage];
      return {
        title: `FASE ${stage}: DESAFIO DE VOGAIS`,
        instruction: "ATENÇÃO: Destrua APENAS as VOGAIS!",
        isValid: (char) => ['A','E','I','O','U'].includes(char.toUpperCase()),
        generateChar: () => ['A','B','E','F','I','K','O','P','U'][Math.floor(Math.random() * 9)]
      };
    }

    const enemies = [];
    function prepareStage() {
      enemies.length = 0;
      const currentRule = getRuleForStage(currentStage);
      stageMissionText = currentRule.instruction;
      stageStarted = false;

      // Configura modal da fase
      stageTitle.innerText = currentRule.title;
      stageInstruction.innerText = currentRule.instruction;
      
      const topRecord = getTopScores()[0] || { name: 'Ninguém', score: 0 };
      stageScoreInfo.innerHTML = `Pontuação Atual: <strong>${score}</strong><br>Recorde do Jogo: <strong>${topRecord.score}</strong> (${topRecord.name})`;
      
      panelStageStart.style.display = "flex";
      panelGameOver.style.display = "none";

      const count = 4 + Math.floor(currentStage * 0.5);
      for (let i = 0; i < count; i++) {
        const charSymbol = currentRule.generateChar();
        enemies.push({
          x: 450 + i * 150 + Math.random() * 30,
          y: groundY - 45, width: 35, height: 45,
          speed: 1.4 + (currentStage * 0.1), alive: true,
          symbol: charSymbol, isTarget: currentRule.isValid(charSymbol),
          dir: -1, expression: 'normal', exprTimer: 0 // 'normal', 'happy', 'sad'
        });
      }
    }

    function startStage() {
      stageStarted = true;
      panelStageStart.style.display = "none";
      const currentRule = getRuleForStage(currentStage);
      speakText(`${currentRule.title}. ${currentRule.instruction}`);
    }

    // GESTÃO DE HIGHSCORES (LOCALSTORAGE)
    function getTopScores() {
      const data = localStorage.getItem("dr_chacara_scores");
      return data ? JSON.parse(data) : [];
    }

    function renderLeaderboard() {
      const scores = getTopScores();
      leaderboardList.innerHTML = scores.map((s, i) => `
        <div class="leaderboard-item">
          <span>#${i+1} ${s.name}</span>
          <span>${s.score} pts</span>
        </div>
      `).join('') || '<div>Nenhum recorde ainda!</div>';
    }

    function saveScoreAndRestart() {
      const name = playerNameInput.value.trim() || "Jogador";
      const scores = getTopScores();
      scores.push({ name: name, score: score });
      scores.sort((a, b) => b.score - a.score);
      const top10 = scores.slice(0, 10);
      localStorage.setItem("dr_chacara_scores", JSON.stringify(top10));

      resetGame();
    }

    function triggerGameOver(reason) {
      gameOver = true;
      playSound('hitWrong');
      document.getElementById("game-over-reason").innerText = reason;
      finalScoreTxt.innerText = score;
      renderLeaderboard();
      panelGameOver.style.display = "flex";
      speakText("Game Over. " + reason);
    }

    // JOYSTICK ANALÓGICO 360°
    const joyZone = document.getElementById("joystick-zone");
    const joyStick = document.getElementById("joystick-stick");
    let joyActive = false;
    let joyVector = { x: 0, y: 0 };

    joyZone.addEventListener("pointerdown", (e) => { joyActive = true; updateJoystick(e); });
    window.addEventListener("pointermove", (e) => { if (joyActive) updateJoystick(e); });
    window.addEventListener("pointerup", () => {
      joyActive = false; joyVector = { x: 0, y: 0 };
      joyStick.style.top = "35px"; joyStick.style.left = "35px";
    });

    function updateJoystick(e) {
      const rect = joyZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = e.clientX - centerX;
      let dy = e.clientY - centerY;
      const dist = Math.hypot(dx, dy);
      const maxDist = 40;

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      joyStick.style.left = `${35 + dx}px`;
      joyStick.style.top = `${35 + dy}px`;

      joyVector.x = dx / maxDist;
      joyVector.y = dy / maxDist;
    }

    // CONTROLES DE BOTÃO
    document.getElementById("touch-jump").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (player.grounded && stageStarted && !gameOver) { player.vy = -12.5; player.grounded = false; }
    });

    document.getElementById("touch-attack").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (!player.attacking && stageStarted && !gameOver) {
        player.attacking = true; player.attackTimer = player.attackMaxTime;
        playSound('attack');
      }
    });

    function resetGame() {
      gameOver = false; score = 0; currentStage = 1;
      player.x = 50; player.y = 280; player.vx = 0; player.vy = 0;
      prepareStage();
    }

    const keys = {};
    window.addEventListener("keydown", (e) => { keys[e.code] = true; });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    function update() {
      if (gameOver || !stageStarted) return;

      const moveX = joyVector.x || (keys["ArrowRight"] ? 1 : keys["ArrowLeft"] ? -1 : 0);
      const moveY = joyVector.y || (keys["ArrowDown"] ? 1 : keys["ArrowUp"] ? -1 : 0);

      player.aimingUp = moveY < -0.4;
      player.crouching = moveY > 0.4 && player.grounded;

      if (Math.abs(moveX) > 0.2 && !player.crouching) {
        player.vx = moveX * player.speed;
        player.facing = moveX > 0 ? 'right' : 'left';
        walkCycle += 0.25;
      } else {
        walkCycle = 0;
      }

      if (keys["Space"] && player.grounded) {
        player.vy = -12.5; player.grounded = false;
      }

      if ((keys["KeyZ"] || keys["KeyX"]) && !player.attacking) {
        player.attacking = true; player.attackTimer = player.attackMaxTime;
        playSound('attack');
      }

      player.vx *= player.friction; player.x += player.vx;
      player.vy += gravity; player.y += player.vy;

      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height; player.vy = 0; player.grounded = true;
      }

      if (player.x < 0) player.x = 0;

      // Mudança de Fase
      if (player.x + player.width >= canvas.width) {
        if (currentStage < maxStages) {
          currentStage++; player.x = 20;
          winMessage = "MUITO BEM! RUMO AO PRÓXIMO DESAFIO!";
          playSound('win');
          speakText(winMessage);
          prepareStage();
        } else {
          speakText("Parabéns! Você completou todas as fases!");
          triggerGameOver("Parabéns! Você completou o jogo!");
        }
      }

      // Ataque Diskarmor
      if (player.attacking) {
        player.attackTimer--;
        const progress = 1 - (player.attackTimer / player.attackMaxTime);
        weapon.length = Math.sin(progress * Math.PI) * weapon.maxLength;

        if (player.aimingUp) {
          weapon.x = player.x + player.width / 2; weapon.y = player.y - weapon.length;
        } else if (player.crouching) {
          weapon.y = player.y + player.height - 15;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        } else {
          weapon.y = player.y + 25;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        }

        if (player.attackTimer <= 0) player.attacking = false;
      }

      // Lógica das Letras Inimigas
      enemies.forEach(enemy => {
        if (!enemy.alive) return;

        enemy.x += enemy.speed * enemy.dir;
        if (enemy.x < -50) enemy.x = canvas.width + 50;

        // Ataque Atingindo Letra
        if (player.attacking) {
          const hit = (enemy.x < weapon.x + 25 && enemy.x + enemy.width > weapon.x - 25 &&
                       enemy.y < weapon.y + 25 && enemy.y + enemy.height > weapon.y - 25);
          if (hit) {
            if (enemy.isTarget) {
              enemy.expression = 'sad';
              playSound('hitTarget'); // Som de impacto ao atingir alvo correto
              score += 500;
              setTimeout(() => { enemy.alive = false; }, 150);
            } else {
              enemy.expression = 'sad';
              triggerGameOver("Você destruiu o elemento incorreto!");
            }
          }
        }

        // Colisão com o Personagem
        if (enemy.alive &&
            player.x < enemy.x + enemy.width && player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
          enemy.expression = 'happy'; // Sorriso feliz ao tocar no jogador
          triggerGameOver("A letra encostou em você!");
        }
      });
    }

    // DESENHO DO DOUTOR CHÁCARA EM PERFIL LATERAL
    function drawDrChacaraSide(x, y, facing, crouching) {
      ctx.save();
      ctx.translate(x + player.width / 2, y);
      if (facing === 'left') ctx.scale(-1, 1);

      const legAngle = Math.sin(walkCycle) * 20;
      const armAngle = Math.sin(walkCycle) * 25;
      const h = crouching ? 45 : 70;

      // Pernas Visão Lateral
      ctx.strokeStyle = "#1a1a24"; ctx.lineWidth = 6; ctx.lineCap = "round";
      
      // Perna Traseira
      ctx.beginPath();
      ctx.moveTo(-2, h - 30);
      ctx.lineTo(-2 - Math.sin((-legAngle * Math.PI)/180) * 15, h);
      ctx.stroke();

      // Perna Dianteira
      ctx.beginPath();
      ctx.moveTo(2, h - 30);
      ctx.lineTo(2 + Math.sin((legAngle * Math.PI)/180) * 15, h);
      ctx.stroke();

      // Tronco Lateral
      ctx.fillStyle = "#0066cc"; ctx.fillRect(-8, crouching ? 15 : 20, 16, 25);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(-10, crouching ? 10 : 18, 20, crouching ? 20 : 30); // Jaleco

      // Cabeça de Perfil Lateral
      ctx.fillStyle = "#f3c099"; ctx.fillRect(-4, 0, 16, 18); // Rosto
      ctx.fillStyle = "#111111"; ctx.fillRect(-6, -1, 18, 5);  // Cabelo traseiro
      ctx.fillStyle = "#5A5A66"; ctx.fillRect(-7, -7, 20, 7);  // Cabelo topo
      
      // Óculos Lateral
      ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.strokeRect(4, 4, 7, 5);
      ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(4, 6); ctx.stroke();

      // Braço Traseiro
      ctx.strokeStyle = "#f3c099"; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-4, crouching ? 20 : 25);
      ctx.lineTo(-4 - Math.sin((armAngle * Math.PI)/180) * 15, (crouching ? 20 : 25) + 15);
      ctx.stroke();

      // Braço Dianteiro
      ctx.beginPath();
      ctx.moveTo(4, crouching ? 20 : 25);
      ctx.lineTo(4 + Math.sin((armAngle * Math.PI)/180) * 15, (crouching ? 20 : 25) + 15);
      ctx.stroke();

      ctx.restore();
    }

    // DESENHO DAS LETRAS COM PERNAS (SEM QUADRADO)
    function drawLetterEnemy(enemy) {
      if (!enemy.alive) return;

      ctx.save();
      ctx.translate(enemy.x + enemy.width / 2, enemy.y);

      const legCycle = Math.sin(Date.now() * 0.01 + enemy.x) * 12;

      // Perninhas caminhando
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.lineCap = "round";
      
      // Perna 1
      ctx.beginPath();
      ctx.moveTo(-8, enemy.height - 10);
      ctx.lineTo(-8 + legCycle, enemy.height);
      ctx.stroke();

      // Perna 2
      ctx.beginPath();
      ctx.moveTo(8, enemy.height - 10);
      ctx.lineTo(8 - legCycle, enemy.height);
      ctx.stroke();

      // Símbolo da Letra Grandes
      ctx.fillStyle = enemy.isTarget ? "#00ffcc" : "#ff0055";
      ctx.font = "bold 34px 'Segoe UI'"; ctx.textAlign = "center";
      ctx.fillText(enemy.symbol, 0, enemy.height - 12);

      // Expressão / Sorriso
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 12px 'Segoe UI'";
      if (enemy.expression === 'happy') {
        ctx.fillText(":D", 14, 15); // Sorriso Feliz ao tocar no jogador
      } else if (enemy.expression === 'sad') {
        ctx.fillText(":(", 14, 15); // Sorriso Triste ao ser atingido
      }

      ctx.restore();
    }

    function draw() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#120826"); grad.addColorStop(0.6, "#7a223b"); grad.addColorStop(1, "#2e1200");
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff3300"; ctx.beginPath(); ctx.arc(680, 140, 48, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#26150d"; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.fillStyle = "#00ffcc"; ctx.fillRect(0, groundY, canvas.width, 3);

      drawDrChacaraSide(player.x, player.y, player.facing, player.crouching);

      if (player.attacking) {
        ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 5; ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y + 25); ctx.lineTo(weapon.x, weapon.y); ctx.stroke();
        ctx.fillStyle = "#00ffcc"; ctx.beginPath(); ctx.arc(weapon.x, weapon.y, 12, 0, Math.PI * 2); ctx.fill();
      }

      enemies.forEach(enemy => drawLetterEnemy(enemy));

      const currentRule = getRuleForStage(currentStage);
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "left";
      ctx.fillText(`${currentRule.title}`, 20, 30);
      ctx.fillText(`PONTOS: ${score}`, 650, 30);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
