<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doutor Chácara - Arcade Multiplayer v3.3</title>
    <!-- PeerJS para Conexão Multiplayer Online P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #111; font-family: 'Courier New', Courier, monospace; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 56.25vw; 
            max-width: 800px; 
            max-height: 450px; 
            background: #000; 
            overflow: hidden; 
            border: 2px solid #fff; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2); 
        }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        .ui-panel { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; text-shadow: 2px 2px #000; z-index: 10; pointer-events: none; }
        .btn-ui { background: #333; color: #fff; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; pointer-events: auto; font-family: inherit; font-size: 11px; }
        .btn-ui:active { background: #555; }
        
        #touch-controls { position: absolute; bottom: 8px; left: 10px; right: 10px; height: 90px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .joystick-zone { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; position: relative; }
        .joystick-knob { width: 32px; height: 32px; background: rgba(255,255,255,0.8); border-radius: 50%; position: absolute; top: 22px; left: 22px; }
        .action-buttons { display: flex; gap: 8px; }
        .btn-action { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; font-weight: bold; font-size: 11px; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px #000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 0 #000; }
        #btn-jump { background: #2196F3; }
        #btn-attack { background: #4CAF50; }
        #btn-special { background: #FF9800; }

        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; padding: 10px; text-align: center; box-sizing: border-box; }
        .hidden { display: none !important; }
        .modal input, .modal select { padding: 6px; font-size: 12px; text-align: center; margin: 4px 0; font-family: inherit; width: 80%; max-width: 250px; }
        .modal button { padding: 6px 12px; font-size: 11px; cursor: pointer; background: #fff; color: #000; border: none; font-weight: bold; margin-top: 6px; }
        
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 90%; max-height: 55%; overflow-y: auto; margin-bottom: 8px; width: 100%; }
        .config-grid button, .config-grid select { width: 100%; font-size: 10px; padding: 6px; }

        /* Grade de Escolha dos 6 Personagens */
        .char-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 320px; width: 100%; margin: 8px 0; }
        .char-card { border: 2px solid #555; padding: 6px; cursor: pointer; border-radius: 4px; font-size: 9px; background: rgba(255,255,255,0.05); }
        .char-card.selected { border-color: #4CAF50; background: rgba(76, 175, 80, 0.3); }
        .char-preview { width: 20px; height: 20px; margin: 0 auto 4px auto; border-radius: 2px; }

        /* Chat Relocado para o Topo Superior Direito */
        #chat-box { position: absolute; top: 35px; right: 10px; width: 200px; height: 95px; background: rgba(0,0,0,0.65); border: 1px solid #4caf50; display: flex; flex-direction: column; z-index: 15; font-size: 9px; border-radius: 4px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 4px; text-align: left; }
        #chat-input-container { display: flex; }
        #chat-input { flex: 1; background: #111; color: #fff; border: none; padding: 4px; font-size: 9px; }
        #chat-send { background: #4caf50; border: none; color: white; padding: 4px 6px; cursor: pointer; font-weight: bold; }

        .yt-banner { color: #ff0000; font-weight: bold; margin-bottom: 6px; text-decoration: none; border: 1px solid red; padding: 4px 8px; border-radius: 4px; background: rgba(255,0,0,0.1); font-size: 11px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="ui-panel">
        <div>
            <div>FASE: <span id="ui-stage">1</span> | PONTOS: <span id="ui-score">0</span> | SALA: <span id="ui-room">1</span></div>
            <div>VIDAS: <span id="ui-lives">❤️❤️❤️</span> | JOGADORES: <span id="ui-players-count">1/6</span> | FIM DA FASE: <span id="ui-cleared-count">0/1</span></div>
        </div>
        <div>
            <button class="btn-ui" id="btn-config">⚙️ CONTROLES</button>
        </div>
    </div>

    <!-- Chat ao Vivo Re-posicionado para não Atrapalhar -->
    <div id="chat-box">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Chat ao vivo..." maxlength="50">
            <button id="chat-send">▶</button>
        </div>
    </div>

    <div id="touch-controls">
        <div class="joystick-zone" id="joystick-zone">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <div class="btn-action" id="btn-attack">ESC.U</div>
            <div class="btn-action" id="btn-special">REL.I</div>
            <div class="btn-action" id="btn-jump">PULO</div>
        </div>
    </div>

    <!-- Modal de Login e Seleção do Personagem -->
    <div id="modal-auth" class="modal">
        <h2 style="color: #ffeb3b; margin-bottom: 2px;">DOUTOR CHÁCARA</h2>
        <a href="https://www.youtube.com" target="_blank" class="yt-banner">📺 Inscreva-se no Canal Doutor Chácara!</a>
        <p style="font-size:10px;">Cadastre-se e escolha seu personagem para jogar em grupo</p>
        
        <input type="text" id="auth-username" placeholder="Nome do Jogador" value="Doutor Chácara">
        <input type="password" id="auth-password" placeholder="Senha de Acesso" value="123456">

        <p style="font-size:10px; margin-top: 4px; color: #4CAF50;">ESCOLHA SEU PERSONAGEM:</p>
        <div class="char-select-grid" id="char-grid"></div>

        <button id="btn-login" style="background:#4CAF50; color:white;">ENTRAR NA SALA E JOGAR</button>
    </div>

    <!-- Modal de Configuração de Controles -->
    <div id="modal-keybinds" class="modal hidden">
        <h3 style="margin-bottom: 5px; color: #4CAF50;">CONFIGURAÇÃO DE CONTROLES</h3>
        <div class="config-grid">
            <button id="rebind-left">Esquerda: A</button>
            <button id="rebind-right">Direita: D</button>
            <button id="rebind-up">Cima: W</button>
            <button id="rebind-down">Baixo: S</button>
            <button id="rebind-jump">Pulo: U</button>
            <button id="rebind-salto">Salto: O</button>
            <button id="rebind-attack">Escudo: U</button>
            <button id="rebind-special">Especial: I</button>

            <select id="gamepad-select">
                <option value="0">Joystick / Gamepad: Padrão</option>
                <option value="1">Gamepad Detectado</option>
            </select>
            
            <select id="sens-select">
                <option value="1">Sensibilidade Joystick: Normal</option>
                <option value="1.5">Sensibilidade Joystick: Alta</option>
            </select>
        </div>
        <button id="btn-save-keybinds" style="background: #4CAF50; color: white;">SALVAR E CONTINUAR JOGO</button>
    </div>
</div>

<script>
/**
 * DOUTOR CHÁCARA - ARCADE MULTIPLAYER v3.3
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Trilha Sonora Retro Synthwave sem Direitos Autorais
const bgm = new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a7315b.mp3?filename=8-bit-arcade-138828.mp3');
bgm.loop = true;
bgm.volume = 0.3;

// Imagens de Fundo
const bgEven = new Image(); bgEven.src = 'fundo.jpg.jpg'; 
const bgRetro = new Image(); bgRetro.src = 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80';
const bgModern = new Image(); bgModern.src = 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80';

const CHARACTER_TYPES = [
    { id: 0, name: 'Doutor Chácara', color: '#003366' },
    { id: 1, name: 'Pai do Doutor', color: '#8A2BE2' },
    { id: 2, name: 'Irmã do Doutor', color: '#FF69B4' },
    { id: 3, name: 'Filho do Doutor', color: '#00E5FF' },
    { id: 4, name: 'Filha do Doutor', color: '#FFD700' },
    { id: 5, name: 'Tio do Doutor', color: '#2E8B57' }
];

const state = {
    selectedCharId: 0,
    myPlayerId: Math.random().toString(36).substring(2, 9),
    username: 'Doutor Chácara',
    score: 0,
    lives: 3,
    stage: 1,
    isPaused: false,
    players: {},
    keyMap: { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', jump: 'KeyU', salto: 'KeyO', attack: 'KeyU', special: 'KeyI' }
};

// Gerenciador de Insetos (Aranha, Mosca, Abelha)
const INSECT_TYPES = [
    { type: 'spider', color: '#8B0000', speed: 1.5, size: 16, label: '🕷️' },
    { type: 'fly', color: '#708090', speed: 2.5, size: 12, label: '🪰' },
    { type: 'bee', color: '#FFD700', speed: 2.0, size: 14, label: '🐝' }
];

let enemies = [];

function spawnEnemies() {
    enemies = [];
    const count = 3 + state.stage * 2;
    for (let i = 0; i < count; i++) {
        const spec = INSECT_TYPES[Math.floor(Math.random() * INSECT_TYPES.length)];
        enemies.push({
            x: 400 + Math.random() * 350,
            y: spec.type === 'spider' ? 364 : 250 + Math.random() * 80,
            spec: spec,
            vx: -spec.speed,
            vy: spec.type === 'fly' ? Math.sin(Math.random() * 10) : 0
        });
    }
}

function renderCharacterSelection() {
    const grid = document.getElementById('char-grid');
    grid.innerHTML = '';
    CHARACTER_TYPES.forEach((char) => {
        const card = document.createElement('div');
        card.className = `char-card ${char.id === state.selectedCharId ? 'selected' : ''}`;
        card.onclick = () => {
            state.selectedCharId = char.id;
            renderCharacterSelection();
        };

        const preview = document.createElement('div');
        preview.className = 'char-preview';
        preview.style.backgroundColor = char.color;

        const name = document.createElement('div');
        name.innerText = char.name;

        card.appendChild(preview);
        card.appendChild(name);
        grid.appendChild(card);
    });
}

// Sala Multiplayer Única e Direta
let peer = null;
let hostConn = null;
let clientConns = [];

function initMultiplayer() {
    const roomKey = "dc_chacara_room_global_v33";
    peer = new Peer(roomKey);

    peer.on('open', () => {
        // Criou a sala global como líder
        spawnEnemies();
    });

    peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
            // A sala já existe, conecta como jogador convidado
            peer = new Peer();
            peer.on('open', () => {
                hostConn = peer.connect(roomKey);
                setupHostConnection(hostConn);
            });
        }
    });

    peer.on('connection', (conn) => {
        clientConns.push(conn);
        conn.on('data', (data) => processNetworkData(data));
        // Sincroniza o estado atual do jogo e fase para quem acabou de entrar
        conn.send({ type: 'SYNC_STAGE', stage: state.stage, enemies: enemies });
    });
}

function setupHostConnection(conn) {
    conn.on('open', () => {
        updateRoomUI();
    });
    conn.on('data', (data) => processNetworkData(data));
}

function processNetworkData(data) {
    if (data.type === 'STATE_UPDATE') {
        state.players[data.id] = data.playerData;
        checkStageProgression();
    } else if (data.type === 'SYNC_STAGE') {
        state.stage = data.stage;
        enemies = data.enemies || [];
        player.x = 50;
        player.stageCleared = false;
        document.getElementById('ui-stage').innerText = state.stage;
    } else if (data.type === 'CHAT') {
        addChatMessage(data.sender, data.msg);
    }
}

function broadcast(data) {
    if (hostConn && hostConn.open) {
        hostConn.send(data);
    }
    clientConns.forEach(c => {
        if (c && c.open) c.send(data);
    });
}

function updateRoomUI() {
    const total = Object.keys(state.players).length + 1;
    document.getElementById('ui-players-count').innerText = `${total}/6`;
}

// Controle do Teclado
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

const player = {
    x: 50, y: 330, width: 40, height: 50, vx: 0, vy: 0, speed: 5,
    jumpPower: -12, grounded: true, shieldActive: false, shieldTimer: 0, stageCleared: false,

    update() {
        if (state.isPaused) return;

        let moveX = 0;
        if (keys[state.keyMap.left]) moveX = -1;
        if (keys[state.keyMap.right]) moveX = 1;

        this.vx = moveX * this.speed;

        if ((keys[state.keyMap.jump] || keys[state.keyMap.salto]) && this.grounded) {
            this.vy = keys[state.keyMap.salto] ? -14 : this.jumpPower;
            this.grounded = false;
        }

        if (keys[state.keyMap.attack] && !this.shieldActive) {
            this.shieldActive = true;
            this.shieldTimer = 60;
        }

        this.vy += 0.6;
        this.x += this.vx;
        this.y += this.vy;

        const groundY = 380;
        if (this.y + this.height >= groundY) {
            this.y = groundY - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        if (this.x < 0) this.x = 0;
        
        if (this.x + this.width >= canvas.width - 10) {
            this.x = canvas.width - this.width - 10;
            if (!this.stageCleared) {
                this.stageCleared = true;
                checkStageProgression();
            }
        }

        if (this.shieldTimer > 0) {
            this.shieldTimer--;
            if (this.shieldTimer <= 0) this.shieldActive = false;
        }

        broadcast({
            type: 'STATE_UPDATE',
            id: state.myPlayerId,
            playerData: {
                x: this.x, y: this.y, charId: state.selectedCharId,
                name: state.username, shieldActive: this.shieldActive, cleared: this.stageCleared
            }
        });
    },

    draw(x, y, charId, name, shieldActive) {
        const charInfo = CHARACTER_TYPES[charId || 0];
        
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = '11px Courier';
        ctx.fillText(name || state.username, x - 5, y - 10);

        ctx.fillStyle = '#ffcc99'; 
        ctx.fillRect(x + 10, y, 20, 15); 

        ctx.fillStyle = '#111';
        ctx.fillRect(x + 8, y + 2, 24, 4);

        ctx.fillStyle = charInfo.color; 
        ctx.fillRect(x + 5, y + 15, 30, 25); 

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + 5, y + 15, 6, 25);
        ctx.fillRect(x + 29, y + 15, 6, 25);

        ctx.fillStyle = '#000000'; 
        ctx.fillRect(x + 5, y + 40, 10, 10); 
        ctx.fillRect(x + 25, y + 40, 10, 10);

        if (shieldActive) {
            ctx.strokeStyle = '#00ffff'; 
            ctx.lineWidth = 3;
            ctx.beginPath(); 
            ctx.arc(x + 20, y + 25, 35, 0, Math.PI * 2); 
            ctx.stroke();
        }
        ctx.restore();
    }
};

function updateEnemies() {
    enemies.forEach((enemy) => {
        enemy.x += enemy.vx;
        if (enemy.spec.type === 'fly') {
            enemy.y += Math.sin(Date.now() / 200) * 1.5;
        }

        if (enemy.x < -20) enemy.x = canvas.width + 20;

        // Renderiza os Insetos
        ctx.fillStyle = enemy.spec.color;
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.spec.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '14px Arial';
        ctx.fillText(enemy.spec.label, enemy.x - 8, enemy.y + 5);
    });
}

function checkStageProgression() {
    let totalPlayers = 1;
    let clearedPlayers = player.stageCleared ? 1 : 0;

    Object.values(state.players).forEach(p => {
        totalPlayers++;
        if (p.cleared) clearedPlayers++;
    });

    document.getElementById('ui-cleared-count').innerText = `${clearedPlayers}/${totalPlayers}`;

    if (clearedPlayers >= totalPlayers && totalPlayers > 0) {
        state.stage++;
        player.stageCleared = false;
        player.x = 50;
        spawnEnemies();
        document.getElementById('ui-stage').innerText = state.stage;
        broadcast({ type: 'SYNC_STAGE', stage: state.stage, enemies: enemies });
    }
}

function drawBackground() {
    if (state.stage % 2 === 0) {
        if (bgEven.complete && bgEven.naturalWidth !== 0) ctx.drawImage(bgEven, 0, 0, canvas.width, canvas.height);
        else { ctx.fillStyle = '#1a0033'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    } else {
        if (state.stage % 3 === 0 && bgRetro.complete) ctx.drawImage(bgRetro, 0, 0, canvas.width, canvas.height);
        else if (bgModern.complete) ctx.drawImage(bgModern, 0, 0, canvas.width, canvas.height);
        else { ctx.fillStyle = '#050515'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    }

    ctx.fillStyle = '#222';
    ctx.fillRect(0, 380, canvas.width, 70);
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(0, 380, canvas.width, 4);

    ctx.fillStyle = '#ff0000';
    ctx.fillRect(canvas.width - 15, 300, 10, 80);
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground();
    updateEnemies();

    player.update();
    player.draw(player.x, player.y, state.selectedCharId, state.username, player.shieldActive);

    Object.keys(state.players).forEach(id => {
        if (id !== state.myPlayerId) {
            const p = state.players[id];
            player.draw(p.x, p.y, p.charId, p.name, p.shieldActive);
        }
    });

    requestAnimationFrame(gameLoop);
}

// Chat no Topo
const chatInput = document.getElementById('chat-input');
const chatMessages = document.getElementById('chat-messages');

function sendChatMessage() {
    const text = chatInput.value.trim();
    if (text) {
        addChatMessage(state.username || 'Eu', text);
        broadcast({ type: 'CHAT', sender: state.username || 'Jogador', msg: text });
        chatInput.value = '';
    }
}

function addChatMessage(sender, msg) {
    const div = document.createElement('div');
    div.innerHTML = `<strong style="color:#2196F3">${sender}:</strong> ${msg}`;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

document.getElementById('chat-send').onclick = sendChatMessage;
chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });

// Inicialização e Ações
document.getElementById('btn-login').onclick = () => {
    const user = document.getElementById('auth-username').value.trim();
    if (user) {
        state.username = user;
        document.getElementById('modal-auth').classList.add('hidden');
        bgm.play().catch(() => {});
        initMultiplayer();
    }
};

document.getElementById('btn-config').onclick = () => {
    state.isPaused = true;
    document.getElementById('modal-keybinds').classList.remove('hidden');
};

document.getElementById('btn-save-keybinds').onclick = () => {
    state.isPaused = false;
    document.getElementById('modal-keybinds').classList.add('hidden');
};

renderCharacterSelection();
gameLoop();

</script>
</body>
</html>
