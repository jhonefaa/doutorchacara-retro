<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doutor Chácara - Alfabetização Arcade Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    html, body {
      width: 100%; height: 100%; background-color: #0d0d11; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center; overflow: hidden; user-select: none;
    }
    
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000;
    }
    #gameCanvas {
      background: #000; width: 100%; height: 100%; object-fit: contain; display: block;
    }

    /* CONTROLES VIRTUAIS TOUCH COM TRANSPARÊNCIA */
    .touch-controls {
      position: absolute; bottom: 50px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 30px; pointer-events: none; z-index: 5;
    }
    
    #joystick-zone {
      width: 120px; height: 120px; background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(0, 255, 204, 0.5); border-radius: 50%; position: relative;
      pointer-events: auto; touch-action: none;
    }
    #joystick-stick {
      width: 50px; height: 50px; background: rgba(0, 255, 204, 0.7); border-radius: 50%;
      position: absolute; top: 35px; left: 35px;
      box-shadow: 0 0 10px #00ffcc; pointer-events: none;
    }

    .action-buttons { display: flex; gap: 15px; pointer-events: auto; }
    .btn-action {
      width: 65px; height: 65px; border-radius: 50%; font-size: 0.85rem; font-weight: bold;
      border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,255,255,0.3);
      display: flex; justify-content: center; align-items: center; color: #fff;
      opacity: 0.75;
    }
    .btn-jump { background: rgba(0, 136, 255, 0.6); }
    .btn-attack { background: rgba(255, 0, 85, 0.6); }

    #btn-fullscreen {
      position: absolute; top: 15px; right: 15px; background: rgba(0, 255, 204, 0.2);
      border: 1px solid #00ffcc; color: #00ffcc; padding: 8px 15px; border-radius: 20px;
      font-size: 0.8rem; font-weight: bold; cursor: pointer; z-index: 10;
    }
    
    #btn-config-keys {
      position: absolute; bottom: 10px; background: rgba(255, 255, 255, 0.1);
      border: 1px solid #fff; color: #fff; padding: 5px 15px; border-radius: 12px;
      font-size: 0.75rem; cursor: pointer; z-index: 10;
    }

    /* PAINÉIS / MENUS 50% TRANSPARENTES */
    .overlay-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 10, 18, 0.5); 
      backdrop-filter: blur(4px);
      border: 2px solid rgba(0, 255, 204, 0.6);
      border-radius: 20px; padding: 25px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
      z-index: 20; display: none; flex-direction: column; align-items: center; gap: 15px;
      width: 85%; max-width: 480px; color: #fff;
    }

    .overlay-panel h2 { color: #00ffcc; font-size: 1.4rem; text-shadow: 0 0 5px #000; }
    .overlay-panel p { font-size: 1rem; line-height: 1.4; text-shadow: 0 0 5px #000; }
    
    .btn-main {
      background: rgba(0, 255, 204, 0.85); color: #000; font-size: 1rem; font-weight: bold;
      padding: 10px 22px; border-radius: 25px; border: none; cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5); margin: 4px;
      width: 100%; max-width: 320px;
    }

    .btn-sub {
      background: rgba(255, 0, 85, 0.85); color: #fff; font-size: 0.95rem; font-weight: bold;
      padding: 10px 20px; border-radius: 25px; border: none; cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); margin: 4px;
      width: 100%; max-width: 320px;
    }

    .btn-group { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

    input[type="text"] {
      padding: 8px 12px; border-radius: 10px; border: 2px solid #00ffcc;
      background: rgba(17, 17, 17, 0.7); color: #fff; font-size: 1rem; text-align: center; width: 80%;
    }

    .leaderboard-list {
      width: 100%; max-height: 140px; overflow-y: auto; text-align: left;
      font-family: monospace; font-size: 0.85rem; background: rgba(0,0,0,0.4);
      padding: 8px; border-radius: 10px; border: 1px solid #333;
    }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #444; }

    .key-bind-row { display: flex; justify-content: space-between; width: 100%; align-items: center; padding: 5px 0; }
    .key-bind-btn { background: rgba(34, 34, 34, 0.8); border: 1px solid #00ffcc; color: #00ffcc; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="game-container">
    <button id="btn-fullscreen" onclick="toggleFullScreen()">TELA CHEIA ⛶</button>
    <button id="btn-config-keys" onclick="openKeyConfig()">⚙️ CONFIGURAR TECLAS (PC)</button>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- PAINEL INICIAR FASE / TRANSIÇÃO -->
    <div id="panel-stage-start" class="overlay-panel">
      <h2 id="stage-title">FASE 1</h2>
      <p id="stage-instruction">Destrua os alvos solicitados!</p>
      <div id="stage-score-info"></div>
      <button class="btn-main" id="btn-start-action">INICIAR FASE ▶</button>
    </div>

    <!-- PAINEL INTERAÇÃO YOUTUBE (TRANSIÇÃO DE FASE DE 3 BOTÕES) -->
    <div id="panel-youtube-promo" class="overlay-panel">
      <h2>FASE CONCLUÍDA! 🎉</h2>
      <p>Apoie o canal do Doutor Chácara para continuar:</p>
      <div class="btn-group">
        <button class="btn-main" style="background: rgba(255, 0, 0, 0.85); color:#fff;" onclick="handleYtAnswer('inscrever')">🔴 Se inscreva no canal Doutor Chácara</button>
        <button class="btn-main" onclick="handleYtAnswer('sim')">👍 Já é inscrito</button>
        <button class="btn-sub" style="background: rgba(0, 153, 255, 0.85);" onclick="handleYtAnswer('continuar')">▶ Continuar jogo</button>
      </div>
      <div id="yt-feedback-msg" style="margin-top: 10px; font-weight: bold; color: #ffcc00; text-shadow: 0 0 5px #000;"></div>
    </div>

    <!-- PAINEL PAUSA YOUTUBE RETORNO -->
    <div id="panel-yt-return" class="overlay-panel">
      <h2>JOGO PAUSADO ⏸️</h2>
      <p>O jogo está pausado enquanto você visita o canal!</p>
      <button class="btn-main" onclick="resumeGameFromYt()">CONTINUAR JOGO ▶</button>
    </div>

    <!-- PAINEL CONFIGURAÇÃO DE TECLAS (PC) -->
    <div id="panel-key-config" class="overlay-panel">
      <h2>CONFIGURAÇÃO DE TECLAS</h2>
      <div class="key-bind-row">
        <span>Ataque:</span>
        <button class="key-bind-btn" id="bind-attack-btn" onclick="listenKeyChange('attack')">A</button>
      </div>
      <div class="key-bind-row">
        <span>Pulo:</span>
        <button class="key-bind-btn" id="bind-jump-btn" onclick="listenKeyChange('jump')">S</button>
      </div>
      <button class="btn-main" onclick="closeKeyConfig()">SALVAR E FECHAR</button>
    </div>

    <!-- PAINEL GAME OVER & REGISTRO DE NOME -->
    <div id="panel-game-over" class="overlay-panel">
      <h2 style="color: #ff0055;">GAME OVER</h2>
      <p id="game-over-reason">Você perdeu a fase!</p>
      <p>Sua pontuação: <strong id="final-score">0</strong></p>
      <input type="text" id="player-name" placeholder="Digite seu nome" maxlength="12">
      <button class="btn-main" id="btn-save-score">SALVAR RECORD 🔄</button>
      
      <h3 style="margin-top: 5px; color: #ffcc00; font-size: 0.9rem;">🏆 TOP 10 RECORDES</h3>
      <div class="leaderboard-list" id="leaderboard-list"></div>
    </div>

    <div class="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-stick"></div>
      </div>

      <div class="action-buttons">
        <div class="btn-action btn-jump" id="touch-jump">PULO</div>
        <div class="btn-action btn-attack" id="touch-attack">ATAQUE</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    const panelStageStart = document.getElementById("panel-stage-start");
    const panelGameOver = document.getElementById("panel-game-over");
    const panelYtPromo = document.getElementById("panel-youtube-promo");
    const panelYtReturn = document.getElementById("panel-yt-return");
    const panelKeyConfig = document.getElementById("panel-key-config");
    
    const stageTitle = document.getElementById("stage-title");
    const stageInstruction = document.getElementById("stage-instruction");
    const stageScoreInfo = document.getElementById("stage-score-info");
    const finalScoreTxt = document.getElementById("final-score");
    const playerNameInput = document.getElementById("player-name");
    const leaderboardList = document.getElementById("leaderboard-list");
    const btnStartAction = document.getElementById("btn-start-action");
    const btnSaveScore = document.getElementById("btn-save-score");

    // CONFIGURAÇÃO DE CONTROLES DO TECLADO
    const keyBinds = { attack: "KeyA", jump: "KeyS" };
    let listeningKeyAction = null;

    // SINTETIZADOR DE ÁUDIO
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'attack') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'hitTarget') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'hitWrong') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'ufo') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 1.5);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        osc.start(); osc.stop(audioCtx.currentTime + 1.5);
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // VARIÁVEIS DE JOGO
    let currentStage = 1;
    const maxStages = 27;
    let score = 0;
    let gameOver = false;
    let stageStarted = false;
    let stageMissionText = "";
    let walkCycle = 0;
    let sunAngle = 0;
    let gameTimerSeconds = 0;

    // ANIMAÇÃO DE COLISÃO / GAME OVER
    let collisionAnimationActive = false;
    let collisionAnimTimer = 0;
    let playerSpeechBubble = "";
    let enemySpeechBubble = "";
    let mockingEnemy = null;

    const positiveFrases = [
      "Vou ficar mais atento!",
      "Cada erro é um aprendizado!",
      "Não desisto, vou conseguir!",
      "Atenção dobrada na próxima!",
      "A prática leva à perfeição!"
    ];

    // INTRO ANIMAÇÃO DISCO VOADOR
    let isIntroPlaying = false;
    let ufoState = { x: -100, y: 50, beamOpacity: 0, playerY: -100, step: 0 };

    const player = {
      x: 50, y: 280, width: 30, height: 65,
      vx: 0, vy: 0, speed: 4.8, friction: 0.82,
      grounded: false, crouching: false, facing: 'right', aimingUp: false,
      attacking: false, attackTimer: 0, attackMaxTime: 12,
      hasGreenCoat: false, shieldPowerUp: false
    };

    const gravity = 0.65;
    const groundY = 370;
    const weapon = { x: 0, y: 0, length: 0, baseMaxLength: 150 };

    // ITENS / POWER-UPS
    let notebookItem = null;
    let greenCoatItem = null;

    const aerialSymbols = ['plane', 'helicopter', 'balloon', 'rocket', 'ufo_mini', 'bird', 'dragon', 'blimp'];

    const stageRules = {
      1: {
        title: "FASE 1: LETRAS MINÚSCULAS",
        instruction: "ATENÇÃO: Destrua APENAS as letras MINÚSCULAS (a-f)!",
        isValid: (char) => char === char.toLowerCase() && isNaN(char),
        generateChar: () => ['A','B','C','D','E','F','a','b','c','d','e','f'][Math.floor(Math.random() * 12)]
      },
      2: {
        title: "FASE 2: NÚMEROS PARES",
        instruction: "ATENÇÃO: Destrua APENAS os NÚMEROS PARES!",
        isValid: (char) => !isNaN(char) && parseInt(char) % 2 === 0,
        generateChar: () => ['1','2','3','4','5','6','7','8','9'][Math.floor(Math.random() * 9)]
      }
    };

    function getRuleForStage(stage) {
      if (stageRules[stage]) return stageRules[stage];
      return {
        title: `FASE ${stage}: DESAFIO DE VOGAIS`,
        instruction: "ATENÇÃO: Destrua APENAS as VOGAIS!",
        isValid: (char) => ['A','E','I','O','U'].includes(char.toUpperCase()),
        generateChar: () => ['A','B','E','F','I','K','O','P','U'][Math.floor(Math.random() * 9)]
      };
    }

    const enemies = [];
    let aerialVehicle = { x: -100, y: 80, speed: 1.5, type: 'plane' };

    function prepareStage() {
      enemies.length = 0;
      const currentRule = getRuleForStage(currentStage);
      stageMissionText = currentRule.instruction;
      stageStarted = false;

      stageTitle.innerText = currentRule.title;
      stageInstruction.innerText = currentRule.instruction;
      
      const topRecord = getTopScores()[0] || { name: 'Ninguém', score: 0 };
      stageScoreInfo.innerHTML = `Pontuação Atual: <strong>${score}</strong><br>Recorde do Jogo: <strong>${topRecord.score}</strong> (${topRecord.name})`;
      
      panelStageStart.style.display = "flex";
      panelGameOver.style.display = "none";
      panelYtPromo.style.display = "none";

      if (currentStage > 1) {
        const symbolType = aerialSymbols[(currentStage - 2) % aerialSymbols.length];
        aerialVehicle = { x: -80, y: 60 + Math.random() * 40, speed: 1.2 + Math.random() * 0.8, type: symbolType };
      }

      // Gera Caderno aleatório na fase
      if (Math.random() > 0.3) {
        notebookItem = { x: 200 + Math.random() * 400, y: groundY - 30, width: 25, height: 25, active: true };
      } else {
        notebookItem = null;
      }

      const count = 4 + Math.floor(currentStage * 0.5);
      for (let i = 0; i < count; i++) {
        const charSymbol = currentRule.generateChar();
        enemies.push({
          x: 450 + i * 150 + Math.random() * 30,
          y: groundY - 40, width: 28, height: 40,
          speed: 1.4 + (currentStage * 0.1), alive: true,
          symbol: charSymbol, isTarget: currentRule.isValid(charSymbol),
          dir: -1, expression: 'normal', mockOffset: 0
        });
      }
    }

    function startStage() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      panelStageStart.style.display = "none";
      
      if (currentStage === 1) {
        isIntroPlaying = true;
        ufoState = { x: -100, y: 80, beamOpacity: 0, playerY: 80, step: 0 };
        playSound('ufo');
        speakText("Doutor Chácara foi trazido pelo Disco Voador. Prepare-se!");
      } else {
        stageStarted = true;
        const currentRule = getRuleForStage(currentStage);
        speakText(`${currentRule.title}. ${currentRule.instruction}`);
      }
    }

    btnStartAction.addEventListener("click", startStage);
    btnSaveScore.addEventListener("click", saveScoreAndRestart);

    // CRONÔMETRO DE JOGO (JALECO VERDE A CADA 5 MINUTOS)
    setInterval(() => {
      if (stageStarted && !gameOver && !isIntroPlaying) {
        gameTimerSeconds++;
        if (gameTimerSeconds % 300 === 0) { // 300 segundos = 5 minutos
          greenCoatItem = { x: 300 + Math.random() * 200, y: groundY - 35, width: 30, height: 30, active: true };
        }
      }
    }, 1000);

    // CONFIGURAÇÃO DE TECLAS DO PC
    function openKeyConfig() { panelKeyConfig.style.display = "flex"; }
    function closeKeyConfig() { panelKeyConfig.style.display = "none"; }
    function listenKeyChange(action) {
      listeningKeyAction = action;
      const btn = document.getElementById(`bind-${action}-btn`);
      btn.innerText = "Pressione uma tecla...";
    }

    window.addEventListener("keydown", (e) => {
      if (listeningKeyAction) {
        keyBinds[listeningKeyAction] = e.code;
        document.getElementById(`bind-${listeningKeyAction}-btn`).innerText = e.key.toUpperCase();
        listeningKeyAction = null;
        return;
      }
      keys[e.code] = true;
    });

    // TRANSIÇÃO DE FASE INTERATIVA (YOUTUBE)
    function openYoutubePromo() {
      document.getElementById("yt-feedback-msg").innerText = "";
      panelYtPromo.style.display = "flex";
      speakText("Se inscreva no canal do Doutor Chácara!");
    }

    function handleYtAnswer(option) {
      const msgBox = document.getElementById("yt-feedback-msg");
      if (option === 'inscrever') {
        window.open("https://www.youtube.com/@DoutorChacara", "_blank");
        panelYtPromo.style.display = "none";
        panelYtReturn.style.display = "flex";
      } else if (option === 'sim') {
        msgBox.innerText = "Muito obrigado por fazer parte do nosso canal! 💙";
        speakText("Muito obrigado por fazer parte do nosso canal!");
        setTimeout(() => { panelYtPromo.style.display = "none"; advanceToNextStage(); }, 1500);
      } else if (option === 'continuar') {
        panelYtPromo.style.display = "none";
        advanceToNextStage();
      }
    }

    function resumeGameFromYt() {
      panelYtReturn.style.display = "none";
      advanceToNextStage();
    }

    function advanceToNextStage() {
      currentStage++; player.x = 20;
      prepareStage();
    }

    function getTopScores() {
      const data = localStorage.getItem("dr_chacara_scores");
      return data ? JSON.parse(data) : [];
    }

    function renderLeaderboard() {
      const scores = getTopScores();
      leaderboardList.innerHTML = scores.map((s, i) => `
        <div class="leaderboard-item">
          <span>#${i+1} ${s.name}</span>
          <span>${s.score} pts</span>
        </div>
      `).join('') || '<div>Nenhum recorde ainda!</div>';
    }

    function saveScoreAndRestart() {
      const name = playerNameInput.value.trim() || "Jogador";
      const scores = getTopScores();
      scores.push({ name: name, score: score });
      scores.sort((a, b) => b.score - a.score);
      const top10 = scores.slice(0, 10);
      localStorage.setItem("dr_chacara_scores", JSON.stringify(top10));

      resetGame();
    }

    function triggerGameOverSequence(enemyRef, reason) {
      collisionAnimationActive = true;
      collisionAnimTimer = 0;
      mockingEnemy = enemyRef;
      
      // Escolhe frase positiva aleatória para o jogador
      playerSpeechBubble = positiveFrases[Math.floor(Math.random() * positiveFrases.length)];
      enemySpeechBubble = "Você não consegue me vencer! Kkkk";
      
      playSound('hitWrong');
      speakText(playerSpeechBubble);

      let animInterval = setInterval(() => {
        collisionAnimTimer += 0.2;
        if (mockingEnemy) mockingEnemy.mockOffset = Math.sin(collisionAnimTimer * 5) * 8; // Animação da letra mangando
        
        if (collisionAnimTimer >= 3.5) {
          clearInterval(animInterval);
          collisionAnimationActive = false;
          gameOver = true;
          document.getElementById("game-over-reason").innerText = reason;
          finalScoreTxt.innerText = score;
          renderLeaderboard();
          panelGameOver.style.display = "flex";
        }
      }, 50);
    }

    // CONTROLES JOYSTICK
    const joyZone = document.getElementById("joystick-zone");
    const joyStick = document.getElementById("joystick-stick");
    let joyActive = false;
    let joyVector = { x: 0, y: 0 };

    joyZone.addEventListener("pointerdown", (e) => { joyActive = true; updateJoystick(e); });
    window.addEventListener("pointermove", (e) => { if (joyActive) updateJoystick(e); });
    window.addEventListener("pointerup", () => {
      joyActive = false; joyVector = { x: 0, y: 0 };
      joyStick.style.top = "35px"; joyStick.style.left = "35px";
    });

    function updateJoystick(e) {
      const rect = joyZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = e.clientX - centerX;
      let dy = e.clientY - centerY;
      const dist = Math.hypot(dx, dy);
      const maxDist = 40;

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      joyStick.style.left = `${35 + dx}px`;
      joyStick.style.top = `${35 + dy}px`;

      joyVector.x = dx / maxDist;
      joyVector.y = dy / maxDist;
    }

    document.getElementById("touch-jump").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (player.grounded && stageStarted && !gameOver) { player.vy = -12.5; player.grounded = false; }
    });

    document.getElementById("touch-attack").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (!player.attacking && stageStarted && !gameOver) {
        player.attacking = true; player.attackTimer = player.attackMaxTime;
        playSound('attack');
      }
    });

    function resetGame() {
      gameOver = false; score = 0; currentStage = 1; gameTimerSeconds = 0;
      player.x = 50; player.y = groundY - player.height; player.vx = 0; player.vy = 0;
      player.hasGreenCoat = false; player.shieldPowerUp = false;
      prepareStage();
    }

    const keys = {};
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    function updateIntro() {
      if (!isIntroPlaying) return;

      if (ufoState.step === 0) {
        ufoState.x += 3;
        if (ufoState.x >= 100) ufoState.step = 1;
      } else if (ufoState.step === 1) {
        ufoState.beamOpacity += 0.05;
        if (ufoState.beamOpacity >= 1) ufoState.step = 2;
      } else if (ufoState.step === 2) {
        ufoState.playerY += 2.5;
        if (ufoState.playerY >= groundY - player.height) {
          ufoState.playerY = groundY - player.height;
          ufoState.step = 3;
        }
      } else if (ufoState.step === 3) {
        ufoState.beamOpacity -= 0.05;
        if (ufoState.beamOpacity <= 0) {
          ufoState.x += 4;
          if (ufoState.x > canvas.width + 100) {
            isIntroPlaying = false;
            stageStarted = true;
            player.x = 100; player.y = groundY - player.height;
            const currentRule = getRuleForStage(currentStage);
            speakText(`${currentRule.title}. ${currentRule.instruction}`);
          }
        }
      }
    }

    function update() {
      sunAngle += 0.01;

      if (currentStage > 1) {
        aerialVehicle.x += aerialVehicle.speed;
        if (aerialVehicle.x > canvas.width + 100) aerialVehicle.x = -100;
      }

      if (isIntroPlaying) { updateIntro(); return; }
      if (gameOver || !stageStarted || collisionAnimationActive) return;

      const moveX = joyVector.x || (keys["ArrowRight"] ? 1 : keys["ArrowLeft"] ? -1 : 0);
      const moveY = joyVector.y || (keys["ArrowDown"] ? 1 : keys["ArrowUp"] ? -1 : 0);

      player.aimingUp = moveY < -0.4;
      player.crouching = moveY > 0.4 && player.grounded;

      if (Math.abs(moveX) > 0.2 && !player.crouching) {
        player.vx = moveX * player.speed;
        player.facing = moveX > 0 ? 'right' : 'left';
        walkCycle += 0.25;
      } else {
        walkCycle = 0;
      }

      if (keys[keyBinds.jump] && player.grounded) {
        player.vy = -12.5; player.grounded = false;
      }

      if (keys[keyBinds.attack] && !player.attacking) {
        player.attacking = true; player.attackTimer = player.attackMaxTime;
        playSound('attack');
      }

      player.vx *= player.friction; player.x += player.vx;
      player.vy += gravity; player.y += player.vy;

      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height; player.vy = 0; player.grounded = true;
      }

      if (player.x < 0) player.x = 0;

      // Coleta do Caderno (Power-up Escudo Longo)
      if (notebookItem && notebookItem.active) {
        if (player.x < notebookItem.x + notebookItem.width && player.x + player.width > notebookItem.x &&
            player.y < notebookItem.y + notebookItem.height && player.y + player.height > notebookItem.y) {
          notebookItem.active = false;
          player.shieldPowerUp = true;
          playSound('powerup');
        }
      }

      // Coleta do Jaleco Verde (Invencibilidade)
      if (greenCoatItem && greenCoatItem.active) {
        if (player.x < greenCoatItem.x + greenCoatItem.width && player.x + player.width > greenCoatItem.x &&
            player.y < greenCoatItem.y + greenCoatItem.height && player.y + player.height > greenCoatItem.y) {
          greenCoatItem.active = false;
          player.hasGreenCoat = true;
          playSound('powerup');
        }
      }

      // Conclusão da Fase (Gatilho da Tela Interativa do YouTube)
      if (player.x + player.width >= canvas.width) {
        if (currentStage < maxStages) {
          stageStarted = false;
          openYoutubePromo();
        } else {
          speakText("Parabéns! Você completou todas as fases!");
          triggerGameOverSequence(null, "Parabéns! Você completou o jogo!");
        }
      }

      // Ataque do Escudo
      if (player.attacking) {
        player.attackTimer--;
        const maxLen = player.shieldPowerUp ? weapon.baseMaxLength * 1.5 : weapon.baseMaxLength;
        const progress = 1 - (player.attackTimer / player.attackMaxTime);
        weapon.length = Math.sin(progress * Math.PI) * maxLen;

        if (player.aimingUp) {
          weapon.x = player.x + player.width / 2; weapon.y = player.y - weapon.length;
        } else if (player.crouching) {
          weapon.y = player.y + player.height - 15;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        } else {
          weapon.y = player.y + 25;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        }

        if (player.attackTimer <= 0) player.attacking = false;
      }

      // Inimigos e Colisão
      enemies.forEach(enemy => {
        if (!enemy.alive) return;

        enemy.x += enemy.speed * enemy.dir;
        if (enemy.x < -50) enemy.x = canvas.width + 50;

        // Escudo atinge o inimigo
        if (player.attacking) {
          const hit = (enemy.x < weapon.x + 20 && enemy.x + enemy.width > weapon.x - 20 &&
                       enemy.y < weapon.y + 20 && enemy.y + enemy.height > weapon.y - 20);
          if (hit) {
            if (enemy.isTarget) {
              enemy.expression = 'sad';
              playSound('hitTarget');
              score += 500;
              setTimeout(() => { enemy.alive = false; }, 120);
            } else {
              enemy.expression = 'sad';
              triggerGameOverSequence(enemy, "Você destruiu o elemento incorreto!");
            }
          }
        }

        // Toque entre Letra e Personagem
        const padding = 5;
        const playerBox = { left: player.x + padding, right: player.x + player.width - padding, top: player.y + padding, bottom: player.y + player.height };
        const enemyBox = { left: enemy.x + padding, right: enemy.x + enemy.width - padding, top: enemy.y + padding, bottom: enemy.y + enemy.height };

        if (enemy.alive &&
            playerBox.left < enemyBox.right && playerBox.right > enemyBox.left &&
            playerBox.top < enemyBox.bottom && playerBox.bottom > enemyBox.top) {
          
          if (player.hasGreenCoat) {
            // Proteção do Jaleco Verde absorve o choque
            player.hasGreenCoat = false;
            enemy.x += 80; // Empurra a letra de volta
            playSound('powerup');
          } else {
            enemy.expression = 'happy';
            triggerGameOverSequence(enemy, "A letra encostou em você!");
          }
        }
      });
    }

    // BALÃO DE FALA GRANDE (3X MAIOR)
    function drawSpeechBubble(x, y, text, scaleFactor, isPlayer) {
      ctx.save();
      ctx.translate(x, y);

      ctx.font = "bold 12px 'Segoe UI'";
      const textWidth = ctx.measureText(text).width;
      const bw = Math.max(textWidth + 20, 100) * scaleFactor;
      const bh = 45 * scaleFactor;

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.roundRect(-bw / 2, -bh - 15, bw, bh, 10);
      ctx.fill(); ctx.stroke();

      // Rabicho do Balão
      ctx.beginPath();
      ctx.moveTo(-5, -15); ctx.lineTo(0, 0); ctx.lineTo(5, -15);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#000000";
      ctx.font = `bold ${10 * scaleFactor}px 'Segoe UI'`;
      ctx.textAlign = "center";
      ctx.fillText(text, 0, -bh / 2 - 10);

      ctx.restore();
    }

    function drawAnimatedSun(x, y, radius) {
      ctx.save();
      ctx.translate(x, y);

      ctx.strokeStyle = "rgba(255, 204, 0, 0.5)";
      ctx.lineWidth = 3;
      const numRays = 12;
      for (let i = 0; i < numRays; i++) {
        const angle = sunAngle + (i * Math.PI * 2) / numRays;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * (radius + 5), Math.sin(angle) * (radius + 5));
        ctx.lineTo(Math.cos(angle) * (radius + 20), Math.sin(angle) * (radius + 20));
        ctx.stroke();
      }

      const pulse = Math.sin(sunAngle * 3) * 3;
      ctx.fillStyle = "#ffcc00";
      ctx.beginPath();
      ctx.arc(0, 0, radius + pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawAerialVehicle(vehicle) {
      ctx.save();
      ctx.translate(vehicle.x, vehicle.y);
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 2;

      if (vehicle.type === 'plane') {
        ctx.beginPath(); ctx.ellipse(0, 0, 25, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillRect(-5, -18, 8, 36); ctx.fillRect(-22, -10, 6, 12);
      } else if (vehicle.type === 'helicopter') {
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillRect(-20, -2, 18, 4);
        const prop = Math.sin(Date.now() * 0.05) * 20; ctx.strokeRect(-prop, -16, prop * 2, 2);
      } else if (vehicle.type === 'balloon') {
        ctx.beginPath(); ctx.arc(0, -10, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ff0055"; ctx.fillRect(-4, 10, 8, 8);
      } else if (vehicle.type === 'rocket') {
        ctx.beginPath(); ctx.ellipse(0, 0, 20, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ffcc00"; ctx.fillRect(-25, -3, 8, 6);
      }

      ctx.restore();
    }

    function drawShieldWeapon(x, y) {
      ctx.save();
      ctx.translate(x, y);

      const w = player.shieldPowerUp ? 45 : 35;
      const h = player.shieldPowerUp ? 52 : 42;
      ctx.fillStyle = player.shieldPowerUp ? "#ffcc00" : "#00ffcc";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(-w/2, -h/2);
      ctx.lineTo(w/2, -h/2);
      ctx.lineTo(w/2, 0);
      ctx.quadraticCurveTo(w/2, h/2, 0, h/2 + 5);
      ctx.quadraticCurveTo(-w/2, h/2, -w/2, 0);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#000000";
      ctx.font = "bold 10px 'Segoe UI'";
      ctx.textAlign = "center";
      ctx.fillText("Dr.", 0, -5);
      ctx.font = "bold 8px 'Segoe UI'";
      ctx.fillText("Chácara", 0, 8);

      ctx.restore();
    }

    // PERSONAGEM DR. CHÁCARA COM ANIMAÇÃO DE PERNAS REALISTA
    function drawDrChacaraSide(x, y, facing, crouching) {
      ctx.save();
      ctx.translate(x + player.width / 2, y);
      if (facing === 'left') ctx.scale(-1, 1);

      const legAngle = Math.sin(walkCycle) * 25;
      const armAngle = Math.sin(walkCycle) * 30;
      const h = crouching ? 45 : 65;

      // Animação Alternada das Pernas
      ctx.strokeStyle = "#1a1a24"; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-3, h - 25); ctx.lineTo(-3 - Math.sin((-legAngle * Math.PI)/180) * 16, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, h - 25); ctx.lineTo(3 + Math.sin((legAngle * Math.PI)/180) * 16, h); ctx.stroke();

      // Tronco e Jaleco (Muda para verde se tiver o Jaleco Especial)
      ctx.fillStyle = "#0066cc"; ctx.fillRect(-7, crouching ? 15 : 18, 14, 22);
      ctx.fillStyle = player.hasGreenCoat ? "#00ff66" : "#ffffff"; 
      ctx.fillRect(-9, crouching ? 10 : 16, 18, crouching ? 18 : 26);

      // Rosto
      ctx.fillStyle = "#f3c099"; ctx.fillRect(-3, 0, 15, 16);
      ctx.fillStyle = "#111111"; ctx.fillRect(-5, -1, 16, 4);
      ctx.fillStyle = "#5A5A66"; ctx.fillRect(-6, -6, 18, 6);
      
      ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5; ctx.strokeRect(3, 3, 6, 5);
      ctx.beginPath(); ctx.moveTo(-3, 5); ctx.lineTo(3, 5); ctx.stroke();

      // Braços
      ctx.strokeStyle = "#f3c099"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-3, crouching ? 18 : 22); ctx.lineTo(-3 - Math.sin((armAngle * Math.PI)/180) * 12, (crouching ? 18 : 22) + 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, crouching ? 18 : 22); ctx.lineTo(3 + Math.sin((armAngle * Math.PI)/180) * 12, (crouching ? 18 : 22) + 12); ctx.stroke();

      ctx.restore();
    }

    function drawLetterEnemy(enemy) {
      if (!enemy.alive) return;

      ctx.save();
      ctx.translate(enemy.x + enemy.width / 2, enemy.y + (enemy.mockOffset || 0));

      const legCycle = Math.sin(Date.now() * 0.01 + enemy.x) * 10;

      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-6, enemy.height - 8); ctx.lineTo(-6 + legCycle, enemy.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6, enemy.height - 8); ctx.lineTo(6 - legCycle, enemy.height); ctx.stroke();

      ctx.fillStyle = enemy.isTarget ? "#00ffcc" : "#ff0055";
      ctx.font = "bold 30px 'Segoe UI'"; ctx.textAlign = "center";
      ctx.fillText(enemy.symbol, 0, enemy.height - 10);

      ctx.fillStyle = "#ffffff"; ctx.font = "bold 11px 'Segoe UI'";
      if (enemy.expression === 'happy') {
        ctx.fillText(":D", 12, 12);
      } else if (enemy.expression === 'sad') {
        ctx.fillText(":(", 12, 12);
      }

      ctx.restore();
    }

    function draw() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#120826"); grad.addColorStop(0.6, "#7a223b"); grad.addColorStop(1, "#2e1200");
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawAnimatedSun(680, 120, 42);

      if (currentStage > 1) drawAerialVehicle(aerialVehicle);

      ctx.fillStyle = "#26150d"; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.fillStyle = "#00ffcc"; ctx.fillRect(0, groundY, canvas.width, 3);

      // Desenho do Caderno (Power-up)
      if (notebookItem && notebookItem.active) {
        ctx.fillStyle = "#0088ff"; ctx.fillRect(notebookItem.x, notebookItem.y, notebookItem.width, notebookItem.height);
        ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.fillText("📖", notebookItem.x + 5, notebookItem.y + 16);
      }

      // Desenho do Jaleco Verde (Power-up)
      if (greenCoatItem && greenCoatItem.active) {
        ctx.fillStyle = "#00ff66"; ctx.fillRect(greenCoatItem.x, greenCoatItem.y, greenCoatItem.width, greenCoatItem.height);
        ctx.fillStyle = "#000"; ctx.font = "bold 10px sans-serif"; ctx.fillText("🥼", greenCoatItem.x + 6, greenCoatItem.y + 18);
      }

      if (isIntroPlaying) {
        if (ufoState.beamOpacity > 0) {
          ctx.fillStyle = `rgba(0, 255, 204, ${ufoState.beamOpacity * 0.4})`;
          ctx.beginPath();
          ctx.moveTo(ufoState.x - 15, ufoState.y); ctx.lineTo(ufoState.x + 15, ufoState.y);
          ctx.lineTo(ufoState.x + 45, groundY); ctx.lineTo(ufoState.x - 45, groundY);
          ctx.closePath(); ctx.fill();
        }

        ctx.fillStyle = "#00ffcc"; ctx.beginPath(); ctx.ellipse(ufoState.x, ufoState.y, 35, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(ufoState.x, ufoState.y - 6, 15, 0, Math.PI, true); ctx.fill();

        drawDrChacaraSide(ufoState.x - player.width / 2, ufoState.playerY, 'right', false);
      } else {
        drawDrChacaraSide(player.x, player.y, player.facing, player.crouching);
      }

      if (player.attacking && !isIntroPlaying) {
        ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 4; ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y + 25); ctx.lineTo(weapon.x, weapon.y); ctx.stroke();
        drawShieldWeapon(weapon.x, weapon.y);
      }

      enemies.forEach(enemy => drawLetterEnemy(enemy));

      // DESENHO DOS BALÕES DE FALA (3X MAIORES) EM COLISÃO
      if (collisionAnimationActive) {
        drawSpeechBubble(player.x + player.width / 2, player.y - 20, playerSpeechBubble, 1.8, true);
        if (mockingEnemy) {
          drawSpeechBubble(mockingEnemy.x + mockingEnemy.width / 2, mockingEnemy.y - 20, enemySpeechBubble, 1.8, false);
        }
      }

      const currentRule = getRuleForStage(currentStage);
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "left";
      ctx.fillText(`${currentRule.title}`, 20, 30);
      ctx.fillText(`PONTOS: ${score}`, 650, 30);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    
    prepareStage();
    loop();
  </script>
</body>
