<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doutor Chácara - Arcade Multiplayer v3.4</title>
    <!-- PeerJS para Conexão Multiplayer Online P2P Corrigida -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #111; font-family: 'Courier New', Courier, monospace; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 56.25vw; 
            max-width: 800px; 
            max-height: 450px; 
            background: #000; 
            overflow: hidden; 
            border: 2px solid #fff; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2); 
        }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        .ui-panel { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; text-shadow: 2px 2px #000; z-index: 10; pointer-events: none; }
        .btn-ui { background: #333; color: #fff; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; pointer-events: auto; font-family: inherit; font-size: 11px; }
        .btn-ui:active { background: #555; }
        
        #touch-controls { position: absolute; bottom: 8px; left: 10px; right: 10px; height: 90px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .joystick-zone { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; position: relative; }
        .joystick-knob { width: 32px; height: 32px; background: rgba(255,255,255,0.8); border-radius: 50%; position: absolute; top: 22px; left: 22px; }
        .action-buttons { display: flex; gap: 8px; }
        .btn-action { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; font-weight: bold; font-size: 11px; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px #000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 0 #000; }
        #btn-jump { background: #2196F3; }
        #btn-attack { background: #4CAF50; }
        #btn-special { background: #FF9800; }

        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; padding: 10px; text-align: center; box-sizing: border-box; }
        .hidden { display: none !important; }
        .modal input { padding: 6px; font-size: 12px; text-align: center; margin: 4px 0; font-family: inherit; width: 80%; max-width: 250px; }
        .modal button { padding: 6px 12px; font-size: 11px; cursor: pointer; background: #fff; color: #000; border: none; font-weight: bold; margin-top: 6px; }
        
        /* Seleção de Personagens */
        .char-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 320px; width: 100%; margin: 8px 0; }
        .char-card { border: 2px solid #555; padding: 6px; cursor: pointer; border-radius: 4px; font-size: 9px; background: rgba(255,255,255,0.05); }
        .char-card.selected { border-color: #4CAF50; background: rgba(76, 175, 80, 0.3); }
        .char-preview { width: 20px; height: 20px; margin: 0 auto 4px auto; border-radius: 2px; }

        /* Chat Relocado e Elevado para Não Atrapalhar */
        #chat-box { position: absolute; top: 35px; right: 10px; width: 190px; height: 85px; background: rgba(0,0,0,0.7); border: 1px solid #4caf50; display: flex; flex-direction: column; z-index: 15; font-size: 9px; border-radius: 4px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 4px; text-align: left; }
        #chat-input-container { display: flex; }
        #chat-input { flex: 1; background: #111; color: #fff; border: none; padding: 4px; font-size: 9px; }
        #chat-send { background: #4caf50; border: none; color: white; padding: 4px 6px; cursor: pointer; font-weight: bold; }

        .yt-banner { color: #ff0000; font-weight: bold; margin-bottom: 6px; text-decoration: none; border: 1px solid red; padding: 4px 8px; border-radius: 4px; background: rgba(255,0,0,0.1); font-size: 11px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="ui-panel">
        <div>
            <div>FASE: <span id="ui-stage">1</span> | PONTOS: <span id="ui-score">0</span></div>
            <div>VIDAS: <span id="ui-lives">❤️❤️❤️</span> | JOGADORES NA SALA: <span id="ui-players-count">1/6</span> | CONCLUÍDO: <span id="ui-cleared-count">0/1</span></div>
        </div>
        <div>
            <button class="btn-ui" id="btn-config">⚙️ CONTROLES</button>
        </div>
    </div>

    <!-- Chat ao Vivo no Alto da Tela -->
    <div id="chat-box">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Chat ao vivo..." maxlength="50">
            <button id="chat-send">▶</button>
        </div>
    </div>

    <div id="touch-controls">
        <div class="joystick-zone" id="joystick-zone">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <div class="btn-action" id="btn-attack">ESC.U</div>
            <div class="btn-action" id="btn-special">REL.I</div>
            <div class="btn-action" id="btn-jump">PULO</div>
        </div>
    </div>

    <!-- Modal Inicial de Entrada -->
    <div id="modal-auth" class="modal">
        <h2 style="color: #ffeb3b; margin-bottom: 2px;">DOUTOR CHÁCARA</h2>
        <a href="https://www.youtube.com" target="_blank" class="yt-banner">📺 Inscreva-se no Canal Doutor Chácara!</a>
        
        <input type="text" id="auth-username" placeholder="Nome do Jogador" value="Doutor Chácara">
        <p style="font-size:10px; margin-top: 4px; color: #4CAF50;">ESCOLHA SEU PERSONAGEM:</p>
        <div class="char-select-grid" id="char-grid"></div>

        <button id="btn-login" style="background:#4CAF50; color:white;">ENTRAR E JOGAR JUNTO</button>
    </div>
</div>

<script>
/**
 * DOUTOR CHÁCARA - ARCADE MULTIPLAYER v3.4 (Conexão e Sincronização Corrigida)
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Trilha Sonora Arcade sem Direitos Autorais
const bgm = new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a7315b.mp3?filename=8-bit-arcade-138828.mp3');
bgm.loop = true;
bgm.volume = 0.25;

const CHARACTER_TYPES = [
    { id: 0, name: 'Doutor Chácara', color: '#003366' },
    { id: 1, name: 'Pai do Doutor', color: '#8A2BE2' },
    { id: 2, name: 'Irmã do Doutor', color: '#FF69B4' },
    { id: 3, name: 'Filho do Doutor', color: '#00E5FF' },
    { id: 4, name: 'Filha do Doutor', color: '#FFD700' },
    { id: 5, name: 'Tio do Doutor', color: '#2E8B57' }
];

const state = {
    selectedCharId: 0,
    myPlayerId: 'p_' + Math.floor(Math.random() * 10000),
    username: 'Doutor Chácara',
    stage: 1,
    players: {},
    keyMap: { left: 'KeyA', right: 'KeyD', jump: 'KeyU', attack: 'KeyU' }
};

// Configuração dos Insetos Inimigos
const INSECT_TYPES = [
    { type: 'spider', color: '#8B0000', speed: 1.2, label: '🕷️' },
    { type: 'fly', color: '#708090', speed: 2.2, label: '🪰' },
    { type: 'bee', color: '#FFD700', speed: 1.8, label: '🐝' }
];

let enemies = [];

function spawnEnemies() {
    enemies = [];
    const count = 3 + state.stage * 2;
    for (let i = 0; i < count; i++) {
        const spec = INSECT_TYPES[i % INSECT_TYPES.length];
        enemies.push({
            x: 350 + (i * 90),
            y: spec.type === 'spider' ? 360 : 220 + (i * 20) % 100,
            spec: spec,
            vx: -spec.speed
        });
    }
}

function renderCharacterSelection() {
    const grid = document.getElementById('char-grid');
    grid.innerHTML = '';
    CHARACTER_TYPES.forEach((char) => {
        const card = document.createElement('div');
        card.className = `char-card ${char.id === state.selectedCharId ? 'selected' : ''}`;
        card.onclick = () => {
            state.selectedCharId = char.id;
            renderCharacterSelection();
        };

        const preview = document.createElement('div');
        preview.className = 'char-preview';
        preview.style.backgroundColor = char.color;

        const name = document.createElement('div');
        name.innerText = char.name;

        card.appendChild(preview);
        card.appendChild(name);
        grid.appendChild(card);
    });
}

// Lógica de Conexão em Tempo Real Sem Falhas
let peer = null;
let activeConnections = {};
const ROOM_ID = 'dc_sala_principal_oficial_v34';

function connectNetwork() {
    peer = new Peer(ROOM_ID);

    peer.on('open', () => {
        // Criador da Sala Principal
        spawnEnemies();
    });

    peer.on('error', (err) => {
        // Conecta como membro da Sala
        peer = new Peer(state.myPlayerId);
        peer.on('open', () => {
            const conn = peer.connect(ROOM_ID);
            bindEvents(conn);
        });
    });

    peer.on('connection', (conn) => {
        bindEvents(conn);
        // Sincroniza a fase atual do mapa imediatamente para o novo participante
        conn.on('open', () => {
            conn.send({ type: 'STAGE_SYNC', stage: state.stage, enemies: enemies });
        });
    });
}

function bindEvents(conn) {
    conn.on('data', (data) => {
        if (data.type === 'POS_UPDATE') {
            state.players[data.id] = data.player;
            updateRoomUI();
            checkStageAdvance();
        } else if (data.type === 'STAGE_SYNC') {
            state.stage = data.stage;
            enemies = data.enemies || [];
            player.x = 50;
            player.stageCleared = false;
            document.getElementById('ui-stage').innerText = state.stage;
        } else if (data.type === 'CHAT') {
            addChatMessage(data.sender, data.msg);
        }
    });
    activeConnections[conn.peer] = conn;
}

function sendToAll(data) {
    Object.values(activeConnections).forEach(c => {
        if (c && c.open) c.send(data);
    });
}

function updateRoomUI() {
    const count = Object.keys(state.players).length + 1;
    document.getElementById('ui-players-count').innerText = `${count}/6`;
}

// Teclas
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

const player = {
    x: 50, y: 330, width: 40, height: 50, vx: 0, vy: 0, speed: 5,
    jumpPower: -12, grounded: true, shieldActive: false, shieldTimer: 0, stageCleared: false,

    update() {
        let moveX = 0;
        if (keys[state.keyMap.left]) moveX = -1;
        if (keys[state.keyMap.right]) moveX = 1;

        this.vx = moveX * this.speed;

        if (keys[state.keyMap.jump] && this.grounded) {
            this.vy = this.jumpPower;
            this.grounded = false;
        }

        this.vy += 0.6;
        this.x += this.vx;
        this.y += this.vy;

        if (this.y + this.height >= 380) {
            this.y = 380 - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        if (this.x < 0) this.x = 0;

        // Linha de Fim de Fase
        if (this.x + this.width >= canvas.width - 20) {
            this.x = canvas.width - this.width - 20;
            if (!this.stageCleared) {
                this.stageCleared = true;
                checkStageAdvance();
            }
        }

        // Transmissão das posições
        sendToAll({
            type: 'POS_UPDATE',
            id: state.myPlayerId,
            player: {
                x: this.x, y: this.y, charId: state.selectedCharId,
                name: state.username, cleared: this.stageCleared
            }
        });
    },

    draw(x, y, charId, name) {
        const charInfo = CHARACTER_TYPES[charId || 0];
        
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px Courier';
        ctx.fillText(name || state.username, x - 5, y - 8);

        ctx.fillStyle = '#ffcc99'; 
        ctx.fillRect(x + 10, y, 20, 15); 

        ctx.fillStyle = charInfo.color; 
        ctx.fillRect(x + 5, y + 15, 30, 25); 

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + 5, y + 15, 5, 25);
        ctx.fillRect(x + 30, y + 15, 5, 25);

        ctx.fillStyle = '#000000'; 
        ctx.fillRect(x + 5, y + 40, 10, 10); 
        ctx.fillRect(x + 25, y + 40, 10, 10);
        ctx.restore();
    }
};

function updateEnemies() {
    enemies.forEach((e) => {
        e.x += e.vx;
        if (e.x < -30) e.x = canvas.width + 10;

        ctx.font = '18px Arial';
        ctx.fillText(e.spec.label, e.x, e.y);
    });
}

function checkStageAdvance() {
    let total = 1;
    let ready = player.stageCleared ? 1 : 0;

    Object.values(state.players).forEach(p => {
        total++;
        if (p.cleared) ready++;
    });

    document.getElementById('ui-cleared-count').innerText = `${ready}/${total}`;

    // Passa de fase coletivamente
    if (ready >= total && total > 0) {
        state.stage++;
        player.stageCleared = false;
        player.x = 50;
        spawnEnemies();
        document.getElementById('ui-stage').innerText = state.stage;
        sendToAll({ type: 'STAGE_SYNC', stage: state.stage, enemies: enemies });
    }
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fundo Visual
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Chão
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 380, canvas.width, 70);
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(0, 380, canvas.width, 4);

    // Linha Vermelha de Chegada
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(canvas.width - 15, 300, 10, 80);

    updateEnemies();

    player.update();
    player.draw(player.x, player.y, state.selectedCharId, state.username);

    // Desenha os outros participantes da sala
    Object.keys(state.players).forEach(id => {
        if (id !== state.myPlayerId) {
            const p = state.players[id];
            player.draw(p.x, p.y, p.charId, p.name);
        }
    });

    requestAnimationFrame(gameLoop);
}

// Chat no Canto Superior Direito
const chatInput = document.getElementById('chat-input');
const chatMessages = document.getElementById('chat-messages');

function sendChatMessage() {
    const text = chatInput.value.trim();
    if (text) {
        addChatMessage(state.username, text);
        sendToAll({ type: 'CHAT', sender: state.username, msg: text });
        chatInput.value = '';
    }
}

function addChatMessage(sender, msg) {
    const div = document.createElement('div');
    div.innerHTML = `<strong style="color:#2196F3">${sender}:</strong> ${msg}`;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

document.getElementById('chat-send').onclick = sendChatMessage;

// Inicialização
document.getElementById('btn-login').onclick = () => {
    const name = document.getElementById('auth-username').value.trim();
    if (name) {
        state.username = name;
        document.getElementById('modal-auth').classList.add('hidden');
        bgm.play().catch(() => {});
        connectNetwork();
    }
};

renderCharacterSelection();
gameLoop();

</script>
</body>
</html>
