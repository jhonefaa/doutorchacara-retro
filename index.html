<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Plataforma de Jogos Arcade</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff4757;
            margin-bottom: 30px;
        }

        /* Grade onde os jogos serão exibidos */
        .games-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Cartão de cada jogo */
        .game-card {
            background-color: #1e1e2f;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            width: 200px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #ff4757;
        }

        .game-card h2 {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .btn-play {
            background-color: #ff4757;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🎮 Minha Plataforma Arcade</h1>
    <p>Escolha um jogo abaixo para jogar grátis no seu navegador:</p>

    <div class="games-grid">
        
        <!-- Cartão do Jogo 1: Rygar -->
        <a href="rygar.html" class="game-card">
            <h2>Rygar</h2>
            <span class="btn-play">Jogar Agora</span>
        </a>

        <!-- Cartão do Jogo 2: Exemplo de outro jogo -->
        <a href="street-fighter.html" class="game-card">
            <h2>Street Fighter</h2>
            <span class="btn-play">Jogar Agora</span>
        </a>

        <!-- Para adicionar mais jogos no futuro, basta copiar o bloco acima e mudar o href e o título -->

    </div>

</body>
</html>
