<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Chácara - Aventura na Estrada</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 400px;
      border: 4px solid #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 2px 2px 4px #000;
      z-index: 10;
    }
    #controls-info {
      margin-top: 10px;
      color: #ccc;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui">
      <span id="level-txt">Fase: 1</span>
      <span id="status-txt">Seta Direita: Correr | Espaço: Pular</span>
    </div>
    <canvas id="canvas" width="800" height="400"></canvas>
  </div>
  <p id="controls-info">Controles: **Seta para Direita** (Mover) | **Espaço** (Pular)</p>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const levelTxt = document.getElementById('level-txt');

    // Estado do Jogo
    let currentLevel = 1;
    const maxLevels = 5;

    // Jogador (Dr. Chácara)
    const player = {
      x: 50,
      y: 260,
      width: 30,
      height: 60,
      speed: 4,
      vy: 0,
      gravity: 0.6,
      jumpPower: -12,
      isJumping: false
    };

    // Estilos das Estradas por Fase (Cor, Formato e Detalhes)
    const roadStyles = {
      1: { color: '#8B4513', border: '#5c2d0c', height: 80, texture: 'straight' },
      2: { color: '#A0522D', border: '#663300', height: 90, texture: 'bumpy' },
      3: { color: '#CD853F', border: '#8b5a2b', height: 75, texture: 'rocky' },
      4: { color: '#D2691E', border: '#8b3a00', height: 85, texture: 'sandy' },
      5: { color: '#6B4226', border: '#3b2211', height: 95, texture: 'muddy' }
    };

    // Teclas
    const keys = { right: false, space: false };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'Space') {
        if (!player.isJumping) {
          player.vy = player.jumpPower;
          player.isJumping = true;
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowRight') keys.right = false;
    });

    // Desenha Fundo 2D Temático (Estilo Escritório & Janela da Chácara)
    function drawBackground(level) {
      // Parede do escritório
      ctx.fillStyle = level % 2 === 0 ? '#e8ecef' : '#f0e6d2';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Estante de plantas e livros à esquerda
      ctx.fillStyle = '#8B5A2B';
      ctx.fillRect(20, 80, 120, 10);
      ctx.fillRect(20, 140, 120, 10);
      
      // Vasos de planta simples
      ctx.fillStyle = '#D2691E';
      ctx.fillRect(30, 55, 20, 25);
      ctx.fillRect(80, 115, 25, 25);
      ctx.fillStyle = '#2e8b57';
      ctx.beginPath();
      ctx.arc(40, 50, 15, 0, Math.PI * 2);
      ctx.arc(92, 110, 18, 0, Math.PI * 2);
      ctx.fill();

      // Janela com vista para a Chácara
      ctx.fillStyle = '#fff';
      ctx.fillRect(500, 40, 250, 160);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#ccc';
      ctx.strokeRect(500, 40, 250, 160);

      // Conteúdo da Janela (Cenário Rústico / Montanhas)
      ctx.save();
      ctx.beginPath();
      ctx.rect(503, 43, 244, 154);
      ctx.clip();
      
      // Céu na janela
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(500, 40, 250, 160);
      
      // Montanhas ao fundo
      ctx.fillStyle = '#6b8e23';
      ctx.beginPath();
      ctx.arc(560, 200, 70, 0, Math.PI * 2);
      ctx.arc(680, 210, 90, 0, Math.PI * 2);
      ctx.fill();

      // Casa/Celeiro na vista
      ctx.fillStyle = '#a52a2a';
      ctx.fillRect(650, 120, 50, 40);
      ctx.fillStyle = '#5c1d1d';
      ctx.beginPath();
      ctx.moveTo(645, 120);
      ctx.lineTo(675, 95);
      ctx.lineTo(705, 120);
      ctx.fill();

      ctx.restore();
    }

    // Desenha a Estrada de Terra e Buracos
    function drawRoad(level) {
      const style = roadStyles[level] || roadStyles[1];
      const roadY = canvas.height - style.height;

      ctx.fillStyle = style.color;
      ctx.fillRect(0, roadY, canvas.width, style.height);

      // Borda superior da estrada (textura/formato)
      ctx.fillStyle = style.border;
      ctx.fillRect(0, roadY, canvas.width, 6);

      // Desenho do Buraco em fases ímpares (1, 3, 5...)
      if (level % 2 !== 0) {
        const holeX = 350;
        const holeWidth = 100;

        // Recorte do buraco
        ctx.fillStyle = level % 2 === 0 ? '#e8ecef' : '#f0e6d2'; // Cor do fundo por trás da estrada
        ctx.fillRect(holeX, roadY, holeWidth, style.height);

        // Sombreamento interno do buraco
        ctx.fillStyle = '#222';
        ctx.fillRect(holeX + 5, roadY + 15, holeWidth - 10, style.height - 15);
      }
    }

    // Desenha o Personagem (Dr. Chácara)
    function drawPlayer() {
      // Jaleco Branco
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Camisa Azul por baixo
      ctx.fillStyle = '#1e90ff';
      ctx.fillRect(player.x + 8, player.y + 10, 14, 20);

      // Cabeça / Cabelo
      ctx.fillStyle = '#ffdbac';
      ctx.fillRect(player.x + 5, player.y - 20, 20, 20);
      ctx.fillStyle = '#4a4a4a'; // Cabelo grisalho/escuro
      ctx.fillRect(player.x + 3, player.y - 25, 24, 8);

      // Faixa na cabeça
      ctx.fillStyle = '#222';
      ctx.fillRect(player.x + 4, player.y - 18, 22, 4);

      // Olhos/Óculos
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(player.x + 8, player.y - 14, 6, 5);
      ctx.strokeRect(player.x + 16, player.y - 14, 6, 5);

      // Logo/Símbolo do Jaleco (Raminho de Oliva)
      ctx.fillStyle = '#2e8b57';
      ctx.beginPath();
      ctx.arc(player.x + 22, player.y + 18, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Atualização da Física e Lógica
    function update() {
      const currentRoad = roadStyles[currentLevel];
      const roadY = canvas.height - currentRoad.height;

      // Movimentação
      if (keys.right) {
        player.x += player.speed;
      }

      // Gravidade
      player.vy += player.gravity;
      player.y += player.vy;

      // Colisão com o Chão
      const groundY = roadY - player.height;
      const isOddLevel = currentLevel % 2 !== 0;
      const holeX = 350;
      const holeWidth = 100;

      // Verificação de queda no buraco em fases ímpares
      const overHole = isOddLevel && (player.x + player.width > holeX && player.x < holeX + holeWidth);

      if (player.y >= groundY) {
        if (overHole && player.y >= groundY) {
          // Caiu no buraco -> Reinicia a fase
          if (player.y > canvas.height) {
            player.x = 50;
            player.y = 260;
            player.vy = 0;
          }
        } else if (!overHole) {
          player.y = groundY;
          player.vy = 0;
          player.isJumping = false;
        }
      }

      // Mudança de Fase ao chegar ao final da tela
      if (player.x > canvas.width) {
        if (currentLevel < maxLevels) {
          currentLevel++;
          player.x = 10;
          levelTxt.innerText = `Fase: ${currentLevel}`;
        } else {
          alert('Parabéns! Você completou todas as fases com o Dr. Chácara!');
          currentLevel = 1;
          player.x = 50;
          levelTxt.innerText = `Fase: ${currentLevel}`;
        }
      }
    }

    // Loop Principal
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground(currentLevel);
      drawRoad(currentLevel);
      drawPlayer();
      update();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
