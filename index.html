<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doutor Chácara - Arcade Mobile v2.5</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #111; font-family: 'Courier New', Courier, monospace; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* Ajuste de Tela Responsiva Sem Cortar Imagem */
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 56.25vw; /* Proporção 16:9 */
            max-width: 800px; 
            max-height: 450px; 
            background: #000; 
            overflow: hidden; 
            border: 2px solid #fff; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2); 
        }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: linear-gradient(to bottom, #1a0033, #000000); }
        
        .ui-panel { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; text-shadow: 2px 2px #000; z-index: 10; pointer-events: none; }
        .btn-ui { background: #333; color: #fff; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; pointer-events: auto; font-family: inherit; font-size: 11px; }
        .btn-ui:active { background: #555; }
        
        /* Controles Virtuais Touch */
        #touch-controls { position: absolute; bottom: 8px; left: 10px; right: 10px; height: 90px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .joystick-zone { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; position: relative; }
        .joystick-knob { width: 32px; height: 32px; background: rgba(255,255,255,0.8); border-radius: 50%; position: absolute; top: 22px; left: 22px; }
        .action-buttons { display: flex; gap: 8px; }
        .btn-action { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; font-weight: bold; font-size: 11px; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px #000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 0 #000; }
        #btn-jump { background: #2196F3; }
        #btn-attack { background: #4CAF50; }
        #btn-special { background: #FF9800; }

        /* Modais */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; padding: 15px; text-align: center; }
        .hidden { display: none !important; }
        .modal input { padding: 8px; font-size: 16px; text-align: center; margin: 10px 0; font-family: inherit; }
        .modal button { padding: 8px 16px; font-size: 13px; cursor: pointer; background: #fff; color: #000; border: none; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- UI Topo -->
    <div class="ui-panel">
        <div>
            <div>FASE: <span id="ui-stage">1</span> | PONTOS: <span id="ui-score">0</span></div>
            <div>VIDAS: <span id="ui-lives">❤️❤️❤️</span> | IMUNE: <span id="ui-school-items">0/3</span></div>
        </div>
        <div>
            <button class="btn-ui" id="btn-config">⚙️ CONTROLES (PC)</button>
        </div>
    </div>

    <!-- Controles Touch -->
    <div id="touch-controls">
        <div class="joystick-zone" id="joystick-zone">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <div class="btn-action" id="btn-attack">ESC.U</div>
            <div class="btn-action" id="btn-special">REL.I</div>
            <div class="btn-action" id="btn-jump">PULO</div>
        </div>
    </div>

    <!-- Modal Reconfiguração de Teclas -->
    <div id="modal-keybinds" class="modal hidden">
        <h2>Configurar Teclas (PC)</h2>
        <p style="margin: 8px 0; font-size: 11px;">Clique no botão e pressione a nova tecla:</p>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;">
            <button id="rebind-left">Esquerda: A</button>
            <button id="rebind-right">Direita: D</button>
            <button id="rebind-jump">Pulo: ESPAÇO</button>
            <button id="rebind-attack">Escudo U: U</button>
            <button id="rebind-special">Relógio I: I</button>
        </div>
        <button id="btn-save-keybinds" style="background: #4CAF50; color: white;">SALVAR AJUSTES</button>
        <button id="btn-close-keybinds">CANCELAR</button>
    </div>

    <!-- Modal Selection / Cheats -->
    <div id="modal-cheat" class="modal hidden">
        <h2>Menu de Seleção de Fases</h2>
        <p>Digite a fase desejada (1 a 25):</p>
        <input type="number" id="cheat-stage-input" min="1" max="25" value="1">
        <button id="btn-apply-cheat">IR PARA FASE</button>
        <button id="btn-close-cheat" style="background:#888;">CANCELAR</button>
    </div>

    <!-- Modal Game Over / Vitoria -->
    <div id="modal-gameover" class="modal hidden">
        <h1 id="go-title">GAME OVER</h1>
        <p id="go-message">Tente novamente!</p>
        <button id="btn-restart">JOGAR NOVAMENTE</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const state = {
    score: 0,
    lives: 3,
    stage: 1,
    schoolItems: 0,
    isImmune: false,
    immunityTimer: 0,
    isGameOver: false,
    isPaused: false,
    cheatBuffer: "",
    keyMap: {
        left: 'KeyA',
        right: 'KeyD',
        jump: 'Space',
        attack: 'KeyU',
        special: 'KeyI'
    }
};

// Carregar Configurações Salvas
function loadSettings() {
    const savedKeys = localStorage.getItem('dc_keybinds');
    if (savedKeys) {
        try { state.keyMap = JSON.parse(savedKeys); updateKeybindButtonsUI(); } catch(e){}
    }
}

function saveSettings() {
    localStorage.setItem('dc_keybinds', JSON.stringify(state.keyMap));
    alert('Ajustes salvos com sucesso!');
    document.getElementById('modal-keybinds').classList.add('hidden');
}

// Input Handling
const keys = {};
window.addEventListener('keydown', e => {
    if (listeningRebind) {
        state.keyMap[listeningRebind] = e.code;
        listeningRebind = null;
        updateKeybindButtonsUI();
        return;
    }
    keys[e.code] = true;
    
    state.cheatBuffer += e.key.toLowerCase();
    if (state.cheatBuffer.length > 20) state.cheatBuffer = state.cheatBuffer.slice(-20);
    if (state.cheatBuffer.includes('fasedoutor')) {
        state.cheatBuffer = "";
        document.getElementById('modal-cheat').classList.remove('hidden');
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Player
const player = {
    x: 50,
    y: 300,
    width: 40,
    height: 50,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpPower: -12,
    grounded: false,
    shieldActive: false,
    shieldTimer: 0,
    
    update() {
        if (state.isPaused) return;

        let moveX = 0;
        if (keys[state.keyMap.left]) moveX = -1;
        if (keys[state.keyMap.right]) moveX = 1;
        if (touchMoveX !== 0) moveX = touchMoveX;

        this.vx = moveX * this.speed;

        if ((keys[state.keyMap.jump] || touchJump) && this.grounded) {
            this.vy = this.jumpPower;
            this.grounded = false;
            touchJump = false;
        }

        if ((keys[state.keyMap.attack] || touchAttack) && !this.shieldActive) {
            this.activateShield('U');
            touchAttack = false;
        }
        if ((keys[state.keyMap.special] || touchSpecial) && !this.shieldActive) {
            this.activateShield('I');
            touchSpecial = false;
        }

        this.vy += 0.6;
        this.x += this.vx;
        this.y += this.vy;

        const groundY = 380;
        if (this.y + this.height >= groundY) {
            this.y = groundY - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

        if (this.shieldTimer > 0) {
            this.shieldTimer--;
            if (this.shieldTimer <= 0) this.shieldActive = false;
        }

        if (state.immunityTimer > 0) {
            state.immunityTimer--;
            if (state.immunityTimer <= 0) state.isImmune = false;
        }
    },

    activateShield(type) {
        this.shieldActive = true;
        this.shieldType = type;
        this.shieldTimer = 60;
        if (type === 'I') {
            enemies.forEach(e => e.frozenTimer = 120);
            if (activeBoss) activeBoss.frozenTimer = 120;
        }
    },

    draw() {
        ctx.save();
        if (state.isImmune && Math.floor(Date.now() / 100) % 2 === 0) ctx.globalAlpha = 0.5;

        // Doutor Chácara
        ctx.fillStyle = '#ffcc99'; ctx.fillRect(this.x + 10, this.y, 20, 15);
        ctx.fillStyle = '#003366'; ctx.fillRect(this.x + 5, this.y + 15, 30, 25);
        ctx.fillStyle = '#000'; ctx.fillRect(this.x + 5, this.y + 40, 10, 10); ctx.fillRect(this.x + 25, this.y + 40, 10, 10);

        if (this.shieldActive) {
            ctx.strokeStyle = this.shieldType === 'U' ? '#00ffff' : '#ffff00';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(this.x + this.width/2, this.y + this.height/2, 35, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Courier';
            ctx.fillText(this.shieldType, this.x + 15, this.y - 10);
        }
        ctx.restore();
    }
};

// Boss (Semi-Mestre Inseto) e Projéteis
let activeBoss = null;
let projectiles = [];

class SemiBoss {
    constructor(stage) {
        this.x = 650;
        this.y = 280;
        this.width = 70;
        this.height = 70;
        this.stage = stage;
        this.hp = 5 + (stage / 5) * 3;
        this.maxHp = this.hp;
        this.attackTimer = 0;
        this.frozenTimer = 0;
        
        // Definição do Tipo de Inseto por Fase
        const types = {
            5: { name: 'Libélula Gigante', color: '#00e5ff', speed: 4, icon: '🛸' },
            10: { name: 'Besouro Blindado', color: '#795548', speed: 6, icon: '🪲' },
            15: { name: 'Vespa Flamejante', color: '#ffc107', speed: 8, icon: '🐝' },
            20: { name: 'Louva-a-Deus', color: '#4caf50', speed: 10, icon: '🦗' },
            25: { name: 'Rainha Inseto', color: '#e91e63', speed: 12, icon: '👑' }
        };
        this.info = types[stage] || types[5];
    }

    update() {
        if (this.frozenTimer > 0) {
            this.frozenTimer--;
            return;
        }

        // Ataque contínuo de projéteis pelo chão
        this.attackTimer++;
        const attackInterval = Math.max(30, 120 - (this.stage * 3));
        if (this.attackTimer >= attackInterval) {
            this.attackTimer = 0;
            // Disparar Projétil Rastejante de Inseto
            projectiles.push(new Projectile(this.x, 355, this.info.speed, this.info.color, this.info.icon));
        }
    }

    draw() {
        // Corpo do Inseto Semi-Mestre
        ctx.fillStyle = this.frozenTimer > 0 ? '#88ffff' : this.info.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        ctx.fillStyle = '#fff';
        ctx.font = '28px Courier';
        ctx.fillText(this.info.icon, this.x + 18, this.y + 45);

        // Barra de Vida do Semi-Mestre
        ctx.fillStyle = '#555';
        ctx.fillRect(this.x, this.y - 25, this.width, 8);
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(this.x, this.y - 25, (this.width * (this.hp / this.maxHp)), 8);

        ctx.fillStyle = '#fff';
        ctx.font = '10px Courier';
        ctx.fillText(this.info.name, this.x, this.y - 30);
    }
}

class Projectile {
    constructor(x, y, speed, color, icon) {
        this.x = x;
        this.y = y;
        this.width = 25;
        this.height = 25;
        this.speed = speed;
        this.color = color;
        this.icon = icon;
    }

    update() {
        this.x -= this.speed; // Caminha Rastejando pelo Chão em direção ao jogador
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x + 12, this.y + 12, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.font = '12px Courier';
        ctx.fillText(this.icon, this.x + 4, this.y + 16);
    }
}

// Inimigos Comuns e Coletáveis
let enemies = [];
let collectibles = [];

class Enemy {
    constructor(x, y, word) {
        this.x = x; this.y = y; this.width = 40; this.height = 40;
        this.word = word; this.speed = 2; this.frozenTimer = 0;
    }
    update() {
        if (this.frozenTimer > 0) { this.frozenTimer--; return; }
        this.x -= this.speed;
        if (this.x < -100) this.x = canvas.width + Math.random() * 200;
    }
    draw() {
        ctx.fillStyle = this.frozenTimer > 0 ? '#88ffff' : '#cc0000';
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = '#ffffff'; ctx.font = '10px Courier';
        ctx.fillText(this.word, this.x - 5, this.y - 5);
    }
}

class Item {
    constructor(x, y) { this.x = x; this.y = y; this.collected = false; }
    draw() {
        if (this.collected) return;
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.font = '10px Courier'; ctx.fillText('📖', this.x - 6, this.y + 4);
    }
}

function initStage(stageNum) {
    state.stage = stageNum;
    enemies = [];
    collectibles = [];
    projectiles = [];
    activeBoss = null;
    
    if ([5, 10, 15, 20, 25].includes(stageNum)) {
        activeBoss = new SemiBoss(stageNum);
    } else {
        const words = ['ERRO', 'DUVIDA', 'IGNORANCIA', 'ATRASO'];
        for(let i = 0; i < 3 + Math.floor(stageNum / 2); i++) {
            enemies.push(new Enemy(600 + i * 250, 340, words[i % words.length]));
        }
        for(let i = 0; i < 3; i++) {
            collectibles.push(new Item(300 + i * 200, 320));
        }
    }

    document.getElementById('ui-stage').innerText = state.stage;
}

// Loop Principal do Jogo
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!state.isGameOver) {
        player.update();
        player.draw();

        // Gerenciamento do Semi-Mestre
        if (activeBoss) {
            activeBoss.update();
            activeBoss.draw();

            // Atacar o Semi-Mestre com o Escudo
            if (player.shieldActive && player.shieldType === 'U') {
                if (Math.abs(player.x - activeBoss.x) < 60 && Math.abs(player.y - activeBoss.y) < 60) {
                    activeBoss.hp -= 0.1;
                    if (activeBoss.hp <= 0) {
                        state.score += 1000;
                        activeBoss = null;
                        initStage(state.stage + 1);
                    }
                }
            }
        }

        // Atualizar Projéteis de Insetos pelo Chão
        projectiles.forEach((proj, pIndex) => {
            proj.update();
            proj.draw();

            // Destruir projétil com escudo U
            if (player.shieldActive && player.shieldType === 'U') {
                if (Math.abs(player.x - proj.x) < 40 && Math.abs(player.y - proj.y) < 40) {
                    projectiles.splice(pIndex, 1);
                }
            }

            // Atingir o Doutor Chácara
            if (!state.isImmune && Math.abs(player.x - proj.x) < 25 && Math.abs(player.y - proj.y) < 25) {
                projectiles.splice(pIndex, 1);
                takeDamage();
            }
        });

        // Inimigos Comuns
        enemies.forEach((enemy, index) => {
            enemy.update();
            enemy.draw();

            if (player.shieldActive && player.shieldType === 'U') {
                if (Math.abs(player.x - enemy.x) < 50 && Math.abs(player.y - enemy.y) < 50) {
                    enemies.splice(index, 1);
                    state.score += 100;
                }
            }

            if (!state.isImmune && Math.abs(player.x - enemy.x) < 30 && Math.abs(player.y - enemy.y) < 30) {
                takeDamage();
            }
        });

        // Coletáveis
        collectibles.forEach(item => {
            item.draw();
            if (!item.collected && Math.abs(player.x - item.x) < 30 && Math.abs(player.y - item.y) < 30) {
                item.collected = true;
                state.schoolItems++;
                if (state.schoolItems >= 3) {
                    state.isImmune = true;
                    state.immunityTimer = 300;
                    state.schoolItems = 0;
                }
            }
        });

        document.getElementById('ui-score').innerText = Math.floor(state.score);
        document.getElementById('ui-school-items').innerText = `${state.schoolItems}/3`;

        if (!activeBoss && enemies.length === 0 && ![5, 10, 15, 20, 25].includes(state.stage)) {
            initStage(state.stage + 1);
        }
    }

    requestAnimationFrame(gameLoop);
}

function takeDamage() {
    state.lives--;
    updateLivesUI();
    if (state.lives <= 0) {
        state.isGameOver = true;
        document.getElementById('modal-gameover').classList.remove('hidden');
    } else {
        state.isImmune = true;
        state.immunityTimer = 120;
    }
}

function updateLivesUI() {
    let hearts = '';
    for(let i=0; i<state.lives; i++) hearts += '❤️';
    document.getElementById('ui-lives').innerText = hearts || '💀';
}

// CONTROLES TOUCH
let touchMoveX = 0, touchJump = false, touchAttack = false, touchSpecial = false;
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');

joystickZone.addEventListener('touchstart', handleJoystick);
joystickZone.addEventListener('touchmove', handleJoystick);
joystickZone.addEventListener('touchend', () => {
    joystickKnob.style.top = '22px'; joystickKnob.style.left = '22px'; touchMoveX = 0;
});

function handleJoystick(e) {
    e.preventDefault();
    const rect = joystickZone.getBoundingClientRect();
    const touch = e.touches[0];
    const x = touch.clientX - rect.left - 40;
    touchMoveX = Math.max(-1, Math.min(1, x / 30));
    joystickKnob.style.left = `${22 + touchMoveX * 20}px`;
}

document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); touchJump = true; });
document.getElementById('btn-attack').addEventListener('touchstart', (e) => { e.preventDefault(); touchAttack = true; });
document.getElementById('btn-special').addEventListener('touchstart', (e) => { e.preventDefault(); touchSpecial = true; });

// Reconfiguração de Teclas
let listeningRebind = null;
function updateKeybindButtonsUI() {
    document.getElementById('rebind-left').innerText = `Esquerda: ${state.keyMap.left}`;
    document.getElementById('rebind-right').innerText = `Direita: ${state.keyMap.right}`;
    document.getElementById('rebind-jump').innerText = `Pulo: ${state.keyMap.jump}`;
    document.getElementById('rebind-attack').innerText = `Escudo U: ${state.keyMap.attack}`;
    document.getElementById('rebind-special').innerText = `Relógio I: ${state.keyMap.special}`;
}

['left','right','jump','attack','special'].forEach(action => {
    document.getElementById(`rebind-${action}`).onclick = () => {
        listeningRebind = action;
        document.getElementById(`rebind-${action}`).innerText = 'Pressione Tecla...';
    };
});

document.getElementById('btn-config').onclick = () => document.getElementById('modal-keybinds').classList.remove('hidden');
document.getElementById('btn-close-keybinds').onclick = () => document.getElementById('modal-keybinds').classList.add('hidden');
document.getElementById('btn-save-keybinds').onclick = saveSettings;

document.getElementById('btn-apply-cheat').onclick = () => {
    const stageInput = parseInt(document.getElementById('cheat-stage-input').value);
    if (stageInput >= 1 && stageInput <= 25) {
        initStage(stageInput);
        document.getElementById('modal-cheat').classList.add('hidden');
    }
};
document.getElementById('btn-close-cheat').onclick = () => document.getElementById('modal-cheat').classList.add('hidden');

document.getElementById('btn-restart').onclick = () => {
    state.lives = 3; state.score = 0; state.isGameOver = false;
    updateLivesUI();
    document.getElementById('modal-gameover').classList.add('hidden');
    initStage(1);
};

// Inicialização
loadSettings();
initStage(1);
gameLoop();
</script>
</body>
</html>
