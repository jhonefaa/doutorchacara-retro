<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doutor Chácara - Multiplayer Arcade v3.0</title>
    <!-- PeerJS para conexão P2P em tempo real -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #111; font-family: 'Courier New', Courier, monospace; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 56.25vw; 
            max-width: 800px; 
            max-height: 450px; 
            background: #000; 
            overflow: hidden; 
            border: 2px solid #fff; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2); 
        }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: linear-gradient(to bottom, #1a0033, #000000); }
        
        .ui-panel { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; text-shadow: 2px 2px #000; z-index: 10; pointer-events: none; }
        .btn-ui { background: #333; color: #fff; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; pointer-events: auto; font-family: inherit; font-size: 11px; }
        .btn-ui:active { background: #555; }
        
        /* Chat Ao Vivo */
        #chat-container {
            position: absolute; bottom: 105px; left: 10px; width: 230px; height: 110px;
            background: rgba(0, 0, 0, 0.75); border: 1px solid #555; display: flex;
            flex-direction: column; z-index: 25; pointer-events: auto; border-radius: 4px;
        }
        #chat-messages { flex: 1; overflow-y: auto; padding: 4px; font-size: 10px; text-shadow: 1px 1px #000; word-break: break-word; }
        #chat-input-container { display: flex; border-top: 1px solid #555; }
        #chat-input { flex: 1; background: #111; border: none; color: white; padding: 4px 6px; font-size: 10px; font-family: inherit; }
        #chat-btn { background: #4CAF50; border: none; color: white; padding: 4px 8px; font-size: 10px; cursor: pointer; font-weight: bold; }

        #touch-controls { position: absolute; bottom: 8px; left: 10px; right: 10px; height: 90px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .joystick-zone { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; position: relative; }
        .joystick-knob { width: 32px; height: 32px; background: rgba(255,255,255,0.8); border-radius: 50%; position: absolute; top: 22px; left: 22px; }
        .action-buttons { display: flex; gap: 8px; }
        .btn-action { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; font-weight: bold; font-size: 11px; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px #000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 0 #000; }
        #btn-jump { background: #2196F3; }
        #btn-attack { background: #4CAF50; }
        #btn-special { background: #FF9800; }

        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; padding: 10px; text-align: center; box-sizing: border-box; }
        .hidden { display: none !important; }
        .modal input, .modal select { padding: 6px; font-size: 12px; text-align: center; margin: 4px 0; font-family: inherit; width: 80%; max-width: 250px; background: #222; color: #fff; border: 1px solid #666; }
        .modal button { padding: 6px 12px; font-size: 11px; cursor: pointer; background: #fff; color: #000; border: none; font-weight: bold; margin-top: 4px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="ui-panel">
        <div>
            <div>FASE: <span id="ui-stage">1</span> | PONTOS: <span id="ui-score">0</span></div>
            <div>VIDAS: <span id="ui-lives">❤️❤️❤️</span> | JOGADORES: <span id="ui-players-count">1/6</span></div>
        </div>
        <div>
            <button class="btn-ui" id="btn-config">⚙️ OPÇÕES / PAUSE</button>
        </div>
    </div>

    <!-- Chat Ao Vivo -->
    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Chat ao vivo..." maxlength="60">
            <button id="chat-btn">ENVIAR</button>
        </div>
    </div>

    <div id="touch-controls">
        <div class="joystick-zone" id="joystick-zone">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <div class="btn-action" id="btn-attack">ESC.U</div>
            <div class="btn-action" id="btn-special">REL.I</div>
            <div class="btn-action" id="btn-jump">PULO</div>
        </div>
    </div>

    <!-- Modal 1: Autenticação (Login / Cadastro) -->
    <div id="modal-auth" class="modal">
        <h2>DOUTOR CHÁCARA ONLINE</h2>
        <p style="font-size: 11px; color: #aaa; margin: 4px 0;">Cadastre-se ou entre para jogar</p>
        <input type="text" id="auth-user" placeholder="Usuário">
        <input type="password" id="auth-pass" placeholder="Senha">
        <button id="btn-login">ENTRAR</button>
        <button id="btn-register" style="background:#555; color:#fff;">CRIAR CONTA NOVA</button>
        <p id="auth-msg" style="color: #ff5555; font-size: 10px; margin-top: 5px;"></p>
    </div>

    <!-- Modal 2: Seleção de Personagem / Lobby -->
    <div id="modal-lobby" class="modal hidden">
        <h2>PAINEL DE JOGO</h2>
        <p id="welcome-user" style="color:#4CAF50; font-size:12px;"></p>
        
        <label style="font-size: 11px; margin-top: 5px;">Escolha seu Personagem:</label>
        <select id="select-character"></select>

        <div style="margin: 10px 0; border-top: 1px solid #444; width: 80%; padding-top: 10px;">
            <button id="btn-play-solo" style="background:#ff9800; color:white; width:100%; margin-bottom:8px;">JOGAR INDIVIDUAL (SOLO)</button>
            <br>
            <input type="text" id="room-id-input" placeholder="Código da Sala (para entrar)">
            <button id="btn-join-room" style="background:#2196F3; color:white;">ENTRAR EM SALA MULTIPLAYER</button>
            <button id="btn-create-room" style="background:#4CAF50; color:white; margin-top:4px;">CRIAR SALA MULTIPLAYER (HOST)</button>
        </div>
        <p id="lobby-status" style="font-size:11px; color:#ffeb3b;"></p>
    </div>

    <!-- Modal Configurações -->
    <div id="modal-keybinds" class="modal hidden">
        <h3 style="margin-bottom: 5px; color: #4CAF50;">CONFIGURAÇÕES</h3>
        <p id="display-room-id" style="font-size:11px; color:#00ffff; margin-bottom:10px;"></p>
        <button id="btn-close-config" style="background: #4CAF50; color: white;">VOLTAR AO JOGO</button>
    </div>

    <div id="modal-gameover" class="modal hidden">
        <h1 id="go-title">GAME OVER</h1>
        <p id="go-message">Aguardando reinício...</p>
        <button id="btn-restart">JOGAR NOVAMENTE</button>
    </div>
</div>

<script>
/**
 * DOUTOR CHÁCARA - MULTIPLAYER ONLINE v3.0
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Definição dos 6 Personagens Mantendo a Anatomia e Estilo do Original
const CHARACTERS = {
    doc: { name: 'Doutor Chácara', bodyColor: '#003366', headColor: '#ffcc99', desc: 'Original' },
    father: { name: 'Pai do Doutor Chácara', bodyColor: '#8a2be2', headColor: '#e0b0ff', desc: 'Violeta' },
    sister: { name: 'Irmã do Doutor Chácara', bodyColor: '#ff69b4', headColor: '#ffc0cb', desc: 'Rosa' },
    son: { name: 'Filho do Doutor Chácara', bodyColor: '#32cd32', headColor: '#ffcc99', desc: 'Verde' },
    daughter: { name: 'Filha do Doutor Chácara', bodyColor: '#ffd700', headColor: '#ffcc99', desc: 'Amarelo' },
    uncle: { name: 'Tio do Doutor Chácara', bodyColor: '#ff4500', headColor: '#d2b48c', desc: 'Laranja' }
};

const state = {
    currentUser: null,
    selectedCharKey: 'doc',
    score: 0,
    lives: 3,
    stage: 1,
    isImmune: false,
    immunityTimer: 0,
    pinkShield: false,
    isGameOver: false,
    isPaused: false,
    roomId: null,
    isHost: false,
    isSolo: true,
    stageClearedPlayers: new Set(),
    keyMap: { left: 'KeyA', right: 'KeyD', jump: 'Space', attack: 'KeyU', special: 'KeyI' }
};

// Dados do Jogador Local
const localPlayer = {
    id: 'solo',
    x: 50, y: 300, width: 40, height: 50,
    vx: 0, vy: 0, speed: 5, jumpPower: -12,
    grounded: false, shieldActive: false, shieldTimer: 0, shieldRange: 35, shieldType: 'U',
    isCarriedAway: false, stagePassed: false
};

// Jogadores Remotos na Sala
const remotePlayers = {};

// Conexões PeerJS
let peer = null;
let hostConn = null;
const clientConns = {};

// Lógica de Chat ao Vivo
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const chatBtn = document.getElementById('chat-btn');

function appendChatMessage(sender, text) {
    const msgDiv = document.createElement('div');
    msgDiv.innerHTML = `<span style="color:#00ffff;">${sender}:</span> ${text}`;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

chatBtn.onclick = sendChatMessage;
chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });

function sendChatMessage() {
    const text = chatInput.value.trim();
    if (!text || !state.currentUser) return;
    
    appendChatMessage(state.currentUser, text);
    chatInput.value = '';

    if (!state.isSolo) {
        broadcastData({ type: 'chat', sender: state.currentUser, text: text });
    }
}

// 1. Sistema de Login/Cadastro
document.getElementById('btn-register').onclick = () => {
    const u = document.getElementById('auth-user').value.trim();
    const p = document.getElementById('auth-pass').value.trim();
    if (!u || !p) return showAuthMsg('Preencha usuário e senha!');
    
    const users = JSON.parse(localStorage.getItem('dc_users') || '{}');
    if (users[u]) return showAuthMsg('Usuário já cadastrado!');
    
    users[u] = p;
    localStorage.setItem('dc_users', JSON.stringify(users));
    showAuthMsg('Conta criada! Clique em ENTRAR.', true);
};

document.getElementById('btn-login').onclick = () => {
    const u = document.getElementById('auth-user').value.trim();
    const p = document.getElementById('auth-pass').value.trim();
    const users = JSON.parse(localStorage.getItem('dc_users') || '{}');

    if (users[u] && users[u] === p) {
        state.currentUser = u;
        document.getElementById('modal-auth').classList.add('hidden');
        openLobbyScreen();
    } else {
        showAuthMsg('Usuário ou senha incorretos!');
    }
};

function showAuthMsg(msg, isSuccess = false) {
    const el = document.getElementById('auth-msg');
    el.style.color = isSuccess ? '#4CAF50' : '#ff5555';
    el.innerText = msg;
}

// 2. Tela de Seleção
function openLobbyScreen() {
    document.getElementById('modal-lobby').classList.remove('hidden');
    document.getElementById('welcome-user').innerText = `Jogador: ${state.currentUser}`;
    
    const select = document.getElementById('select-character');
    select.innerHTML = '';
    Object.keys(CHARACTERS).forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = `${CHARACTERS[key].name} (${CHARACTERS[key].desc})`;
        select.appendChild(opt);
    });
}

// Modos de Jogo: Solo vs Multiplayer
document.getElementById('btn-play-solo').onclick = () => {
    state.selectedCharKey = document.getElementById('select-character').value;
    state.isSolo = true;
    updatePlayersCountUI();
    startGame();
};

document.getElementById('btn-create-room').onclick = () => {
    state.selectedCharKey = document.getElementById('select-character').value;
    state.isSolo = false;
    state.isHost = true;
    const roomCode = 'DC-' + Math.floor(1000 + Math.random() * 9000);
    initPeer(roomCode);
};

document.getElementById('btn-join-room').onclick = () => {
    const inputCode = document.getElementById('room-id-input').value.trim().toUpperCase();
    if (!inputCode) return alert('Digite o Código da Sala!');
    state.selectedCharKey = document.getElementById('select-character').value;
    state.isSolo = false;
    state.isHost = false;
    initPeer(null, inputCode);
};

// 3. Conexão WebRTC (Rede P2P)
function initPeer(customId, joinHostId) {
    document.getElementById('lobby-status').innerText = 'Conectando ao servidor...';
    peer = new Peer(customId);

    peer.on('open', (id) => {
        localPlayer.id = id;
        if (state.isHost) {
            state.roomId = id;
            document.getElementById('lobby-status').innerText = `Sala Criada! Código: ${id}`;
            document.getElementById('display-room-id').innerText = `CÓDIGO DA SALA: ${id}`;
            setTimeout(startGame, 800);
        } else {
            connectToHost(joinHostId);
        }
    });

    peer.on('connection', (conn) => {
        if (Object.keys(clientConns).length >= 5) {
            conn.send({ type: 'full' });
            setTimeout(() => conn.close(), 500);
            return;
        }

        clientConns[conn.peer] = conn;
        setupConnectionListeners(conn);
    });
}

function connectToHost(hostId) {
    hostConn = peer.connect(hostId);
    setupConnectionListeners(hostConn);
}

function setupConnectionListeners(conn) {
    conn.on('open', () => {
        if (!state.isHost) {
            document.getElementById('lobby-status').innerText = 'Conectado! Entrando...';
            setTimeout(startGame, 800);
        }
        conn.send({
            type: 'join',
            user: state.currentUser,
            charKey: state.selectedCharKey
        });
    });

    conn.on('data', (data) => handleNetworkData(data, conn));
    conn.on('close', () => {
        delete remotePlayers[conn.peer];
        delete clientConns[conn.peer];
        updatePlayersCountUI();
    });
}

function broadcastData(data) {
    if (state.isSolo) return;
    if (state.isHost) {
        Object.values(clientConns).forEach(c => c.send(data));
    } else if (hostConn && hostConn.open) {
        hostConn.send(data);
    }
}

function handleNetworkData(data, conn) {
    if (data.type === 'join') {
        remotePlayers[conn.peer] = {
            id: conn.peer,
            user: data.user,
            charKey: data.charKey,
            x: 50, y: 300, shieldActive: false, shieldType: 'U', stagePassed: false
        };
        updatePlayersCountUI();
        if (state.isHost) broadcastData({ type: 'players_update', list: remotePlayers });
    }
    else if (data.type === 'players_update') {
        Object.assign(remotePlayers, data.list);
        delete remotePlayers[localPlayer.id];
        updatePlayersCountUI();
    }
    else if (data.type === 'chat') {
        appendChatMessage(data.sender, data.text);
        if (state.isHost) broadcastData(data);
    }
    else if (data.type === 'pos') {
        if (remotePlayers[data.id]) {
            remotePlayers[data.id].x = data.x;
            remotePlayers[data.id].y = data.y;
            remotePlayers[data.id].shieldActive = data.shieldActive;
            remotePlayers[data.id].shieldType = data.shieldType;
            remotePlayers[data.id].stagePassed = data.stagePassed;
        }
        if (state.isHost) broadcastData(data);
    }
    else if (data.type === 'stage_clear_check') {
        if (state.isHost) {
            state.stageClearedPlayers.add(data.id);
            checkAllPlayersClearedStage();
        }
    }
    else if (data.type === 'next_stage') {
        localPlayer.stagePassed = false;
        initStage(data.stage);
    }
}

function updatePlayersCountUI() {
    const count = state.isSolo ? 1 : Object.keys(remotePlayers).length + 1;
    document.getElementById('ui-players-count').innerText = `${count}/6`;
}

function startGame() {
    document.getElementById('modal-lobby').classList.add('hidden');
    initStage(1);
}

// Teclado e Mobile
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

let touchMoveX = 0, touchJump = false, touchAttack = false, touchSpecial = false;
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');

joystickZone.addEventListener('touchstart', handleJoystick);
joystickZone.addEventListener('touchmove', handleJoystick);
joystickZone.addEventListener('touchend', () => {
    joystickKnob.style.top = '22px'; joystickKnob.style.left = '22px'; touchMoveX = 0;
});

function handleJoystick(e) {
    e.preventDefault();
    const rect = joystickZone.getBoundingClientRect();
    const touch = e.touches[0];
    const x = touch.clientX - rect.left - 40;
    touchMoveX = Math.max(-1, Math.min(1, x / 30));
    joystickKnob.style.left = `${22 + touchMoveX * 20}px`;
}

document.getElementById('btn-jump').ontouchstart = (e) => { e.preventDefault(); touchJump = true; };
document.getElementById('btn-attack').ontouchstart = (e) => { e.preventDefault(); touchAttack = true; };
document.getElementById('btn-special').ontouchstart = (e) => { e.preventDefault(); touchSpecial = true; };

function updatePlayer() {
    if (state.isPaused) return;

    let moveX = 0;
    if (keys[state.keyMap.left]) moveX = -1;
    if (keys[state.keyMap.right]) moveX = 1;
    if (touchMoveX !== 0) moveX = touchMoveX;

    localPlayer.vx = moveX * localPlayer.speed;

    if ((keys[state.keyMap.jump] || touchJump) && localPlayer.grounded) {
        localPlayer.vy = localPlayer.jumpPower;
        localPlayer.grounded = false;
        touchJump = false;
    }

    if ((keys[state.keyMap.attack] || touchAttack) && !localPlayer.shieldActive) {
        activateShield('U'); touchAttack = false;
    }
    if ((keys[state.keyMap.special] || touchSpecial) && !localPlayer.shieldActive) {
        activateShield('I'); touchSpecial = false;
    }

    localPlayer.vy += 0.6;
    localPlayer.x += localPlayer.vx;
    localPlayer.y += localPlayer.vy;

    const groundY = 380;
    if (localPlayer.y + localPlayer.height >= groundY) {
        localPlayer.y = groundY - localPlayer.height;
        localPlayer.vy = 0;
        localPlayer.grounded = true;
    }

    if (localPlayer.x < 0) localPlayer.x = 0;
    if (localPlayer.x + localPlayer.width > canvas.width) localPlayer.x = canvas.width - localPlayer.width;

    if (localPlayer.shieldTimer > 0) {
        localPlayer.shieldTimer--;
        if (localPlayer.shieldTimer <= 0) localPlayer.shieldActive = false;
    }

    if (!state.isSolo) {
        broadcastData({
            type: 'pos',
            id: localPlayer.id,
            x: localPlayer.x,
            y: localPlayer.y,
            shieldActive: localPlayer.shieldActive,
            shieldType: localPlayer.shieldType,
            stagePassed: localPlayer.stagePassed
        });
    }
}

function activateShield(type) {
    localPlayer.shieldActive = true;
    localPlayer.shieldType = type;
    localPlayer.shieldTimer = 60;
}

// Desenhar Personagem Fiel ao Design Original
function drawCharacter(x, y, charKey, shieldActive, shieldType, label) {
    ctx.save();
    const charData = CHARACTERS[charKey] || CHARACTERS.doc;

    // Cabeça
    ctx.fillStyle = charData.headColor;
    ctx.fillRect(x + 10, y, 20, 15);

    // Corpo
    ctx.fillStyle = state.pinkShield && charKey === state.selectedCharKey ? '#ff007f' : charData.bodyColor;
    ctx.fillRect(x + 5, y + 15, 30, 25);

    // Pés
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 5, y + 40, 10, 10);
    ctx.fillRect(x + 25, y + 40, 10, 10);

    // Identificador
    if (label) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '9px Courier';
        ctx.fillText(label, x - 5, y - 5);
    }

    // Escudo
    if (shieldActive) {
        ctx.strokeStyle = shieldType === 'U' ? '#00ffff' : '#ffff00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x + 20, y + 25, 35, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();
}

let enemies = [];

class Enemy {
    constructor(x, y, word) {
        this.x = x; this.y = y; this.width = 40; this.height = 40;
        this.word = word; this.speed = 2;
    }
    update() {
        this.x -= this.speed;
        if (this.x < -100) this.x = canvas.width + Math.random() * 200;
    }
    draw() {
        ctx.fillStyle = '#cc0000'; ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = '#ffffff'; ctx.font = '10px Courier'; ctx.fillText(this.word, this.x - 5, this.y - 5);
    }
}

function initStage(stageNum) {
    state.stage = stageNum;
    enemies = [];
    localPlayer.stagePassed = false;
    state.stageClearedPlayers.clear();

    const words = ['ERRO', 'DUVIDA', 'IGNORANCIA', 'ATRASO'];
    for(let i = 0; i < 3 + Math.floor(stageNum / 2); i++) {
        enemies.push(new Enemy(600 + i * 250, 340, words[i % words.length]));
    }
    document.getElementById('ui-stage').innerText = state.stage;
}

// Avanço de fase sincronizado
function checkAllPlayersClearedStage() {
    if (state.isSolo) {
        initStage(state.stage + 1);
        return;
    }

    const totalPlayers = Object.keys(remotePlayers).length + 1;
    if (state.stageClearedPlayers.size >= totalPlayers) {
        const nextStage = state.stage + 1;
        broadcastData({ type: 'next_stage', stage: nextStage });
        initStage(nextStage);
    }
}

// Loop Principal
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!state.isGameOver && !state.isPaused) {
        updatePlayer();
        
        // Desenha jogador local
        drawCharacter(
            localPlayer.x, localPlayer.y, 
            state.selectedCharKey, 
            localPlayer.shieldActive, localPlayer.shieldType, 
            state.currentUser
        );

        // Desenha outros jogadores no multiplayer
        if (!state.isSolo) {
            Object.values(remotePlayers).forEach(p => {
                drawCharacter(p.x, p.y, p.charKey, p.shieldActive, p.shieldType, p.user);
            });
        }

        // Inimigos
        enemies.forEach((enemy, index) => {
            enemy.update(); enemy.draw();

            if (localPlayer.vy > 0 && 
                (localPlayer.y + localPlayer.height) >= enemy.y && 
                (localPlayer.y + localPlayer.height) <= enemy.y + 15 && 
                localPlayer.x + localPlayer.width > enemy.x && 
                localPlayer.x < enemy.x + enemy.width) {
                enemies.splice(index, 1);
                localPlayer.vy = -8;
                state.score += 200;
            }
        });

        // Regra de Avanço de Fase
        if (enemies.length === 0 && !localPlayer.stagePassed) {
            localPlayer.stagePassed = true;
            if (state.isSolo) {
                checkAllPlayersClearedStage();
            } else if (state.isHost) {
                state.stageClearedPlayers.add(localPlayer.id);
                checkAllPlayersClearedStage();
            } else {
                broadcastData({ type: 'stage_clear_check', id: localPlayer.id });
            }
        }

        document.getElementById('ui-score').innerText = Math.floor(state.score);
    }

    requestAnimationFrame(gameLoop);
}

document.getElementById('btn-config').onclick = () => {
    document.getElementById('modal-keybinds').classList.toggle('hidden');
};
document.getElementById('btn-close-config').onclick = () => {
    document.getElementById('modal-keybinds').classList.add('hidden');
};

gameLoop();
</script>
</body>
</html>
