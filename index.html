<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Doutor Chácara - Alfabetização Arcade Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body {
      background-color: #0d0d11; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center; overflow-x: hidden; user-select: none;
    }
    .hero-background {
      width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, rgba(13,13,17,0.2), rgba(13,13,17,0.85)), url('capa-doutorchacara.jpg.jfif');
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 40px;
    }
    .btn-jogar {
      background: #ff0055; color: #fff; font-size: 1.2rem; font-weight: bold;
      padding: 16px 36px; border-radius: 50px; text-decoration: none;
      border: 2px solid #fff; box-shadow: 0 0 15px rgba(255,0,85,0.6);
      transition: 0.3s; margin-bottom: 20px;
    }
    #area-arcade { min-height: 100vh; padding: 20px 10px; background: #121218; display: flex; flex-direction: column; align-items: center; }
    
    #game-container {
      position: relative; width: 100%; max-width: 800px;
    }
    #gameCanvas {
      background: #000; border: 3px solid #00ffcc; border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,255,204,0.3); width: 100%; height: auto; display: block;
    }

    /* CONTROLES VIRTUAIS (TOUCH) */
    .touch-controls {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; max-width: 800px; margin-top: 15px; padding: 0 10px;
    }
    
    /* D-PAD (DIRECIONAIS) */
    .dpad {
      display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); gap: 5px;
    }
    .btn-touch {
      background: rgba(255, 255, 255, 0.15); border: 2px solid #00ffcc;
      border-radius: 12px; color: #fff; font-weight: bold; font-size: 1.2rem;
      display: flex; justify-content: center; align-items: center;
      active { background: rgba(0, 255, 204, 0.5); }
    }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-up { grid-column: 2; grid-row: 1; }

    /* BOTÕES DE AÇÃO */
    .action-buttons { display: flex; gap: 15px; }
    .btn-action {
      width: 65px; height: 65px; border-radius: 50%; font-size: 1rem;
      border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
    .btn-jump { background: #0088ff; }
    .btn-attack { background: #ff0055; }

    /* BOTÃO REINICIAR (GAME OVER) */
    #btn-restart {
      position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
      background: #00ffcc; color: #000; font-size: 1.2rem; font-weight: bold;
      padding: 15px 30px; border-radius: 30px; border: none; cursor: pointer;
      box-shadow: 0 0 20px #00ffcc; display: none; z-index: 10;
    }
  </style>
</head>
<body>

  <header class="hero-background">
    <a href="#area-arcade" class="btn-jogar">JOGAR NO CELULAR</a>
    <p style="letter-spacing: 2px; color: #d1d1e0;">MODO TOUCHSCREEN • ALFABETIZAÇÃO</p>
  </header>

  <main id="area-arcade">
    <h2>Doutor Chácara Arcade</h2>

    <div id="game-container">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
      <button id="btn-restart" onclick="resetGame()">JOGAR NOVAMENTE 🔄</button>
    </div>

    <!-- CONTROLES PARA TOUCHSCREEN -->
    <div class="touch-controls">
      <div class="dpad">
        <div class="btn-touch btn-up" id="touch-up">▲</div>
        <div class="btn-touch btn-left" id="touch-left">◀</div>
        <div class="btn-touch btn-down" id="touch-down">▼</div>
        <div class="btn-touch btn-right" id="touch-right">▶</div>
      </div>

      <div class="action-buttons">
        <div class="btn-touch btn-action btn-jump" id="touch-jump">PULO</div>
        <div class="btn-touch btn-action btn-attack" id="touch-attack">ATAQUE</div>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const btnRestart = document.getElementById("btn-restart");

    let currentStage = 1;
    const maxStages = 27;
    let score = 0;
    let gameOver = false;
    let stageMissionText = "";
    let missionTimer = 180;

    const player = {
      x: 50, y: 280, width: 40, height: 70,
      vx: 0, vy: 0, speed: 4.8, friction: 0.82,
      grounded: false, crouching: false, facing: 'right', aimingUp: false,
      attacking: false, attackTimer: 0, attackMaxTime: 12,
      animFrame: 0, animTimer: 0
    };

    const gravity = 0.65;
    const groundY = 370;
    const weapon = { x: 0, y: 0, length: 0, maxLength: 150 };

    // ESTADO DOS CONTROLES VIRTUAIS
    const touchInput = { left: false, right: false, up: false, down: false };

    // REGRAS DAS FASES
    const stageRules = {
      1: {
        title: "FASE 1: LETRAS MINÚSCULAS",
        instruction: "ATENÇÃO: Destrua APENAS as letras MINÚSCULAS (a-f)!",
        isValid: (char) => char === char.toLowerCase() && isNaN(char),
        generateChar: () => ['A','B','C','D','E','F','a','b','c','d','e','f'][Math.floor(Math.random() * 12)]
      },
      2: {
        title: "FASE 2: NÚMEROS PARES",
        instruction: "ATENÇÃO: Destrua APENAS os NÚMEROS PARES!",
        isValid: (char) => !isNaN(char) && parseInt(char) % 2 === 0,
        generateChar: () => ['1','2','3','4','5','6','7','8','9'][Math.floor(Math.random() * 9)]
      }
    };

    function getRuleForStage(stage) {
      if (stageRules[stage]) return stageRules[stage];
      return {
        title: `FASE ${stage}: DESAFIO DE VOGAIS`,
        instruction: "ATENÇÃO: Destrua APENAS as VOGAIS!",
        isValid: (char) => ['A','E','I','O','U'].includes(char.toUpperCase()),
        generateChar: () => ['A','B','E','F','I','K','O','P','U'][Math.floor(Math.random() * 9)]
      };
    }

    const enemies = [];
    function spawnEnemies() {
      enemies.length = 0;
      const currentRule = getRuleForStage(currentStage);
      missionTimer = 180;
      stageMissionText = currentRule.instruction;

      const count = 4 + Math.floor(currentStage * 0.5);
      for (let i = 0; i < count; i++) {
        const charSymbol = currentRule.generateChar();
        enemies.push({
          x: 450 + i * 150 + Math.random() * 30,
          y: groundY - 40, width: 40, height: 40,
          speed: 1.5 + (currentStage * 0.1), alive: true,
          symbol: charSymbol, isTarget: currentRule.isValid(charSymbol)
        });
      }
    }
    spawnEnemies();

    // EVENTOS TOUCHSCREEN (CELULAR)
    function setupTouchBtn(id, onPress, onRelease) {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); onPress(); });
      el.addEventListener("touchend", (e) => { e.preventDefault(); onRelease(); });
      el.addEventListener("mousedown", (e) => { e.preventDefault(); onPress(); });
      el.addEventListener("mouseup", (e) => { e.preventDefault(); onRelease(); });
    }

    setupTouchBtn("touch-left", () => touchInput.left = true, () => touchInput.left = false);
    setupTouchBtn("touch-right", () => touchInput.right = true, () => touchInput.right = false);
    setupTouchBtn("touch-up", () => touchInput.up = true, () => touchInput.up = false);
    setupTouchBtn("touch-down", () => touchInput.down = true, () => touchInput.down = false);
    
    setupTouchBtn("touch-jump", () => {
      if (player.grounded) { player.vy = -12.5; player.grounded = false; }
    }, () => {});

    setupTouchBtn("touch-attack", () => {
      if (!player.attacking) { player.attacking = true; player.attackTimer = player.attackMaxTime; }
    }, () => {});

    // REINICIAR O JOGO
    function resetGame() {
      gameOver = false;
      score = 0;
      currentStage = 1;
      player.x = 50; player.y = 280; player.vx = 0; player.vy = 0;
      btnRestart.style.display = "none";
      spawnEnemies();
    }

    // CONTROLES DE TECLADO
    const keys = {};
    window.addEventListener("keydown", (e) => { keys[e.code] = true; });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    function update() {
      if (gameOver) {
        btnRestart.style.display = "block";
        return;
      }
      if (missionTimer > 0) missionTimer--;

      // Mover via teclado ou toque
      player.aimingUp = keys["ArrowUp"] || touchInput.up;
      player.crouching = (keys["ArrowDown"] || touchInput.down) && player.grounded;

      if ((keys["ArrowLeft"] || touchInput.left) && !player.crouching) {
        player.vx = -player.speed; player.facing = 'left';
      } else if ((keys["ArrowRight"] || touchInput.right) && !player.crouching) {
        player.vx = player.speed; player.facing = 'right';
      }

      if (keys["Space"] && player.grounded) {
        player.vy = -12.5; player.grounded = false;
      }

      if ((keys["KeyZ"] || keys["KeyX"]) && !player.attacking) {
        player.attacking = true; player.attackTimer = player.attackMaxTime;
      }

      // Física
      player.vx *= player.friction; player.x += player.vx;
      player.vy += gravity; player.y += player.vy;

      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height; player.vy = 0; player.grounded = true;
      }

      if (player.x < 0) player.x = 0;

      // Avançar de Fase
      if (player.x + player.width >= canvas.width) {
        if (currentStage < maxStages) {
          currentStage++; player.x = 20; spawnEnemies();
        } else {
          alert("PARABÉNS! Você concluiu todos os níveis com o Dr. Chácara!");
          resetGame();
        }
      }

      // Ataque Diskarmor
      if (player.attacking) {
        player.attackTimer--;
        const progress = 1 - (player.attackTimer / player.attackMaxTime);
        weapon.length = Math.sin(progress * Math.PI) * weapon.maxLength;

        if (player.aimingUp) {
          weapon.x = player.x + player.width / 2; weapon.y = player.y - weapon.length;
        } else if (player.crouching) {
          weapon.y = player.y + player.height - 15;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        } else {
          weapon.y = player.y + 25;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        }

        if (player.attackTimer <= 0) player.attacking = false;
      }

      // Inimigos
      enemies.forEach(enemy => {
        if (!enemy.alive) return;

        if (enemy.x > player.x) enemy.x -= enemy.speed;
        else enemy.x += enemy.speed;

        if (player.attacking) {
          const hit = (enemy.x < weapon.x + 25 && enemy.x + enemy.width > weapon.x - 25 &&
                       enemy.y < weapon.y + 25 && enemy.y + enemy.height > weapon.y - 25);
          if (hit) {
            enemy.alive = false;
            if (enemy.isTarget) score += 500;
            else score = Math.max(0, score - 200);
          }
        }

        if (enemy.alive &&
            player.x < enemy.x + enemy.width && player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
          gameOver = true;
        }
      });
    }

    function drawDrChacara(x, y, facing, crouching) {
      ctx.save();
      ctx.translate(x + player.width / 2, y);
      if (facing === 'left') ctx.scale(-1, 1);

      const h = crouching ? 45 : 70;
      ctx.fillStyle = "#1a1a24"; ctx.fillRect(-10, h - 25, 8, 25); ctx.fillRect(2, h - 25, 8, 25);
      ctx.fillStyle = "#0066cc"; ctx.fillRect(-10, crouching ? 15 : 20, 20, 25);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(-14, crouching ? 10 : 18, 28, crouching ? 25 : 35);
      ctx.fillStyle = "#f3c099"; ctx.fillRect(-9, 0, 18, 18);
      ctx.fillStyle = "#111111"; ctx.fillRect(-10, -1, 20, 5);
      ctx.fillStyle = "#5A5A66"; ctx.fillRect(-11, -7, 22, 7);
      ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5; ctx.strokeRect(1, 4, 7, 5);
      ctx.restore();
    }

    function draw() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#120826"); grad.addColorStop(0.6, "#7a223b"); grad.addColorStop(1, "#2e1200");
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff3300"; ctx.beginPath(); ctx.arc(680, 140, 48, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#26150d"; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.fillStyle = "#00ffcc"; ctx.fillRect(0, groundY, canvas.width, 3);

      drawDrChacara(player.x, player.y, player.facing, player.crouching);

      if (player.attacking) {
        ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 5; ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y + 25); ctx.lineTo(weapon.x, weapon.y); ctx.stroke();
        ctx.fillStyle = "#00ffcc"; ctx.beginPath(); ctx.arc(weapon.x, weapon.y, 12, 0, Math.PI * 2); ctx.fill();
      }

      enemies.forEach(enemy => {
        if (enemy.alive) {
          ctx.fillStyle = "#1a1a2e"; ctx.strokeStyle = enemy.isTarget ? "#00ffcc" : "#ff0055"; ctx.lineWidth = 3;
          ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
          ctx.strokeRect(enemy.x, enemy.y, enemy.width, enemy.height);
          ctx.fillStyle = "#ffffff"; ctx.font = "bold 24px 'Segoe UI'"; ctx.textAlign = "center";
          ctx.fillText(enemy.symbol, enemy.x + enemy.width / 2, enemy.y + 28);
        }
      });

      const currentRule = getRuleForStage(currentStage);
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "left";
      ctx.fillText(`${currentRule.title}`, 20, 30);
      ctx.fillText(`PONTOS: ${score}`, 650, 30);

      if (missionTimer > 0) {
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(50, 150, 700, 100);
        ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 2; ctx.strokeRect(50, 150, 700, 100);
        ctx.fillStyle = "#00ffcc"; ctx.font = "bold 20px 'Segoe UI'"; ctx.textAlign = "center";
        ctx.fillText(currentRule.title, canvas.width / 2, 185);
        ctx.fillStyle = "#fff"; ctx.font = "16px 'Segoe UI'";
        ctx.fillText(stageMissionText, canvas.width / 2, 220);
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff0055"; ctx.font = "bold 36px 'Segoe UI'"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
