<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doutor Chácara Retro - Portal de Jogos Clássicos</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d11;
      color: #ffffff;
      text-align: center;
    }

    /* SEÇÃO DE CAPA */
    .hero-background {
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to bottom, rgba(13, 13, 17, 0.2), rgba(13, 13, 17, 0.85)),
        url('fundo.jpg.jpg');
      
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 40px 20px;
    }

    .btn-jogar {
      display: inline-block;
      background-color: #ff0055;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 50px;
      text-decoration: none;
      border: 2px solid #ffffff;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      transition: all 0.3s ease;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .btn-jogar:hover {
      background-color: #00ffcc;
      color: #000000;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.9);
      transform: scale(1.08);
    }

    .subtitulo-rodape {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d1d1e0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* ÁREA DO JOGO */
    #area-arcade {
      min-height: 100vh;
      padding: 60px 20px;
      background-color: #121218;
    }

    .status-controle {
      display: inline-block;
      padding: 10px 20px;
      background-color: #1a1a24;
      border: 1px solid #33334d;
      border-radius: 20px;
      font-size: 0.95rem;
      color: #ffcc00;
      margin-bottom: 20px;
    }

    #gameCanvas {
      background: #000000;
      border: 3px solid #00ffcc;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      max-width: 100%;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- CAPA PRINCIPAL -->
  <header class="hero-background">
    <a href="#area-arcade" class="btn-jogar">COMEÇAR JOGO RETRO</a>
    <p class="subtitulo-rodape">SEU PORTAL DE JOGOS CLÁSSICOS</p>
  </header>

  <!-- ÁREA DO JOGO EXCLUSIVO -->
  <main id="area-arcade">
    <h2>Space Defender - Doutor Chácara Edition</h2>
    <p style="margin-top: 5px; color: #a0a0b0; margin-bottom: 15px;">Use as Setas / D-Pad do Controle para mover e Espaço / Botão A para Atirar.</p>

    <!-- Status do Joystick -->
    <div class="status-controle" id="gamepad-status">
      🎮 Status: Conecte seu controle USB/PS2 e pressione qualquer botão.
    </div>

    <!-- TELA DO JOGO HTML5 CANVAS -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ESTADO DO JOGO
    let score = 0;
    let lives = 3;
    let gameOver = false;

    // JOGADOR (NAVE)
    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 60,
      width: 40,
      height: 20,
      speed: 6,
      dx: 0
    };

    // TIROS
    const bullets = [];
    const bulletSpeed = 8;
    let lastShot = 0;

    // INIMIGOS
    const enemies = [];
    const enemyRows = 4;
    const enemyCols = 8;
    const enemyWidth = 40;
    const enemyHeight = 25;
    const enemyPadding = 15;
    const enemyOffsetTop = 50;
    const enemyOffsetLeft = 100;
    let enemyDirection = 1;
    let enemySpeed = 1;

    function createEnemies() {
      enemies.length = 0;
      for (let c = 0; c < enemyCols; c++) {
        for (let r = 0; r < enemyRows; r++) {
          enemies.push({
            x: enemyOffsetLeft + c * (enemyWidth + enemyPadding),
            y: enemyOffsetTop + r * (enemyHeight + enemyPadding),
            width: enemyWidth,
            height: enemyHeight,
            alive: true
          });
        }
      }
    }
    createEnemies();

    // CONTROLES DE TECLADO
    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "Space") e.preventDefault();
    });
    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    // DETECÇÃO DE CONTROLE USB/PS2
    let gamepadIndex = null;
    window.addEventListener("gamepadconnected", (e) => {
      gamepadIndex = e.gamepad.index;
      const statusDiv = document.getElementById("gamepad-status");
      statusDiv.style.color = "#00ffcc";
      statusDiv.innerHTML = `🎮 Controle Detectado: <strong>${e.gamepad.id}</strong>`;
    });

    window.addEventListener("gamepaddisconnected", () => {
      gamepadIndex = null;
      const statusDiv = document.getElementById("gamepad-status");
      statusDiv.style.color = "#ff3366";
      statusDiv.innerHTML = "🎮 Controle Desconectado.";
    });

    function pollGamepad() {
      if (gamepadIndex === null) return;
      const gp = navigator.getGamepads()[gamepadIndex];
      if (!gp) return;

      // Direcionais (Analógico ou D-Pad)
      if (gp.axes[0] < -0.3 || gp.buttons[14]?.pressed) player.dx = -player.speed;
      else if (gp.axes[0] > 0.3 || gp.buttons[15]?.pressed) player.dx = player.speed;
      else if (!keys["ArrowLeft"] && !keys["ArrowRight"]) player.dx = 0;

      // Botão de tiro (X, A ou R1)
      if ((gp.buttons[0]?.pressed || gp.buttons[1]?.pressed || gp.buttons[7]?.pressed) && Date.now() - lastShot > 250) {
        shoot();
      }
    }

    function shoot() {
      bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 12
      });
      lastShot = Date.now();
    }

    function update() {
      if (gameOver) return;

      pollGamepad();

      // Mover Jogador via Teclado
      if (keys["ArrowLeft"]) player.dx = -player.speed;
      else if (keys["ArrowRight"]) player.dx = player.speed;
      else if (gamepadIndex === null) player.dx = 0;

      if (keys["Space"] && Date.now() - lastShot > 250) {
        shoot();
      }

      player.x += player.dx;
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      // Mover Tiros
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bulletSpeed;
        if (bullets[i].y < 0) bullets.splice(i, 1);
      }

      // Mover Inimigos
      let moveDown = false;
      enemies.forEach(e => {
        if (!e.alive) return;
        if ((e.x + e.width >= canvas.width && enemyDirection === 1) || (e.x <= 0 && enemyDirection === -1)) {
          moveDown = true;
        }
      });

      if (moveDown) {
        enemyDirection *= -1;
        enemies.forEach(e => {
          if (e.alive) {
            e.y += 15;
            if (e.y + e.height >= player.y) gameOver = true;
          }
        });
      }

      enemies.forEach(e => {
        if (e.alive) e.x += enemySpeed * enemyDirection;
      });

      // Colisões de Tiro com Inimigo
      bullets.forEach((b, bIdx) => {
        enemies.forEach(e => {
          if (e.alive && b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
            e.alive = false;
            bullets.splice(bIdx, 1);
            score += 100;
          }
        });
      });

      // Vitória
      if (enemies.every(e => !e.alive)) {
        enemySpeed += 0.5;
        createEnemies();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenhar Jogador
      ctx.fillStyle = "#00ffcc";
      ctx.fillRect(player.x, player.y, player.width, player.height);
      ctx.fillRect(player.x + 15, player.y - 8, 10, 8); // Bico da nave

      // Desenhar Tiros
      ctx.fillStyle = "#ff0055";
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      // Desenhar Inimigos
      ctx.fillStyle = "#ffcc00";
      enemies.forEach(e => {
        if (e.alive) {
          ctx.fillRect(e.x, e.y, e.width, e.height);
        }
      });

      // HUD (Placar)
      ctx.fillStyle = "#ffffff";
      ctx.font = "18px 'Segoe UI', sans-serif";
      ctx.fillText(`PONTOS: ${score}`, 20, 30);

      // Game Over
      if (gameOver) {
        ctx.fillStyle = "#ff0055";
        ctx.font = "40px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
        ctx.font = "20px 'Segoe UI', sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("Recarregue a página para jogar novamente", canvas.width / 2, canvas.height / 2 + 40);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>

</body>
</html>
