<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doutor Chácara - Rygar Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0d0d11; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center; overflow-x: hidden;
    }
    .hero-background {
      width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, rgba(13,13,17,0.2), rgba(13,13,17,0.85)), url('capa-doutorchacara.jpg.jfif');
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 40px;
    }
    .btn-jogar {
      background: #ff0055; color: #fff; font-size: 1.2rem; font-weight: bold;
      padding: 16px 36px; border-radius: 50px; text-decoration: none;
      border: 2px solid #fff; box-shadow: 0 0 15px rgba(255,0,85,0.6);
      transition: 0.3s; margin-bottom: 20px;
    }
    .btn-jogar:hover { background: #00ffcc; color: #000; box-shadow: 0 0 25px rgba(0,255,204,0.9); }
    #area-arcade { min-height: 100vh; padding: 40px 20px; background: #121218; }
    .status-controle {
      display: inline-block; padding: 10px 20px; background: #1a1a24;
      border: 1px solid #33334d; border-radius: 20px; font-size: 0.95rem; color: #ffcc00; margin-bottom: 15px;
    }
    #gameCanvas {
      background: #000; border: 3px solid #00ffcc; border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,255,204,0.3); max-width: 100%; display: block; margin: 0 auto;
    }
  </style>
</head>
<body>

  <header class="hero-background">
    <a href="#area-arcade" class="btn-jogar">JOGAR COM DR. CHÁCARA</a>
    <p style="letter-spacing: 2px; color: #d1d1e0;">27 FASES • ANIMAÇÃO PROCEDURAL RETRO</p>
  </header>

  <main id="area-arcade">
    <h2>Doutor Chácara em: Legendary Warrior Arcade</h2>
    <p style="color: #a0a0b0; margin-bottom: 15px;">
      Setas/D-Pad: Mover/Agachar | Espaço/A: Pular | Z/X/B: Atacar Diskarmor (360°)
    </p>

    <div class="status-controle" id="gamepad-status">
      🎮 Status: Conecte seu controle USB/PS2 e pressione qualquer botão.
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentStage = 1;
    const maxStages = 27;
    let score = 0;
    let gameOver = false;

    // FÍSICA E ANIMAÇÃO DO DOUTOR CHÁCARA
    const player = {
      x: 50, y: 280,
      width: 40, height: 70,
      vx: 0, vy: 0,
      speed: 4.8, friction: 0.82,
      grounded: false, crouching: false,
      facing: 'right', aimingUp: false,
      attacking: false, attackTimer: 0, attackMaxTime: 12,
      animFrame: 0, animTimer: 0
    };

    const gravity = 0.65;
    const groundY = 370;

    // ATAQUE DISKARMOR
    const weapon = { x: 0, y: 0, length: 0, maxLength: 150 };

    // INIMIGOS
    const enemies = [];
    function spawnEnemies() {
      enemies.length = 0;
      const count = 3 + Math.floor(currentStage * 0.7);
      for (let i = 0; i < count; i++) {
        enemies.push({
          x: 450 + i * 160 + Math.random() * 40,
          y: groundY - 35, width: 35, height: 35,
          speed: 1.8 + (currentStage * 0.12), alive: true,
          type: Math.random() > 0.5 ? 'ground' : 'jumper'
        });
      }
    }
    spawnEnemies();

    // TECLADO E GAMEPAD
    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (["Space", "ArrowUp", "ArrowDown", "KeyZ", "KeyX"].includes(e.code)) e.preventDefault();
    });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    let gamepadIndex = null;
    window.addEventListener("gamepadconnected", (e) => {
      gamepadIndex = e.gamepad.index;
      document.getElementById("gamepad-status").style.color = "#00ffcc";
      document.getElementById("gamepad-status").innerHTML = `🎮 Controle Detectado: <strong>${e.gamepad.id}</strong>`;
    });
    window.addEventListener("gamepaddisconnected", () => { gamepadIndex = null; });

    function pollGamepad() {
      if (gamepadIndex === null) return;
      const gp = navigator.getGamepads()[gamepadIndex];
      if (!gp) return;

      player.aimingUp = gp.axes[1] < -0.5 || gp.buttons[12]?.pressed;
      player.crouching = gp.axes[1] > 0.5 || gp.buttons[13]?.pressed;

      if (gp.axes[0] < -0.3 || gp.buttons[14]?.pressed) {
        player.vx = -player.speed; player.facing = 'left';
      } else if (gp.axes[0] > 0.3 || gp.buttons[15]?.pressed) {
        player.vx = player.speed; player.facing = 'right';
      }

      if ((gp.buttons[0]?.pressed) && player.grounded) {
        player.vy = -12.5; player.grounded = false;
      }

      if ((gp.buttons[1]?.pressed || gp.buttons[2]?.pressed) && !player.attacking) {
        triggerAttack();
      }
    }

    function triggerAttack() {
      player.attacking = true;
      player.attackTimer = player.attackMaxTime;
    }

    function update() {
      if (gameOver) return;

      pollGamepad();

      if (gamepadIndex === null) {
        player.aimingUp = keys["ArrowUp"];
        player.crouching = keys["ArrowDown"] && player.grounded;

        if (keys["ArrowLeft"] && !player.crouching) {
          player.vx = -player.speed; player.facing = 'left';
        } else if (keys["ArrowRight"] && !player.crouching) {
          player.vx = player.speed; player.facing = 'right';
        }

        if (keys["Space"] && player.grounded) {
          player.vy = -12.5; player.grounded = false;
        }

        if ((keys["KeyZ"] || keys["KeyX"]) && !player.attacking) {
          triggerAttack();
        }
      }

      // Aplicação de Inércia e Gravidade
      player.vx *= player.friction;
      player.x += player.vx;
      player.vy += gravity;
      player.y += player.vy;

      // Colisão com Chão
      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height;
        player.vy = 0; player.grounded = true;
      }

      if (player.x < 0) player.x = 0;

      // Troca de Fase
      if (player.x + player.width >= canvas.width) {
        if (currentStage < maxStages) {
          currentStage++; player.x = 20; spawnEnemies();
        } else {
          alert("PARABÉNS! Você completou as 27 Fases de Rygar com o Dr. Chácara!");
          currentStage = 1; player.x = 20; score = 0; spawnEnemies();
        }
      }

      // Contador de Animação
      if (Math.abs(player.vx) > 0.5 && player.grounded) {
        player.animTimer++;
        if (player.animTimer % 6 === 0) player.animFrame = (player.animFrame + 1) % 4;
      } else {
        player.animFrame = 0;
      }

      // Lógica de Ataque 360°
      if (player.attacking) {
        player.attackTimer--;
        const progress = 1 - (player.attackTimer / player.attackMaxTime);
        weapon.length = Math.sin(progress * Math.PI) * weapon.maxLength;

        if (player.aimingUp) {
          weapon.x = player.x + player.width / 2;
          weapon.y = player.y - weapon.length;
        } else if (player.crouching) {
          weapon.y = player.y + player.height - 15;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        } else {
          weapon.y = player.y + 25;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        }

        if (player.attackTimer <= 0) player.attacking = false;
      }

      // Colisão com Inimigos
      enemies.forEach(enemy => {
        if (!enemy.alive) return;

        if (enemy.x > player.x) enemy.x -= enemy.speed;
        else enemy.x += enemy.speed;

        if (enemy.type === 'jumper' && Math.random() < 0.02 && enemy.y >= groundY - enemy.height) {
          enemy.y -= 50;
        } else if (enemy.y < groundY - enemy.height) {
          enemy.y += 2;
        }

        if (player.attacking) {
          const hit = (enemy.x < weapon.x + 25 && enemy.x + enemy.width > weapon.x - 25 &&
                       enemy.y < weapon.y + 25 && enemy.y + enemy.height > weapon.y - 25);
          if (hit) { enemy.alive = false; score += 300; }
        }

        if (enemy.alive &&
            player.x < enemy.x + enemy.width && player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
          gameOver = true;
        }
      });
    }

    // DESENHAR O DOUTOR CHÁCARA PROCEDURALMENTE
    function drawDrChacara(x, y, facing, frame, crouching, grounded) {
      ctx.save();
      ctx.translate(x + player.width / 2, y);
      if (facing === 'left') ctx.scale(-1, 1);

      const legOffset = Math.sin(frame * Math.PI / 2) * 10;
      const h = crouching ? 45 : 70;

      // Pernas (Calça Preta)
      ctx.fillStyle = "#1a1a24";
      if (grounded && !crouching && Math.abs(player.vx) > 0.5) {
        ctx.fillRect(-12 + legOffset, h - 25, 8, 25);
        ctx.fillRect(4 - legOffset, h - 25, 8, 25);
      } else if (crouching) {
        ctx.fillRect(-14, h - 15, 12, 15);
        ctx.fillRect(2, h - 15, 12, 15);
      } else {
        ctx.fillRect(-10, h - 25, 8, 25);
        ctx.fillRect(2, h - 25, 8, 25);
      }

      // Camisa Azul
      ctx.fillStyle = "#0066cc";
      ctx.fillRect(-10, crouching ? 15 : 20, 20, 25);

      // Jaleco Branco
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-14, crouching ? 10 : 18, 8, crouching ? 25 : 35); // Lado esquerdo
      ctx.fillRect(6, crouching ? 10 : 18, 8, crouching ? 25 : 35);  // Lado direito
      ctx.fillRect(-14, crouching ? 10 : 18, 28, 10);              // Ombro

      // Detalhe da Oliva no Bolso do Jaleco
      ctx.fillStyle = "#486e2e";
      ctx.beginPath(); ctx.arc(9, crouching ? 28 : 36, 2.5, 0, Math.PI * 2); ctx.fill();

      // Cabeça / Rosto
      ctx.fillStyle = "#f3c099";
      ctx.fillRect(-9, 0, 18, 18);

      // Cabelo Grisalho / Faixa Preta
      ctx.fillStyle = "#111111"; // Faixa preta na cabeça
      ctx.fillRect(-10, -1, 20, 5);
      ctx.fillStyle = "#5A5A66"; // Cabelo grisalho
      ctx.fillRect(-11, -7, 22, 7);

      // Óculos
      ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.5;
      ctx.strokeRect(1, 4, 7, 5);

      ctx.restore();
    }

    function draw() {
      // Fundo Arcade com Pôr do Sol estilo Rygar
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#120826"); grad.addColorStop(0.6, "#7a223b"); grad.addColorStop(1, "#2e1200");
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sol Vermelho
      ctx.fillStyle = "#ff3300"; ctx.beginPath(); ctx.arc(680, 140, 48, 0, Math.PI * 2); ctx.fill();

      // Chão estilo Templo
      ctx.fillStyle = "#26150d"; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.fillStyle = "#00ffcc"; ctx.fillRect(0, groundY, canvas.width, 3);

      // Desenhar o Doutor Chácara Animado
      drawDrChacara(player.x, player.y, player.facing, player.animFrame, player.crouching, player.grounded);

      // Desenhar Diskarmor (Corrente Neon)
      if (player.attacking) {
        ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 5; ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y + 25);
        ctx.lineTo(weapon.x, weapon.y); ctx.stroke();

        ctx.fillStyle = "#00ffcc"; ctx.beginPath(); ctx.arc(weapon.x, weapon.y, 12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
      }

      // Inimigos
      enemies.forEach(enemy => {
        if (enemy.alive) {
          ctx.fillStyle = enemy.type === 'jumper' ? "#ff0055" : "#ff9900";
          ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
        }
      });

      // HUD
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px 'Segoe UI', sans-serif";
      ctx.fillText(`FASE: ${currentStage} / ${maxStages}`, 20, 30);
      ctx.fillText(`PONTOS: ${score}`, 200, 30);

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff0055"; ctx.font = "bold 36px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
