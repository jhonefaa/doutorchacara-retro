<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doutor Chácara - Online Multiplayer v2.7</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #111; font-family: 'Courier New', Courier, monospace; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 56.25vw; 
            max-width: 800px; 
            max-height: 450px; 
            background: #000; 
            overflow: hidden; 
            border: 2px solid #fff; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2); 
        }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: linear-gradient(to bottom, #1a0033, #000000); }
        
        .ui-panel { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; text-shadow: 2px 2px #000; z-index: 10; pointer-events: none; }
        .btn-ui { background: #333; color: #fff; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; pointer-events: auto; font-family: inherit; font-size: 11px; }
        .btn-ui:active { background: #555; }
        
        /* Chat Ao Vivo Overlay */
        #chat-box { position: absolute; bottom: 95px; left: 10px; width: 230px; height: 95px; background: rgba(0,0,0,0.65); border: 1px solid #555; font-size: 10px; z-index: 25; display: flex; flex-direction: column; padding: 4px; pointer-events: auto; border-radius: 4px; }
        #chat-messages { flex: 1; overflow-y: auto; margin-bottom: 4px; display: flex; flex-direction: column; gap: 2px; }
        #chat-input-container { display: flex; gap: 2px; }
        #chat-input { flex: 1; font-size: 10px; padding: 2px 4px; font-family: inherit; background: #222; color: #fff; border: 1px solid #777; border-radius: 2px; }

        #touch-controls { position: absolute; bottom: 8px; left: 10px; right: 10px; height: 85px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .joystick-zone { width: 75px; height: 75px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; position: relative; }
        .joystick-knob { width: 30px; height: 30px; background: rgba(255,255,255,0.8); border-radius: 50%; position: absolute; top: 20px; left: 20px; }
        .action-buttons { display: flex; gap: 6px; }
        .btn-action { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; font-weight: bold; font-size: 10px; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px #000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 0 #000; }
        #btn-jump { background: #2196F3; }
        #btn-attack { background: #4CAF50; }
        #btn-special { background: #FF9800; }

        /* Modais */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 40; padding: 12px; text-align: center; }
        .hidden { display: none !important; }
        .modal input, .modal select { padding: 6px; font-size: 11px; text-align: center; margin: 4px 0; font-family: inherit; width: 80%; max-width: 240px; background: #222; color: #fff; border: 1px solid #555; }
        .modal button { padding: 6px 14px; font-size: 11px; cursor: pointer; background: #fff; color: #000; border: none; font-weight: bold; margin-top: 6px; }
        
        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; width: 100%; max-width: 400px; }
        .char-card { background: #222; border: 2px solid #555; padding: 6px; cursor: pointer; font-size: 10px; border-radius: 4px; }
        .char-card.selected { border-color: #4CAF50; background: #1b3d1b; }

        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 90%; max-height: 55%; overflow-y: auto; margin-bottom: 8px; width: 100%; }
        .config-grid button, .config-grid select { width: 100%; font-size: 10px; padding: 6px; background: #222; color: #fff; border: 1px solid #555; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- Tela de Autenticação / Cadastro -->
    <div id="modal-auth" class="modal">
        <h2 style="color: #4CAF50; margin-bottom: 4px;">DOUTOR CHÁCARA ONLINE</h2>
        <p style="font-size: 10px; margin-bottom: 8px;">Acesso restrito a usuários cadastrados (Máx 6 Jogadores por Sala)</p>
        <input type="text" id="auth-user" placeholder="Usuário" autocomplete="off">
        <input type="password" id="auth-pass" placeholder="Senha">
        <div style="display: flex; gap: 6px;">
            <button id="btn-login" style="background:#4CAF50; color:#fff;">ENTRAR</button>
            <button id="btn-register" style="background:#2196F3; color:#fff;">CADASTRAR</button>
        </div>
        <p id="auth-msg" style="color: #ff5555; font-size: 10px; margin-top: 6px;"></p>
    </div>

    <!-- Tela de Seleção de Personagem -->
    <div id="modal-char" class="modal hidden">
        <h3 style="color: #ffeb3b; margin-bottom: 4px;">SELEÇÃO DE PERSONAGEM</h3>
        <p style="font-size: 10px;">Escolha um membro da família:</p>
        <div class="char-grid" id="char-selection-list"></div>
        <button id="btn-start-game" style="background: #4CAF50; color: #fff;">ENTRAR NA SALA</button>
    </div>

    <div class="ui-panel">
        <div>
            <div>FASE: <span id="ui-stage">1</span> | PONTOS: <span id="ui-score">0</span></div>
            <div>VIDAS: <span id="ui-lives">❤️❤️❤️</span> | JOGADORES: <span id="ui-players-count">1</span>/6</div>
        </div>
        <div>
            <button class="btn-ui" id="btn-config">⚙️ CONFIGS</button>
        </div>
    </div>

    <!-- Chat ao Vivo -->
    <div id="chat-box">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Digite uma mensagem..." maxlength="60">
            <button class="btn-ui" id="btn-send-chat" style="font-size:8px; padding:2px 4px;">ENVIAR</button>
        </div>
    </div>

    <div id="touch-controls">
        <div class="joystick-zone" id="joystick-zone">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <div class="btn-action" id="btn-attack">ESC.U</div>
            <div class="btn-action" id="btn-special">REL.I</div>
            <div class="btn-action" id="btn-jump">PULO</div>
        </div>
    </div>

    <!-- Modal de Configurações / Mapeamento de Teclas -->
    <div id="modal-keybinds" class="modal hidden">
        <h3 style="margin-bottom: 5px; color: #4CAF50;">CONFIGURAÇÕES</h3>
        <div class="config-grid">
            <button id="rebind-left">Esquerda: A</button>
            <button id="rebind-right">Direita: D</button>
            <button id="rebind-jump">Pulo: ESPAÇO</button>
            <button id="rebind-attack">Escudo U: U</button>
            <button id="rebind-special">Relógio I: I</button>
            
            <select id="gamepad-select">
                <option value="0">Gamepad: Desativado</option>
                <option value="1">Gamepad 1: Detectado</option>
            </select>
            
            <select id="sens-select">
                <option value="1">Sensibilidade Joystick: Normal</option>
                <option value="1.5">Sensibilidade Joystick: Alta</option>
            </select>
        </div>
        <div style="display: flex; gap: 6px;">
            <button id="btn-save-keybinds" style="background: #4CAF50; color: white;">SALVAR E RETORNAR</button>
            <button id="btn-logout" style="background: #ff5555; color: white;">SAIR DA CONTA</button>
        </div>
    </div>

    <div id="modal-gameover" class="modal hidden">
        <h1>GAME OVER</h1>
        <p>Você perdeu todas as suas vidas!</p>
        <button id="btn-restart" style="background: #4CAF50; color:#fff;">REINICIAR</button>
    </div>
</div>

<script>
/**
 * DOUTOR CHÁCARA - ONLINE MULTIPLAYER v2.7 (Integrado com Mecânicas v2.6)
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Canal de Comunicação Sincronizado para Sala Multiplayer
const netChannel = new BroadcastChannel('doutor_chacara_multiplayer_v27');

// 6 Personagens da Família do Doutor Chácara
const charactersData = [
    { id: 0, name: 'Doutor Chácara', color: '#003366', role: 'Original' },
    { id: 1, name: 'Pai do Doutor', color: '#8a2be2', role: 'Violeta' },
    { id: 2, name: 'Irmã do Doutor', color: '#ff1493', role: 'Rosa' },
    { id: 3, name: 'Filho', color: '#4caf50', role: 'Verde' },
    { id: 4, name: 'Filha', color: '#ffeb3b', role: 'Amarelo' },
    { id: 5, name: 'Tio', color: '#795548', role: 'Marrom' }
];

let currentUser = null;
let selectedCharId = 0;
let onlinePlayers = {}; // Mapeia a posição e estado dos outros jogadores na sala

const state = {
    score: 0,
    lives: 3,
    stage: 1,
    isImmune: false,
    immunityTimer: 0,
    pinkShield: false,
    isGameOver: false,
    isPaused: false,
    waitingForOtherPlayers: false,
    lastPinkButterflyScore: 0,
    lastSuperInsectScore: 0,
    gamepadSensitivity: 1,
    keyMap: {
        left: 'KeyA',
        right: 'KeyD',
        jump: 'Space',
        attack: 'KeyU',
        special: 'KeyI'
    }
};

// 1. SISTEMA DE AUTENTICAÇÃO E CADASTRO OBRIGATÓRIO
function initAuthSystem() {
    const getUsers = () => JSON.parse(localStorage.getItem('dc_users_db_v27') || '{}');

    document.getElementById('btn-register').onclick = () => {
        const u = document.getElementById('auth-user').value.trim();
        const p = document.getElementById('auth-pass').value.trim();
        if(!u || !p) { document.getElementById('auth-msg').innerText = 'Preencha usuário e senha!'; return; }
        
        let users = getUsers();
        if(users[u]) { document.getElementById('auth-msg').innerText = 'Conta já cadastrada!'; return; }
        
        users[u] = p;
        localStorage.setItem('dc_users_db_v27', JSON.stringify(users));
        document.getElementById('auth-msg').style.color = '#4CAF50';
        document.getElementById('auth-msg').innerText = 'Cadastro concluído! Clique em Entrar.';
    };

    document.getElementById('btn-login').onclick = () => {
        const u = document.getElementById('auth-user').value.trim();
        const p = document.getElementById('auth-pass').value.trim();
        let users = getUsers();
        
        if(!users[u] || users[u] !== p) {
            document.getElementById('auth-msg').style.color = '#ff5555';
            document.getElementById('auth-msg').innerText = 'Usuário ou senha incorretos!';
            return;
        }

        currentUser = u;
        document.getElementById('modal-auth').classList.add('hidden');
        renderCharacterSelection();
    };
}

function renderCharacterSelection() {
    const list = document.getElementById('char-selection-list');
    list.innerHTML = '';
    charactersData.forEach(c => {
        list.innerHTML += `
            <div class="char-card ${c.id === selectedCharId ? 'selected' : ''}" onclick="selectCharacter(${c.id})">
                <div style="width:20px; height:20px; background:${c.color}; margin:0 auto 4px auto; border-radius:3px;"></div>
                <strong>${c.name}</strong><br><span style="color:#aaa; font-size:9px;">${c.role}</span>
            </div>
        `;
    });
    document.getElementById('modal-char').classList.remove('hidden');
}

window.selectCharacter = function(id) {
    selectedCharId = id;
    renderCharacterSelection();
};

document.getElementById('btn-start-game').onclick = () => {
    document.getElementById('modal-char').classList.add('hidden');
    initStage(1);
};

// Configurações e Teclas
function loadSettings() {
    const savedKeys = localStorage.getItem('dc_keybinds_v27');
    if (savedKeys) {
        try { 
            const data = JSON.parse(savedKeys);
            state.keyMap = data.keyMap; 
            state.gamepadSensitivity = data.sens || 1;
            updateKeybindButtonsUI(); 
        } catch(e){}
    }
}

function saveSettings() {
    const data = { keyMap: state.keyMap, sens: parseFloat(document.getElementById('sens-select').value) };
    state.gamepadSensitivity = data.sens;
    localStorage.setItem('dc_keybinds_v27', JSON.stringify(data));
    state.isPaused = false;
    document.getElementById('modal-keybinds').classList.add('hidden');
}

function checkGamepadInput() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    if (!gamepads[0]) return { moveX: 0, jump: false, attack: false, special: false };
    const gp = gamepads[0];
    let moveX = 0;
    if (gp.axes[0] < -0.3) moveX = -1 * state.gamepadSensitivity;
    if (gp.axes[0] > 0.3) moveX = 1 * state.gamepadSensitivity;
    return {
        moveX: moveX,
        jump: gp.buttons[0].pressed || gp.buttons[1].pressed,
        attack: gp.buttons[2].pressed,
        special: gp.buttons[3].pressed
    };
}

// 2. JOGADOR PRINCIPAL
const player = {
    x: 50, y: 300, width: 40, height: 50,
    vx: 0, vy: 0, speed: 5, jumpPower: -12, grounded: false,
    shieldActive: false, shieldTimer: 0, shieldRange: 35, shieldType: 'U',
    isCarriedAway: false,
    
    update() {
        if (state.isPaused || state.waitingForOtherPlayers) return;

        if (this.isCarriedAway) {
            this.y -= 3;
            if (this.y < -50) triggerStageCompletion();
            return;
        }

        const gpInput = checkGamepadInput();

        let moveX = 0;
        if (keys[state.keyMap.left]) moveX = -1;
        if (keys[state.keyMap.right]) moveX = 1;
        if (touchMoveX !== 0) moveX = touchMoveX;
        if (gpInput.moveX !== 0) moveX = gpInput.moveX;

        this.vx = moveX * this.speed;

        if ((keys[state.keyMap.jump] || touchJump || gpInput.jump) && this.grounded) {
            this.vy = this.jumpPower;
            this.grounded = false;
            touchJump = false;
        }

        if ((keys[state.keyMap.attack] || touchAttack || gpInput.attack) && !this.shieldActive) {
            this.activateShield('U'); touchAttack = false;
        }
        if ((keys[state.keyMap.special] || touchSpecial || gpInput.special) && !this.shieldActive) {
            this.activateShield('I'); touchSpecial = false;
        }

        this.vy += 0.6;
        this.x += this.vx;
        this.y += this.vy;

        const groundY = 380;
        if (this.y + this.height >= groundY) {
            this.y = groundY - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        if (this.x < 0) this.x = 0;
        
        // Chegou ao fim da fase
        if (this.x + this.width >= canvas.width && !activeBoss && enemies.length === 0) {
            triggerStageCompletion();
        }

        if (this.shieldTimer > 0) {
            this.shieldTimer--;
            if (this.shieldTimer <= 0) { this.shieldActive = false; this.shieldRange = 35; }
        }

        if (state.immunityTimer > 0) {
            state.immunityTimer--;
            if (state.immunityTimer <= 0) state.isImmune = false;
        }

        // Transmissão via Rede
        netChannel.postMessage({
            type: 'PLAYER_MOVE',
            user: currentUser,
            charId: selectedCharId,
            x: this.x,
            y: this.y,
            stage: state.stage,
            pinkShield: state.pinkShield
        });
    },

    activateShield(type) {
        this.shieldActive = true;
        this.shieldType = type;
        this.shieldTimer = 60;
        this.shieldRange = (superInsect && type === 'U') ? 180 : 35;

        if (type === 'I') {
            enemies.forEach(e => e.frozenTimer = 120);
            if (activeBoss) activeBoss.frozenTimer = 120;
        }
    },

    draw() {
        const charInfo = charactersData[selectedCharId];
        ctx.save();
        if (state.isImmune && Math.floor(Date.now() / 100) % 2 === 0) ctx.globalAlpha = 0.5;

        ctx.fillStyle = '#ffcc99'; ctx.fillRect(this.x + 10, this.y, 20, 15);
        ctx.fillStyle = state.pinkShield ? '#ff007f' : charInfo.color;
        ctx.fillRect(this.x + 5, this.y + 15, 30, 25);
        ctx.fillStyle = '#000'; ctx.fillRect(this.x + 5, this.y + 40, 10, 10); ctx.fillRect(this.x + 25, this.y + 40, 10, 10);

        ctx.fillStyle = '#fff'; ctx.font = '9px Courier'; ctx.fillText(currentUser, this.x - 5, this.y - 6);

        if (this.shieldActive) {
            ctx.strokeStyle = this.shieldType === 'U' ? '#00ffff' : '#ffff00';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(this.x + this.width/2, this.y + this.height/2, this.shieldRange, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    }
};

// Entidades do Jogo (Boss, Inimigos, Itens)
let activeBoss = null;
let projectiles = [];
let enemies = [];
let pinkButterflies = [];
let superInsect = null;

class PinkButterfly {
    constructor() { this.x = 800; this.y = 150 + Math.random() * 150; }
    update() { this.x -= 2; }
    draw() {
        ctx.fillStyle = '#ff1493'; ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '10px Courier'; ctx.fillText('🦋', this.x - 6, this.y + 4);
    }
}

class SuperInsect {
    constructor() { this.x = 800; this.y = 50; this.width = 120; this.height = 120; this.speed = 1.5; }
    update() { this.x -= this.speed; }
    draw() {
        ctx.fillStyle = '#8a2be2'; ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = '#fff'; ctx.font = '60px Courier'; ctx.fillText('🪲', this.x + 20, this.y + 80);
    }
}

class SemiBoss {
    constructor(stage) {
        this.x = 650; this.y = 280; this.width = 70; this.height = 70;
        this.stage = stage; this.hp = 5 + (stage / 5) * 3; this.maxHp = this.hp;
        this.attackTimer = 0; this.frozenTimer = 0;
        const types = {
            5: { name: 'Libélula Gigante', color: '#00e5ff', speed: 4, icon: '🛸' },
            10: { name: 'Besouro Blindado', color: '#795548', speed: 6, icon: '🪲' },
            15: { name: 'Vespa Flamejante', color: '#ffc107', speed: 8, icon: '🐝' },
            20: { name: 'Louva-a-Deus', color: '#4caf50', speed: 10, icon: '🦗' },
            25: { name: 'Rainha Inseto', color: '#e91e63', speed: 12, icon: '👑' }
        };
        this.info = types[stage] || types[5];
    }
    update() {
        if (this.frozenTimer > 0) { this.frozenTimer--; return; }
        this.attackTimer++;
        if (this.attackTimer >= Math.max(30, 120 - (this.stage * 3))) {
            this.attackTimer = 0;
            projectiles.push(new Projectile(this.x, 355, this.info.speed, this.info.color, this.info.icon));
        }
    }
    draw() {
        ctx.fillStyle = this.frozenTimer > 0 ? '#88ffff' : this.info.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = '#fff'; ctx.font = '28px Courier'; ctx.fillText(this.info.icon, this.x + 18, this.y + 45);
        ctx.fillStyle = '#ff0000'; ctx.fillRect(this.x, this.y - 15, (this.width * (this.hp / this.maxHp)), 6);
    }
}

class Projectile {
    constructor(x, y, speed, color, icon) { this.x = x; this.y = y; this.speed = speed; this.color = color; this.icon = icon; }
    update() { this.x -= this.speed; }
    draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x + 10, this.y + 10, 10, 0, Math.PI * 2); ctx.fill(); }
}

class Enemy {
    constructor(x, y, word) { this.x = x; this.y = y; this.width = 40; this.height = 40; this.word = word; this.speed = 2; this.frozenTimer = 0; }
    update() {
        if (this.frozenTimer > 0) { this.frozenTimer--; return; }
        this.x -= this.speed;
        if (this.x < -100) this.x = canvas.width + Math.random() * 200;
    }
    draw() {
        ctx.fillStyle = this.frozenTimer > 0 ? '#88ffff' : '#cc0000';
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.fillStyle = '#ffffff'; ctx.font = '10px Courier'; ctx.fillText(this.word, this.x - 5, this.y - 5);
    }
}

function initStage(stageNum) {
    state.stage = stageNum;
    state.waitingForOtherPlayers = false;
    enemies = []; projectiles = []; pinkButterflies = [];
    activeBoss = null; superInsect = null; player.isCarriedAway = false;
    player.x = 50; player.y = 300;
    
    if ([5, 10, 15, 20, 25].includes(stageNum)) {
        activeBoss = new SemiBoss(stageNum);
    } else {
        const words = ['ERRO', 'DUVIDA', 'IGNORANCIA', 'ATRASO'];
        for(let i = 0; i < 3 + Math.floor(stageNum / 2); i++) {
            enemies.push(new Enemy(600 + i * 250, 340, words[i % words.length]));
        }
    }
    document.getElementById('ui-stage').innerText = state.stage;
}

// 3. SINCRONIZAÇÃO DA SALA, PROGRESSÃO DE FASE E CHAT AO VIVO
netChannel.onmessage = (event) => {
    const data = event.data;
    if (data.type === 'PLAYER_MOVE' && data.user !== currentUser) {
        onlinePlayers[data.user] = {
            x: data.x, y: data.y, charId: data.charId, stage: data.stage,
            pinkShield: data.pinkShield, lastSeen: Date.now()
        };
    }
    if (data.type === 'CHAT_MSG') { appendChatMessage(data.user, data.text); }
    if (data.type === 'STAGE_READY') {
        onlinePlayers[data.user] = onlinePlayers[data.user] || {};
        onlinePlayers[data.user].readyForNextStage = true;
        checkAllPlayersReady();
    }
};

function appendChatMessage(user, text) {
    const chatMsgs = document.getElementById('chat-messages');
    chatMsgs.innerHTML += `<div><strong>${user}:</strong> ${text}</div>`;
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

document.getElementById('btn-send-chat').onclick = sendChatMessage;
document.getElementById('chat-input').onkeydown = (e) => { if(e.key === 'Enter') sendChatMessage(); };

function sendChatMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !currentUser) return;
    appendChatMessage(currentUser, text);
    netChannel.postMessage({ type: 'CHAT_MSG', user: currentUser, text: text });
    input.value = '';
}

function triggerStageCompletion() {
    if (state.waitingForOtherPlayers) return;
    state.waitingForOtherPlayers = true;
    netChannel.postMessage({ type: 'STAGE_READY', user: currentUser, stage: state.stage });
    checkAllPlayersReady();
}

function checkAllPlayersReady() {
    const now = Date.now();
    let activeUsers = Object.keys(onlinePlayers).filter(u => now - onlinePlayers[u].lastSeen < 4000);
    let totalInRoom = activeUsers.length + 1;
    
    document.getElementById('ui-players-count').innerText = Math.min(totalInRoom, 6);

    if (totalInRoom <= 1) {
        initStage(state.stage + 1);
        return;
    }

    let allReady = activeUsers.every(u => onlinePlayers[u].readyForNextStage && onlinePlayers[u].stage === state.stage);
    
    if (allReady && state.waitingForOtherPlayers) {
        Object.keys(onlinePlayers).forEach(u => { if(onlinePlayers[u]) onlinePlayers[u].readyForNextStage = false; });
        initStage(state.stage + 1);
    }
}

// 4. LOOP DO JOGO
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!state.isGameOver && !state.isPaused && currentUser) {
        player.update();
        player.draw();

        // Renderizar Outros Jogadores Online na Sala
        const now = Date.now();
        Object.keys(onlinePlayers).forEach(u => {
            const p = onlinePlayers[u];
            if (now - p.lastSeen < 4000 && p.stage === state.stage) {
                const cInfo = charactersData[p.charId || 0];
                ctx.save();
                ctx.fillStyle = '#ffcc99'; ctx.fillRect(p.x + 10, p.y, 20, 15);
                ctx.fillStyle = p.pinkShield ? '#ff007f' : cInfo.color;
                ctx.fillRect(p.x + 5, p.y + 15, 30, 25);
                ctx.fillStyle = '#000'; ctx.fillRect(p.x + 5, p.y + 40, 10, 10); ctx.fillRect(p.x + 25, p.y + 40, 10, 10);
                ctx.fillStyle = '#ffeb3b'; ctx.font = '9px Courier'; ctx.fillText(u, p.x - 5, p.y - 6);
                ctx.restore();
            }
        });

        // Spawn Borboleta Rosa
        if (state.score >= state.lastPinkButterflyScore + 10000) {
            state.lastPinkButterflyScore = Math.floor(state.score / 10000) * 10000;
            pinkButterflies.push(new PinkButterfly());
        }

        // Spawn Super Inseto Voador
        if (state.score >= state.lastSuperInsectScore + 25000) {
            state.lastSuperInsectScore = Math.floor(state.score / 25000) * 25000;
            superInsect = new SuperInsect();
        }

        pinkButterflies.forEach((bf, index) => {
            bf.update(); bf.draw();
            if (Math.abs(player.x - bf.x) < 30 && Math.abs(player.y - bf.y) < 30) {
                state.pinkShield = true;
                pinkButterflies.splice(index, 1);
            }
        });

        if (superInsect) {
            superInsect.update(); superInsect.draw();
            if (player.shieldActive && player.shieldType === 'U') {
                const dist = Math.hypot((player.x + 20) - (superInsect.x + 60), (player.y + 25) - (superInsect.y + 60));
                if (dist < player.shieldRange + 60) {
                    player.isCarriedAway = true;
                    player.x = superInsect.x + 40;
                    player.y = superInsect.y + 60;
                }
            }
        }

        if (activeBoss) {
            activeBoss.update(); activeBoss.draw();
            if (player.shieldActive && player.shieldType === 'U') {
                if (Math.abs(player.x - activeBoss.x) < 60 && Math.abs(player.y - activeBoss.y) < 60) {
                    activeBoss.hp -= 0.1;
                    if (activeBoss.hp <= 0) {
                        state.score += 1000;
                        activeBoss = null;
                        triggerStageCompletion();
                    }
                }
            }
        }

        projectiles.forEach((proj, pIndex) => {
            proj.update(); proj.draw();
            if (!state.isImmune && Math.abs(player.x - proj.x) < 25 && Math.abs(player.y - proj.y) < 25) {
                projectiles.splice(pIndex, 1);
                handlePlayerHit();
            }
        });

        // Inimigos + Mecânica de Pular na Cabeça
        enemies.forEach((enemy, index) => {
            enemy.update(); enemy.draw();

            const isFalling = player.vy > 0;
            const playerFeet = player.y + player.height;
            const enemyHead = enemy.y;

            if (isFalling && playerFeet >= enemyHead && playerFeet <= enemyHead + 15 && player.x + player.width > enemy.x && player.x < enemy.x + enemy.width) {
                enemies.splice(index, 1);
                player.vy = -8;
                state.score += 200;
                return;
            }

            if (!state.isImmune && Math.abs(player.x - enemy.x) < 28 && Math.abs(player.y - enemy.y) < 28) {
                handlePlayerHit();
            }
        });

        document.getElementById('ui-score').innerText = Math.floor(state.score);

        if (state.waitingForOtherPlayers) {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '14px Courier';
            ctx.fillText('FASE CONCLUÍDA! AGUARDANDO OS DEMAIS JOGADORES...', 40, 225);
        }
    }

    requestAnimationFrame(gameLoop);
}

function handlePlayerHit() {
    if (state.pinkShield) {
        state.pinkShield = false;
        state.isImmune = true;
        state.immunityTimer = 60;
        return;
    }
    
    state.lives--;
    updateLivesUI();
    if (state.lives <= 0) {
        state.isGameOver = true;
        document.getElementById('modal-gameover').classList.remove('hidden');
    } else {
        state.isImmune = true;
        state.immunityTimer = 120;
    }
}

function updateLivesUI() {
    let hearts = '';
    for(let i=0; i<state.lives; i++) hearts += '❤️';
    document.getElementById('ui-lives').innerText = hearts || '💀';
}

// Eventos e Controles
const keys = {};
let listeningRebind = null;

window.addEventListener('keydown', e => {
    if (listeningRebind) {
        state.keyMap[listeningRebind] = e.code;
        listeningRebind = null;
        updateKeybindButtonsUI();
        return;
    }
    keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let touchMoveX = 0, touchJump = false, touchAttack = false, touchSpecial = false;
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');

joystickZone.addEventListener('touchstart', handleJoystick);
joystickZone.addEventListener('touchmove', handleJoystick);
joystickZone.addEventListener('touchend', () => {
    joystickKnob.style.top = '20px'; joystickKnob.style.left = '20px'; touchMoveX = 0;
});

function handleJoystick(e) {
    e.preventDefault();
    const rect = joystickZone.getBoundingClientRect();
    const touch = e.touches[0];
    const x = touch.clientX - rect.left - 37;
    touchMoveX = Math.max(-1, Math.min(1, x / 25));
    joystickKnob.style.left = `${20 + touchMoveX * 15}px`;
}

document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); touchJump = true; });
document.getElementById('btn-attack').addEventListener('touchstart', (e) => { e.preventDefault(); touchAttack = true; });
document.getElementById('btn-special').addEventListener('touchstart', (e) => { e.preventDefault(); touchSpecial = true; });

function updateKeybindButtonsUI() {
    document.getElementById('rebind-left').innerText = `Esquerda: ${state.keyMap.left}`;
    document.getElementById('rebind-right').innerText = `Direita: ${state.keyMap.right}`;
    document.getElementById('rebind-jump').innerText = `Pulo: ${state.keyMap.jump}`;
    document.getElementById('rebind-attack').innerText = `Escudo U: ${state.keyMap.attack}`;
    document.getElementById('rebind-special').innerText = `Relógio I: ${state.keyMap.special}`;
}

['left','right','jump','attack','special'].forEach(action => {
    document.getElementById(`rebind-${action}`).onclick = () => {
        listeningRebind = action;
        document.getElementById(`rebind-${action}`).innerText = 'Pressione Tecla...';
    };
});

document.getElementById('btn-config').onclick = () => { state.isPaused = true; document.getElementById('modal-keybinds').classList.remove('hidden'); };
document.getElementById('btn-save-keybinds').onclick = saveSettings;
document.getElementById('btn-logout').onclick = () => location.reload();

document.getElementById('btn-restart').onclick = () => {
    state.lives = 3; state.score = 0; state.isGameOver = false;
    updateLivesUI();
    document.getElementById('modal-gameover').classList.add('hidden');
    initStage(1);
};

// Inicialização
loadSettings();
initAuthSystem();
gameLoop();

</script>
</body>
</html>
