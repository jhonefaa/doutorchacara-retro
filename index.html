<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doutor Chácara - Alfabetização Arcade Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    html, body {
      width: 100%; height: 100%; background-color: #0d0d11; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center; overflow: hidden; user-select: none;
    }
    
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center; background: #000;
    }
    #gameCanvas {
      background: #000; width: 100%; height: 100%; object-fit: contain; display: block;
    }

    /* CONTROLES VIRTUAIS TOUCH */
    .touch-controls {
      position: absolute; bottom: 20px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 30px; pointer-events: none; z-index: 5;
    }
    
    /* JOYSTICK ANALÓGICO 360° */
    #joystick-zone {
      width: 120px; height: 120px; background: rgba(255, 255, 255, 0.15);
      border: 2px solid #00ffcc; border-radius: 50%; position: relative;
      pointer-events: auto; touch-action: none;
    }
    #joystick-stick {
      width: 50px; height: 50px; background: #00ffcc; border-radius: 50%;
      position: absolute; top: 35px; left: 35px;
      box-shadow: 0 0 10px #00ffcc; pointer-events: none;
    }

    /* BOTÕES DE AÇÃO */
    .action-buttons { display: flex; gap: 15px; pointer-events: auto; }
    .btn-action {
      width: 65px; height: 65px; border-radius: 50%; font-size: 0.9rem; font-weight: bold;
      border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,255,255,0.3);
      display: flex; justify-content: center; align-items: center; color: #fff;
    }
    .btn-jump { background: #0088ff; }
    .btn-attack { background: #ff0055; }

    /* BOTÕES DE INTERAÇÃO */
    #btn-fullscreen {
      position: absolute; top: 15px; right: 15px; background: rgba(0, 255, 204, 0.2);
      border: 1px solid #00ffcc; color: #00ffcc; padding: 8px 15px; border-radius: 20px;
      font-size: 0.8rem; font-weight: bold; cursor: pointer; z-index: 10;
    }
    #btn-restart {
      position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
      background: #00ffcc; color: #000; font-size: 1.2rem; font-weight: bold;
      padding: 15px 30px; border-radius: 30px; border: none; cursor: pointer;
      box-shadow: 0 0 20px #00ffcc; display: none; z-index: 10;
    }
    #btn-start-stage {
      position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
      background: #00ffcc; color: #000; font-size: 1.3rem; font-weight: bold;
      padding: 15px 35px; border-radius: 30px; border: none; cursor: pointer;
      box-shadow: 0 0 20px #00ffcc; display: block; z-index: 10;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <button id="btn-fullscreen" onclick="toggleFullScreen()">TELA CHEIA ⛶</button>
    <button id="btn-start-stage" onclick="startStage()">INICIAR FASE ▶</button>
    <button id="btn-restart" onclick="resetGame()">JOGAR NOVAMENTE 🔄</button>
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="touch-controls">
      <div id="joystick-zone">
        <div id="joystick-stick"></div>
      </div>

      <div class="action-buttons">
        <div class="btn-action btn-jump" id="touch-jump">PULO</div>
        <div class="btn-action btn-attack" id="touch-attack">ATAQUE</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const btnRestart = document.getElementById("btn-restart");
    const btnStartStage = document.getElementById("btn-start-stage");

    // SINTETIZADOR DE ÁUDIO (Efeitos Sonoros)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'attack') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // SINTETIZADOR DE VOZ (Fala em Português)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Para falas anteriores
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    let currentStage = 1;
    const maxStages = 27;
    let score = 0;
    let gameOver = false;
    let stageStarted = false;
    let stageMissionText = "";
    let missionTimer = 180;
    let winMessage = "";
    let walkCycle = 0; // Para animação dos braços e pernas

    const praiseMessages = [
      "PARABÉNS! VOCÊ É SENSACIONAL!",
      "INCRÍVEL! EXCELENTE TRABALHO!",
      "MUITO BEM! VOCÊ ESTÁ MANDANDO SUPER BEM!",
      "FANTÁSTICO! RUMO AO PRÓXIMO DESAFIO!",
      "SENSACIONAL! SUA MENTE É AFINADA!"
    ];

    const player = {
      x: 50, y: 280, width: 40, height: 70,
      vx: 0, vy: 0, speed: 4.8, friction: 0.82,
      grounded: false, crouching: false, facing: 'right', aimingUp: false,
      attacking: false, attackTimer: 0, attackMaxTime: 12
    };

    const gravity = 0.65;
    const groundY = 370;
    const weapon = { x: 0, y: 0, length: 0, maxLength: 150 };

    const stageRules = {
      1: {
        title: "FASE 1: LETRAS MINÚSCULAS",
        instruction: "ATENÇÃO: Destrua APENAS as letras MINÚSCULAS (a-f)!",
        isValid: (char) => char === char.toLowerCase() && isNaN(char),
        generateChar: () => ['A','B','C','D','E','F','a','b','c','d','e','f'][Math.floor(Math.random() * 12)]
      },
      2: {
        title: "FASE 2: NÚMEROS PARES",
        instruction: "ATENÇÃO: Destrua APENAS os NÚMEROS PARES!",
        isValid: (char) => !isNaN(char) && parseInt(char) % 2 === 0,
        generateChar: () => ['1','2','3','4','5','6','7','8','9'][Math.floor(Math.random() * 9)]
      }
    };

    function getRuleForStage(stage) {
      if (stageRules[stage]) return stageRules[stage];
      return {
        title: `FASE ${stage}: DESAFIO DE VOGAIS`,
        instruction: "ATENÇÃO: Destrua APENAS as VOGAIS!",
        isValid: (char) => ['A','E','I','O','U'].includes(char.toUpperCase()),
        generateChar: () => ['A','B','E','F','I','K','O','P','U'][Math.floor(Math.random() * 9)]
      };
    }

    const enemies = [];
    function prepareStage() {
      enemies.length = 0;
      const currentRule = getRuleForStage(currentStage);
      missionTimer = 180;
      stageMissionText = currentRule.instruction;
      stageStarted = false;
      btnStartStage.style.display = "block";

      const count = 4 + Math.floor(currentStage * 0.5);
      for (let i = 0; i < count; i++) {
        const charSymbol = currentRule.generateChar();
        enemies.push({
          x: 450 + i * 150 + Math.random() * 30,
          y: groundY - 40, width: 40, height: 40,
          speed: 1.5 + (currentStage * 0.1), alive: true,
          symbol: charSymbol, isTarget: currentRule.isValid(charSymbol),
          dir: -1
        });
      }
    }

    function startStage() {
      stageStarted = true;
      btnStartStage.style.display = "none";
      const currentRule = getRuleForStage(currentStage);
      speakText(`${currentRule.title}. ${currentRule.instruction}`);
    }

    prepareStage();

    // JOYSTICK ANALÓGICO VIRTUAL 360°
    const joyZone = document.getElementById("joystick-zone");
    const joyStick = document.getElementById("joystick-stick");
    let joyActive = false;
    let joyVector = { x: 0, y: 0 };

    joyZone.addEventListener("pointerdown", (e) => { joyActive = true; updateJoystick(e); });
    window.addEventListener("pointermove", (e) => { if (joyActive) updateJoystick(e); });
    window.addEventListener("pointerup", () => {
      joyActive = false; joyVector = { x: 0, y: 0 };
      joyStick.style.top = "35px"; joyStick.style.left = "35px";
    });

    function updateJoystick(e) {
      const rect = joyZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = e.clientX - centerX;
      let dy = e.clientY - centerY;
      const dist = Math.hypot(dx, dy);
      const maxDist = 40;

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      joyStick.style.left = `${35 + dx}px`;
      joyStick.style.top = `${35 + dy}px`;

      joyVector.x = dx / maxDist;
      joyVector.y = dy / maxDist;
    }

    // BOTÕES DE AÇÃO
    document.getElementById("touch-jump").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (player.grounded && stageStarted) { player.vy = -12.5; player.grounded = false; }
    });

    document.getElementById("touch-attack").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (!player.attacking && stageStarted) {
        player.attacking = true; player.attackTimer = player.attackMaxTime;
        playSound('attack');
      }
    });

    function resetGame() {
      gameOver = false; score = 0; currentStage = 1;
      player.x = 50; player.y = 280; player.vx = 0; player.vy = 0;
      btnRestart.style.display = "none";
      prepareStage();
    }

    const keys = {};
    window.addEventListener("keydown", (e) => { keys[e.code] = true; });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    function update() {
      if (gameOver) { btnRestart.style.display = "block"; return; }
      if (!stageStarted) return; // Não atualiza lógica do jogo antes de pressionar Iniciar

      if (missionTimer > 0) missionTimer--;

      // Leitura Direcional (Joystick 360° + Teclado)
      const moveX = joyVector.x || (keys["ArrowRight"] ? 1 : keys["ArrowLeft"] ? -1 : 0);
      const moveY = joyVector.y || (keys["ArrowDown"] ? 1 : keys["ArrowUp"] ? -1 : 0);

      player.aimingUp = moveY < -0.4;
      player.crouching = moveY > 0.4 && player.grounded;

      if (Math.abs(moveX) > 0.2 && !player.crouching) {
        player.vx = moveX * player.speed;
        player.facing = moveX > 0 ? 'right' : 'left';
        walkCycle += 0.2; // Avança o ciclo de caminhada para os braços
      } else {
        walkCycle = 0;
      }

      if (keys["Space"] && player.grounded) {
        player.vy = -12.5; player.grounded = false;
      }

      if ((keys["KeyZ"] || keys["KeyX"]) && !player.attacking) {
        player.attacking = true; player.attackTimer = player.attackMaxTime;
        playSound('attack');
      }

      player.vx *= player.friction; player.x += player.vx;
      player.vy += gravity; player.y += player.vy;

      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height; player.vy = 0; player.grounded = true;
      }

      if (player.x < 0) player.x = 0;

      // Mudança de Fase com Efeito de Parabenização e Áudio
      if (player.x + player.width >= canvas.width) {
        if (currentStage < maxStages) {
          currentStage++; player.x = 20;
          winMessage = praiseMessages[Math.floor(Math.random() * praiseMessages.length)];
          playSound('win');
          speakText(winMessage);
          prepareStage();
        } else {
          speakText("Parabéns! Você completou todas as fases!");
          alert("PARABÉNS! VOCÊ COMPLETOU TODAS AS FASES!");
          resetGame();
        }
      }

      // Ataque Diskarmor
      if (player.attacking) {
        player.attackTimer--;
        const progress = 1 - (player.attackTimer / player.attackMaxTime);
        weapon.length = Math.sin(progress * Math.PI) * weapon.maxLength;

        if (player.aimingUp) {
          weapon.x = player.x + player.width / 2; weapon.y = player.y - weapon.length;
        } else if (player.crouching) {
          weapon.y = player.y + player.height - 15;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        } else {
          weapon.y = player.y + 25;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        }

        if (player.attackTimer <= 0) player.attacking = false;
      }

      // Inimigos Rota Contínua e Punição se Destruir Errado
      enemies.forEach(enemy => {
        if (!enemy.alive) return;

        enemy.x += enemy.speed * enemy.dir;
        if (enemy.x < -50) enemy.x = canvas.width + 50;

        if (player.attacking) {
          const hit = (enemy.x < weapon.x + 25 && enemy.x + enemy.width > weapon.x - 25 &&
                       enemy.y < weapon.y + 25 && enemy.y + enemy.height > weapon.y - 25);
          if (hit) {
            enemy.alive = false;
            if (enemy.isTarget) {
              score += 500;
            } else {
              // PERDE A FASE SE DESTRUIR ALGO QUE NÃO FOI SOLICITADO
              playSound('hit');
              gameOver = true;
              speakText("Atenção! Você destruiu o elemento incorreto e perdeu a fase.");
            }
          }
        }

        if (enemy.alive &&
            player.x < enemy.x + enemy.width && player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
          playSound('hit');
          gameOver = true;
        }
      });
    }

    function drawDrChacara(x, y, facing, crouching) {
      ctx.save();
      ctx.translate(x + player.width / 2, y);
      if (facing === 'left') ctx.scale(-1, 1);

      const h = crouching ? 45 : 70;
      
      // Pernas
      ctx.fillStyle = "#1a1a24"; ctx.fillRect(-10, h - 25, 8, 25); ctx.fillRect(2, h - 25, 8, 25);
      
      // Tronco
      ctx.fillStyle = "#0066cc"; ctx.fillRect(-10, crouching ? 15 : 20, 20, 25);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(-14, crouching ? 10 : 18, 28, crouching ? 25 : 35);
      
      // Cabeça
      ctx.fillStyle = "#f3c099"; ctx.fillRect(-9, 0, 18, 18);
      ctx.fillStyle = "#111111"; ctx.fillRect(-10, -1, 20, 5);
      ctx.fillStyle = "#5A5A66"; ctx.fillRect(-11, -7, 22, 7);
      ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5; ctx.strokeRect(1, 4, 7, 5);

      // Braços Dinâmicos (Animação ao andar)
      ctx.fillStyle = "#f3c099";
      const armAngle = Math.sin(walkCycle) * 12;
      
      // Braço Traseiro
      ctx.save();
      ctx.translate(-12, crouching ? 20 : 25);
      ctx.rotate((-armAngle * Math.PI) / 180);
      ctx.fillRect(-3, 0, 6, 18);
      ctx.restore();

      // Braço Dianteiro
      ctx.save();
      ctx.translate(12, crouching ? 20 : 25);
      ctx.rotate((armAngle * Math.PI) / 180);
      ctx.fillRect(-3, 0, 6, 18);
      ctx.restore();

      ctx.restore();
    }

    function draw() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#120826"); grad.addColorStop(0.6, "#7a223b"); grad.addColorStop(1, "#2e1200");
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff3300"; ctx.beginPath(); ctx.arc(680, 140, 48, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#26150d"; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.fillStyle = "#00ffcc"; ctx.fillRect(0, groundY, canvas.width, 3);

      drawDrChacara(player.x, player.y, player.facing, player.crouching);

      if (player.attacking) {
        ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 5; ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y + 25); ctx.lineTo(weapon.x, weapon.y); ctx.stroke();
        ctx.fillStyle = "#00ffcc"; ctx.beginPath(); ctx.arc(weapon.x, weapon.y, 12, 0, Math.PI * 2); ctx.fill();
      }

      enemies.forEach(enemy => {
        if (enemy.alive) {
          ctx.fillStyle = "#1a1a2e"; ctx.strokeStyle = enemy.isTarget ? "#00ffcc" : "#ff0055"; ctx.lineWidth = 3;
          ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
          ctx.strokeRect(enemy.x, enemy.y, enemy.width, enemy.height);
          ctx.fillStyle = "#ffffff"; ctx.font = "bold 24px 'Segoe UI'"; ctx.textAlign = "center";
          ctx.fillText(enemy.symbol, enemy.x + enemy.width / 2, enemy.y + 28);
        }
      });

      const currentRule = getRuleForStage(currentStage);
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "left";
      ctx.fillText(`${currentRule.title}`, 20, 30);
      ctx.fillText(`PONTOS: ${score}`, 650, 30);

      // MENSAGEM DE MISSÃO E PARABENIZAÇÃO
      if (missionTimer > 0 || !stageStarted) {
        ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(50, 130, 700, 120);
        ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 2; ctx.strokeRect(50, 130, 700, 120);
        
        if (winMessage && missionTimer > 100) {
          ctx.fillStyle = "#ffcc00"; ctx.font = "bold 22px 'Segoe UI'"; ctx.textAlign = "center";
          ctx.fillText(winMessage, canvas.width / 2, 170);
        } else {
          ctx.fillStyle = "#00ffcc"; ctx.font = "bold 20px 'Segoe UI'"; ctx.textAlign = "center";
          ctx.fillText(currentRule.title, canvas.width / 2, 170);
        }

        ctx.fillStyle = "#fff"; ctx.font = "16px 'Segoe UI'"; ctx.textAlign = "center";
        ctx.fillText(stageMissionText, canvas.width / 2, 210);
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff0055"; ctx.font = "bold 36px 'Segoe UI'"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
