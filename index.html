<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doutor Chácara - Pragas da Chácara v3.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    html, body {
      width: 100vw; height: 100vh; background-color: #000; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center; overflow: hidden; user-select: none;
    }
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000;
    }
    #gameCanvas { background: #000; width: 100vw; height: 100vh; object-fit: fill; display: block; }
    .touch-controls {
      position: absolute; bottom: 65px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 30px; pointer-events: none; z-index: 5;
    }
    #joystick-zone {
      width: 120px; height: 120px; background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 50%; position: relative;
      pointer-events: auto; touch-action: none;
    }
    #joystick-stick {
      width: 50px; height: 50px; background: rgba(0, 255, 204, 0.4); border-radius: 50%;
      position: absolute; top: 35px; left: 35px; box-shadow: 0 0 8px rgba(0, 255, 204, 0.5); pointer-events: none;
    }
    .action-buttons { display: flex; gap: 10px; pointer-events: auto; }
    .btn-action {
      width: 60px; height: 60px; border-radius: 50%; font-size: 0.75rem; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 0 8px rgba(255,255,255,0.2);
      display: flex; justify-content: center; align-items: center; color: #fff; opacity: 0.75; cursor: pointer;
    }
    .btn-jump { background: rgba(0, 136, 255, 0.4); }
    .btn-attack { background: rgba(255, 0, 85, 0.4); }
    .btn-shield { background: rgba(255, 140, 0, 0.4); border-color: rgba(255, 140, 0, 0.6); }
    #top-left-controls { position: absolute; top: 15px; left: 15px; display: flex; gap: 8px; z-index: 10; }
    #btn-fullscreen {
      position: absolute; top: 15px; right: 15px; background: rgba(0, 255, 204, 0.08);
      border: 1px solid rgba(0, 255, 204, 0.3); color: #00ffcc; padding: 6px 12px; border-radius: 20px;
      font-size: 0.75rem; font-weight: bold; cursor: pointer; z-index: 10; backdrop-filter: blur(4px);
    }
    .btn-top-bar {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer;
      backdrop-filter: blur(4px); font-weight: bold;
    }
    .bottom-bar {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(10, 10, 18, 0.25); backdrop-filter: blur(5px);
      padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(0, 255, 204, 0.25); z-index: 15; max-width: 95vw; overflow-x: auto;
    }
    .btn-tool {
      background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; gap: 5px; white-space: nowrap; transition: all 0.2s ease;
    }
    .overlay-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 10, 18, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 204, 0.4);
      border-radius: 20px; padding: 20px; box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
      z-index: 2000; display: none; flex-direction: column; align-items: center; gap: 12px;
      width: 90%; max-width: 480px; color: #fff;
    }
    .btn-main {
      background: rgba(0, 255, 204, 0.65); color: #000; font-size: 0.95rem; font-weight: bold;
      padding: 8px 20px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.4); cursor: pointer;
      width: 100%; max-width: 320px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="top-left-controls">
      <button class="btn-top-bar" onclick="skipIntro()">⏭️ PULAR INTRO</button>
    </div>
    <button id="btn-fullscreen" onclick="toggleFullScreen()">TELA CHEIA ⛶</button>
    <canvas id="gameCanvas"></canvas>

    <div class="bottom-bar">
      <button class="btn-tool" onclick="openYoutubeChannel()">🔴 YouTube</button>
      <button class="btn-tool" id="btn-toggle-music" onclick="toggleMusic()">🎵 Música: ON</button>
      <button class="btn-tool" id="btn-toggle-voice" onclick="toggleVoice()">🔊 Voz: ON</button>
    </div>

    <!-- INICIAR FASE -->
    <div id="panel-stage-start" class="overlay-panel">
      <h2 id="stage-title">FASE 1</h2>
      <p id="stage-instruction">Elimine os insetos da chácara!</p>
      <div id="stage-score-info"></div>
      <button class="btn-main" id="btn-start-action">INICIAR FASE ▶</button>
    </div>

    <!-- PAINEL YOUTUBE / TRANSIÇÃO -->
    <div id="panel-youtube-promo" class="overlay-panel">
      <h2>FASE CONCLUÍDA! 🎉</h2>
      <p>Apoie o canal do Doutor Chácara para continuar:</p>
      <button class="btn-main" onclick="handleYtAnswer('continuar')">▶ CONTINUAR JOGO</button>
    </div>

    <!-- GAME OVER -->
    <div id="panel-game-over" class="overlay-panel">
      <h2 style="color: #ff0055;">GAME OVER</h2>
      <p id="game-over-reason">Você perdeu!</p>
      <button class="btn-main" onclick="resetGame()">TENTAR NOVAMENTE 🔄</button>
    </div>

    <div class="touch-controls">
      <div id="joystick-zone"><div id="joystick-stick"></div></div>
      <div class="action-buttons">
        <div class="btn-action btn-jump" id="touch-jump">PULO</div>
        <div class="btn-action btn-attack" id="touch-attack">ESCUDO</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const panelStageStart = document.getElementById("panel-stage-start");
    const panelGameOver = document.getElementById("panel-game-over");
    const panelYtPromo = document.getElementById("panel-youtube-promo");
    const stageTitle = document.getElementById("stage-title");
    const stageInstruction = document.getElementById("stage-instruction");
    const stageScoreInfo = document.getElementById("stage-score-info");
    const btnStartAction = document.getElementById("btn-start-action");

    let isMusicEnabled = true;
    let isVoiceEnabled = true;

    // DEFINIÇÃO DOS INSETOS DA CHÁCARA
    const INSECT_TYPES = [
      { name: "Formiga", emoji: "🐜", size: 35 },
      { name: "Aranha", emoji: "🕷️", size: 40 },
      { name: "Gafanhoto", emoji: "🦗", size: 42 },
      { name: "Besouro", emoji: "🪲", size: 38 },
      { name: "Mosquito", emoji: "🦟", size: 30 },
      { name: "Lagarta", emoji: "🐛", size: 45 },
      { name: "Vespa", emoji: "🐝", size: 36 },
      { name: "Cupim", emoji: "🦟", size: 32 },
      { name: "Percevejo", emoji: "🪳", size: 36 },
      { name: "Barata", emoji: "🪳", size: 40 }
    ];

    function getInsectsForStage(stage) {
      if (stage === 26) return INSECT_TYPES; // FASE 26: TODOS OS INSETOS
      const count = Math.min(2 + Math.floor(stage / 2), INSECT_TYPES.length);
      return INSECT_TYPES.slice(0, count);
    }

    // AUDIO SYNTHESIZER (SEM DIREITOS AUTORAIS)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let bgMusicTimer = null;
    let currentMusicType = 'normal'; // 'normal', 'suspense'

    function playNote(freq, type, duration, vol=0.1) {
      if (!isMusicEnabled || audioCtx.state === 'suspended') return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function startBackgroundMusic(type = 'normal') {
      stopBackgroundMusic();
      currentMusicType = type;
      if (!isMusicEnabled) return;

      let step = 0;
      bgMusicTimer = setInterval(() => {
        if (!stageStarted || gameOver) return;
        if (currentMusicType === 'suspense') {
          // TRILHA DE SUSPENSE PARA O SEMI-MESTRE (MEDO)
          const suspenseNotes = [110, 116.54, 110, 103.83]; // A2, A#2, A2, G#2
          playNote(suspenseNotes[step % suspenseNotes.length], 'sawtooth', 0.5, 0.25);
        } else {
          // TRILHA NORMAL DA CHÁCARA
          const normalNotes = [261.63, 329.63, 392.00, 523.25];
          playNote(normalNotes[step % normalNotes.length], 'sine', 0.3, 0.08);
        }
        step++;
      }, currentMusicType === 'suspense' ? 250 : 350);
    }

    function stopBackgroundMusic() {
      if (bgMusicTimer) { clearInterval(bgMusicTimer); bgMusicTimer = null; }
    }

    function playVictoryMusic() {
      stopBackgroundMusic();
      if (!isMusicEnabled) return;
      // MUSICA DE ALEGRIA ALTA
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        setTimeout(() => playNote(freq, 'triangle', 0.4, 0.3), i * 150);
      });
    }

    let currentStage = 1;
    const maxStages = 26;
    let score = 0;
    let gameOver = false;
    let stageStarted = false;
    let playerLives = 3;

    function getGroundY() { return canvas.height - 80; }

    const player = {
      x: 50, y: 280, width: 33, height: 71.5,
      vx: 0, vy: 0, speed: 4.5, friction: 0.82,
      grounded: false, facing: 'right', attacking: false
    };

    let enemies = [];
    let bossEnemy = null;
    let bossActive = false;

    function closeAllPanels() {
      panelStageStart.style.display = "none";
      panelGameOver.style.display = "none";
      panelYtPromo.style.display = "none";
    }

    function prepareStage() {
      enemies = [];
      bossEnemy = null;
      bossActive = false;
      closeAllPanels();

      const groundY = getGroundY();
      const availableInsects = getInsectsForStage(currentStage);

      // FASE DO SEMI-MESTRE (A CADA 5 FASES)
      if (currentStage % 5 === 0) {
        bossActive = true;
        const bossInsect = availableInsects[Math.floor(Math.random() * availableInsects.length)];
        
        // TAMANHO 4 VEZES MAIOR QUE O JOGADOR
        const bossW = player.width * 4;
        const bossH = player.height * 4;

        bossEnemy = {
          x: canvas.width - bossW - 50,
          y: groundY - bossH,
          width: bossW,
          height: bossH,
          insect: bossInsect,
          hp: 10,
          alive: true
        };

        stageTitle.innerText = `FASE ${currentStage}: SEMI-MESTRE ${bossInsect.name.toUpperCase()} GIGANTE!`;
        stageInstruction.innerText = "Cuidado! Encare o inseto gigante da chácara!";
        startBackgroundMusic('suspense');
      } else {
        stageTitle.innerText = `FASE ${currentStage}: PRAGAS DA CHÁCARA`;
        stageInstruction.innerText = "Limpe a chácara eliminando todos os insetos!";
        
        const count = 4 + currentStage;
        for (let i = 0; i < count; i++) {
          const ins = availableInsects[i % availableInsects.length];
          enemies.push({
            x: 350 + i * 120,
            y: groundY - ins.size,
            width: ins.size,
            height: ins.size,
            insect: ins,
            speed: 1.2 + (currentStage * 0.1),
            dir: -1,
            alive: true
          });
        }
        startBackgroundMusic('normal');
      }

      stageScoreInfo.innerHTML = `Pontos: <strong>${score}</strong> | Vidas: <strong>❤️ x${playerLives}</strong>`;
      panelStageStart.style.display = "flex";
    }

    function startStage() {
      closeAllPanels();
      stageStarted = true;
    }

    btnStartAction.addEventListener("click", startStage);

    function update() {
      if (!stageStarted || gameOver) return;

      const groundY = getGroundY();

      // MOVIMENTAÇÃO DO JOGADOR
      player.vx *= player.friction;
      player.x += player.vx;
      player.vy += 0.65;
      player.y += player.vy;

      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height;
        player.vy = 0;
        player.grounded = true;
      }

      // COLISÃO COM INIMIGOS COMUNS
      enemies.forEach(enemy => {
        if (!enemy.alive) return;
        enemy.x += enemy.speed * enemy.dir;
        if (enemy.x < 100 || enemy.x > canvas.width - 50) enemy.dir *= -1;

        // ATAQUE DO JOGADOR
        if (player.attacking && Math.abs(player.x - enemy.x) < 50) {
          enemy.alive = false;
          score += 100;
        }

        // DANO AO JOGADOR
        if (Math.abs(player.x - enemy.x) < 30 && Math.abs(player.y - enemy.y) < 30) {
          playerLives--;
          if (playerLives <= 0) {
            gameOver = true;
            panelGameOver.style.display = "flex";
          } else {
            player.x = 50;
          }
        }
      });

      // CONCLUIR FASE COMUM
      if (!bossActive && enemies.every(e => !e.alive)) {
        stageStarted = false;
        playVictoryMusic();
        panelYtPromo.style.display = "flex";
      }

      // COMBATE SEMI-MESTRE
      if (bossActive && bossEnemy && bossEnemy.alive) {
        if (player.attacking && Math.abs(player.x - bossEnemy.x) < 100) {
          bossEnemy.hp--;
          player.attacking = false;
          if (bossEnemy.hp <= 0) {
            bossEnemy.alive = false;
            score += 1000;
            playVictoryMusic();
            stageStarted = false;
            panelYtPromo.style.display = "flex";
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const groundY = getGroundY();

      // CHÃO DA CHÁCARA
      ctx.fillStyle = "#5C2E0B";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // JOGADOR
      ctx.fillStyle = "#00ffcc";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // ESCUDO / ATAQUE
      if (player.attacking) {
        ctx.fillStyle = "#ff0055";
        ctx.fillRect(player.x + (player.facing === 'right' ? player.width : -20), player.y + 20, 20, 20);
      }

      // DESENHAR INSECTOS COMUNS
      enemies.forEach(enemy => {
        if (!enemy.alive) return;
        ctx.font = `${enemy.height}px sans-serif`;
        ctx.fillText(enemy.insect.emoji, enemy.x, enemy.y + enemy.height);
      });

      // DESENHAR SEMI-MESTRE GIGANTE
      if (bossActive && bossEnemy && bossEnemy.alive) {
        ctx.font = `${bossEnemy.height}px sans-serif`;
        ctx.fillText(bossEnemy.insect.emoji, bossEnemy.x, bossEnemy.y + bossEnemy.height);
        
        // BARRA DE VIDA DO SEMI-MESTRE
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(bossEnemy.x, bossEnemy.y - 20, bossEnemy.width, 10);
        ctx.fillStyle = "#00ff00";
        ctx.fillRect(bossEnemy.x, bossEnemy.y - 20, (bossEnemy.width * (bossEnemy.hp / 10)), 10);
      }
    }

    function handleYtAnswer(action) {
      currentStage++;
      if (currentStage > maxStages) currentStage = 1;
      prepareStage();
    }

    function resetGame() {
      score = 0; playerLives = 3; currentStage = 1;
      prepareStage();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    
    // JOYSTICK E TECLAS
    window.addEventListener("keydown", (e) => {
      if (e.code === "KeyD") { player.vx = player.speed; player.facing = 'right'; }
      if (e.code === "KeyA") { player.vx = -player.speed; player.facing = 'left'; }
      if (e.code === "Space" && player.grounded) { player.vy = -12; player.grounded = false; }
      if (e.code === "KeyU") { player.attacking = true; setTimeout(() => player.attacking = false, 200); }
    });

    prepareStage();
    loop();
  </script>
</body>
</html>
