<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doutor Chácara - Arcade Multiplayer v3.0</title>
    <!-- PeerJS para Conexão Multiplayer Online P2P em Tempo Real -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #111; font-family: 'Courier New', Courier, monospace; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 56.25vw; 
            max-width: 800px; 
            max-height: 450px; 
            background: #000; 
            overflow: hidden; 
            border: 2px solid #fff; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2); 
        }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        .ui-panel { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; text-shadow: 2px 2px #000; z-index: 10; pointer-events: none; }
        .btn-ui { background: #333; color: #fff; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; pointer-events: auto; font-family: inherit; font-size: 11px; }
        .btn-ui:active { background: #555; }
        
        #touch-controls { position: absolute; bottom: 8px; left: 10px; right: 10px; height: 90px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .joystick-zone { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; position: relative; }
        .joystick-knob { width: 32px; height: 32px; background: rgba(255,255,255,0.8); border-radius: 50%; position: absolute; top: 22px; left: 22px; }
        .action-buttons { display: flex; gap: 8px; }
        .btn-action { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; font-weight: bold; font-size: 11px; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px #000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 0 #000; }
        #btn-jump { background: #2196F3; }
        #btn-attack { background: #4CAF50; }
        #btn-special { background: #FF9800; }

        /* Modais */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; padding: 10px; text-align: center; box-sizing: border-box; }
        .hidden { display: none !important; }
        .modal input, .modal select { padding: 6px; font-size: 12px; text-align: center; margin: 4px 0; font-family: inherit; width: 80%; max-width: 250px; }
        .modal button { padding: 6px 12px; font-size: 11px; cursor: pointer; background: #fff; color: #000; border: none; font-weight: bold; margin-top: 6px; }
        
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 90%; max-height: 55%; overflow-y: auto; margin-bottom: 8px; width: 100%; }
        .config-grid button, .config-grid select { width: 100%; font-size: 10px; padding: 6px; }

        /* Chat Overlay */
        #chat-box { position: absolute; bottom: 100px; left: 10px; width: 220px; height: 120px; background: rgba(0,0,0,0.6); border: 1px solid #4caf50; display: flex; flex-direction: column; z-index: 15; font-size: 10px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 4px; text-align: left; }
        #chat-input-container { display: flex; }
        #chat-input { flex: 1; background: #111; color: #fff; border: none; padding: 4px; font-size: 10px; }
        #chat-send { background: #4caf50; border: none; color: white; padding: 4px 8px; cursor: pointer; }

        /* Banner YouTube */
        .yt-banner { color: #ff0000; font-weight: bold; margin-bottom: 8px; text-decoration: none; border: 1px solid red; padding: 6px; border-radius: 4px; background: rgba(255,0,0,0.1); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="ui-panel">
        <div>
            <div>FASE: <span id="ui-stage">1</span> | PONTOS: <span id="ui-score">0</span> | SALA: <span id="ui-room">1</span></div>
            <div>VIDAS: <span id="ui-lives">❤️❤️❤️</span> | JOGADORES NA SALA: <span id="ui-players-count">1/6</span></div>
        </div>
        <div>
            <button class="btn-ui" id="btn-config">⚙️ CONTROLES / OPÇÕES</button>
        </div>
    </div>

    <!-- Chat ao Vivo -->
    <div id="chat-box">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Mensagem ao vivo..." maxlength="50">
            <button id="chat-send">▶</button>
        </div>
    </div>

    <div id="touch-controls">
        <div class="joystick-zone" id="joystick-zone">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <div class="btn-action" id="btn-attack">ESC.U</div>
            <div class="btn-action" id="btn-special">REL.I</div>
            <div class="btn-action" id="btn-jump">PULO</div>
        </div>
    </div>

    <!-- Modal de Login / Cadastro Initial -->
    <div id="modal-auth" class="modal">
        <h2 style="color: #ffeb3b; margin-bottom: 4px;">DOUTOR CHÁCARA</h2>
        <a href="https://www.youtube me.com" target="_blank" class="yt-banner">📺 Inscreva-se no Canal Doutor Chácara!</a>
        <p style="font-size:11px; margin-bottom:8px;">Cadastre-se ou Entre para jogar Multiplayer (Máx 6/Sala)</p>
        <input type="text" id="auth-username" placeholder="Nome do Jogador">
        <input type="password" id="auth-password" placeholder="Senha de Acesso">
        <button id="btn-login" style="background:#4CAF50; color:white;">ENTRAR / CADASTRAR E JOGAR</button>
    </div>

    <!-- Modal de Configurações do Controle / Joystick -->
    <div id="modal-keybinds" class="modal hidden">
        <h3 style="margin-bottom: 5px; color: #4CAF50;">CONFIGURAÇÃO DE CONTROLES</h3>
        <div class="config-grid">
            <button id="rebind-left">Esquerda: A</button>
            <button id="rebind-right">Direita: D</button>
            <button id="rebind-up">Cima: W</button>
            <button id="rebind-down">Baixo: S</button>
            <button id="rebind-jump">Pulo: U</button>
            <button id="rebind-salto">Salto: O</button>
            <button id="rebind-attack">Escudo U: U</button>
            <button id="rebind-special">Especial: I</button>

            <select id="gamepad-select">
                <option value="0">Joystick / Gamepad: Padrão</option>
                <option value="1">Gamepad Detectado</option>
            </select>
            
            <select id="sens-select">
                <option value="1">Sensibilidade Joystick: Normal</option>
                <option value="1.5">Sensibilidade Joystick: Alta</option>
            </select>
        </div>
        <button id="btn-save-keybinds" style="background: #4CAF50; color: white;">SALVAR E CONTINUAR JOGO</button>
    </div>

    <div id="modal-gameover" class="modal hidden">
        <h1 id="go-title">GAME OVER</h1>
        <p id="go-message">Aguardando a equipe...</p>
        <button id="btn-restart">REINICIAR FASE</button>
    </div>
</div>

<script>
/**
 * DOUTOR CHÁCARA - ARCADE MULTIPLAYER v3.0
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Carregamento de Recursos Visuais e Áudio (Livres de Direitos Autorais)
const bgEven = new Image();
bgEven.src = 'fundo.jpg.jpg'; // Imagem enviada para Fases Pares

const bgRetro = new Image();
bgRetro.src = 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80'; // Fundo Retro Livre

const bgModern = new Image();
bgModern.src = 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80'; // Fundo Moderno Livre

// Músicas Livres de Direitos Autorais
const bgMusicList = [
    'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3', // Synthwave / Retro
    'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3'  // 8-Bit Chiptune
];
let audioPlayer = new Audio();
audioPlayer.loop = true;
audioPlayer.volume = 0.3;

function playMusicForStage(stage) {
    const track = bgMusicList[stage % bgMusicList.length];
    if (audioPlayer.src !== track) {
        audioPlayer.src = track;
        audioPlayer.play().catch(() => {});
    }
}

// Mapeamento dos 6 Personagens da Família Doutor Chácara
const CHARACTER_TYPES = [
    { id: 0, name: 'Doutor Chácara', color: '#003366' },
    { id: 1, name: 'Pai do Doutor Chácara', color: '#8A2BE2' }, // Violeta
    { id: 2, name: 'Irmã do Doutor Chácara', color: '#FF69B4' }, // Rosa
    { id: 3, name: 'Filho do Doutor Chácara', color: '#00E5FF' }, // Azul Claro
    { id: 4, name: 'Filha do Doutor Chácara', color: '#FFD700' }, // Dourado
    { id: 5, name: 'Tio do Doutor Chácara', color: '#2E8B57' }   // Verde Esmeralda
];

const state = {
    myPlayerId: 0,
    username: '',
    roomCode: 'dc_room_1',
    score: 0,
    lives: 3,
    stage: 1,
    isGameOver: false,
    isPaused: false,
    players: {},
    keyMap: {
        left: 'KeyA',
        right: 'KeyD',
        up: 'KeyW',
        down: 'KeyS',
        jump: 'KeyU',
        salto: 'KeyO',
        attack: 'KeyU',
        special: 'KeyI'
    }
};

// Configuração do PeerJS para Multiplayer Online Real
let peer = null;
let connections = {};
let isHost = false;

function initMultiplayer(username) {
    state.username = username;
    // Tenta Conectar ao Host Principal
    peer = new Peer();

    peer.on('open', (id) => {
        // Lógica de alocação em salas automáticas de até 6 jogadores
        joinRoom(1);
    });

    peer.on('connection', (conn) => {
        setupConnection(conn);
    });
}

function joinRoom(roomNum) {
    const hostId = `dc_chacara_room_v3_${roomNum}`;
    const conn = peer.connect(hostId);

    conn.on('open', () => {
        // Conectou a uma sala existente
        document.getElementById('ui-room').innerText = roomNum;
        setupConnection(conn);
    });

    conn.on('error', () => {
        // Se a sala não existe, assume como Host da Sala
        becomeHost(hostId, roomNum);
    });

    // Se o host demorar a responder, cria a própria sala
    setTimeout(() => {
        if (Object.keys(connections).length === 0 && !isHost) {
            becomeHost(hostId, roomNum);
        }
    }, 1500);
}

function becomeHost(hostId, roomNum) {
    peer.destroy();
    peer = new Peer(hostId);
    isHost = true;
    state.myPlayerId = 0;
    document.getElementById('ui-room').innerText = roomNum;
    
    peer.on('connection', (conn) => {
        if (Object.keys(connections).length >= 5) {
            // Sala Cheia (Máximo 6). Redireciona o novo jogador para a próxima sala
            conn.send({ type: 'REDIRECT', nextRoom: roomNum + 1 });
            return;
        }
        setupConnection(conn);
    });
}

function setupConnection(conn) {
    connections[conn.peer] = conn;
    
    // Define o ID de personagem baseado no número de participantes
    const assignedCharId = Object.keys(connections).length % 6;
    if (!isHost) state.myPlayerId = assignedCharId;

    conn.on('data', (data) => {
        if (data.type === 'REDIRECT') {
            joinRoom(data.nextRoom);
        } else if (data.type === 'STATE_UPDATE') {
            state.players[data.id] = data.playerData;
        } else if (data.type === 'CHAT') {
            addChatMessage(data.sender, data.msg);
        } else if (data.type === 'STAGE_ADVANCE') {
            state.stage = data.stage;
            initStage(state.stage);
        }
    });

    conn.on('close', () => {
        delete connections[conn.peer];
        updateRoomUI();
    });

    updateRoomUI();
}

function broadcast(data) {
    Object.values(connections).forEach(conn => {
        if (conn.open) conn.send(data);
    });
}

function updateRoomUI() {
    const total = Object.keys(connections).length + 1;
    document.getElementById('ui-players-count').innerText = `${total}/6`;
}

// Lógica e Controle do Jogador
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

const player = {
    x: 50, y: 300, width: 40, height: 50, vx: 0, vy: 0, speed: 5,
    jumpPower: -12, grounded: false, shieldActive: false, shieldTimer: 0, stageCleared: false,

    update() {
        if (state.isPaused) return;

        let moveX = 0;
        if (keys[state.keyMap.left]) moveX = -1;
        if (keys[state.keyMap.right]) moveX = 1;
        if (keys[state.keyMap.up]) this.y -= 1; // Para cima (W)
        if (keys[state.keyMap.down]) this.y += 1; // Para baixo (S)

        this.vx = moveX * this.speed;

        // Teclas Padrão: U (Pulo), O (Salto)
        if ((keys[state.keyMap.jump] || keys[state.keyMap.salto]) && this.grounded) {
            this.vy = keys[state.keyMap.salto] ? -15 : this.jumpPower;
            this.grounded = false;
        }

        if (keys[state.keyMap.attack] && !this.shieldActive) {
            this.shieldActive = true;
            this.shieldTimer = 60;
        }

        this.vy += 0.6;
        this.x += this.vx;
        this.y += this.vy;

        const groundY = 380;
        if (this.y + this.height >= groundY) {
            this.y = groundY - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) {
            this.x = canvas.width - this.width;
            this.stageCleared = true; // Chegou ao fim da fase
            checkStageProgression();
        }

        if (this.shieldTimer > 0) {
            this.shieldTimer--;
            if (this.shieldTimer <= 0) this.shieldActive = false;
        }

        // Transmite o estado do jogador para a sala
        broadcast({
            type: 'STATE_UPDATE',
            id: state.myPlayerId,
            playerData: {
                x: this.x, y: this.y, charId: state.myPlayerId,
                name: state.username, shieldActive: this.shieldActive, cleared: this.stageCleared
            }
        });
    },

    draw(x, y, charId, name, shieldActive) {
        const charInfo = CHARACTER_TYPES[charId || 0];
        
        ctx.save();
        // Nome em cima do Personagem
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px Courier';
        ctx.fillText(name || state.username, x - 5, y - 10);

        // Renderização Semelhante ao Doutor Chácara Original com Variações de Cor
        ctx.fillStyle = '#ffcc99'; ctx.fillRect(x + 10, y, 20, 15); // Rosto
        ctx.fillStyle = charInfo.color; ctx.fillRect(x + 5, y + 15, 30, 25); // Roupa/Cor
        ctx.fillStyle = '#000'; ctx.fillRect(x + 5, y + 40, 10, 10); ctx.fillRect(x + 25, y + 40, 10, 10); // Sapatos

        if (shieldActive) {
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(x + 20, y + 25, 35, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
    }
};

// Validação se TODOS os participantes passaram de fase
function checkStageProgression() {
    if (!player.stageCleared) return;

    let allCleared = true;
    Object.values(state.players).forEach(p => {
        if (!p.cleared) allCleared = false;
    });

    if (allCleared) {
        state.stage++;
        player.stageCleared = false;
        player.x = 50;
        broadcast({ type: 'STAGE_ADVANCE', stage: state.stage });
        initStage(state.stage);
    }
}

function initStage(stageNum) {
    document.getElementById('ui-stage').innerText = stageNum;
    playMusicForStage(stageNum);
}

// Renderização do Plano de Fundo Dinâmico (Fases Pares = Imagem enviada)
function drawBackground() {
    if (state.stage % 2 === 0) {
        if (bgEven.complete && bgEven.naturalWidth !== 0) {
            ctx.drawImage(bgEven, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#1a0033'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    } else {
        if (state.stage % 3 === 0 && bgRetro.complete) {
            ctx.drawImage(bgRetro, 0, 0, canvas.width, canvas.height);
        } else if (bgModern.complete) {
            ctx.drawImage(bgModern, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#050515'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }
}

// Loop de Jogo Principal
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground();

    if (!state.isGameOver && !state.isPaused) {
        player.update();
        player.draw(player.x, player.y, state.myPlayerId, state.username, player.shieldActive);

        // Desenha outros jogadores da mesma sala
        Object.keys(state.players).forEach(id => {
            if (parseInt(id) !== state.myPlayerId) {
                const p = state.players[id];
                player.draw(p.x, p.y, p.charId, p.name, p.shieldActive);
            }
        });
    }

    requestAnimationFrame(gameLoop);
}

// Chat ao Vivo
const chatInput = document.getElementById('chat-input');
const chatMessages = document.getElementById('chat-messages');

function sendChatMessage() {
    const text = chatInput.value.trim();
    if (text) {
        addChatMessage(state.username || 'Eu', text);
        broadcast({ type: 'CHAT', sender: state.username || 'Jogador', msg: text });
        chatInput.value = '';
    }
}

function addChatMessage(sender, msg) {
    const div = document.createElement('div');
    div.innerHTML = `<strong style="color:#2196F3">${sender}:</strong> ${msg}`;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

document.getElementById('chat-send').onclick = sendChatMessage;
chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });

// Handlers de Interface e Modais
document.getElementById('btn-login').onclick = () => {
    const user = document.getElementById('auth-username').value.trim();
    if (user) {
        document.getElementById('modal-auth').classList.add('hidden');
        initMultiplayer(user);
        initStage(1);
    } else {
        alert('Por favor, informe um nome de usuário para se cadastrar/entrar.');
    }
};

document.getElementById('btn-config').onclick = () => {
    state.isPaused = true;
    document.getElementById('modal-keybinds').classList.remove('hidden');
};

document.getElementById('btn-save-keybinds').onclick = () => {
    state.isPaused = false;
    document.getElementById('modal-keybinds').classList.add('hidden');
};

// Execução Inicial
gameLoop();

</script>
</body>
</html>
