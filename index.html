<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doutor Chácara - Legendary Warrior Arcade</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d11; color: #ffffff; text-align: center;
    }
    .hero-background {
      width: 100vw; height: 100vh;
      background-image: linear-gradient(to bottom, rgba(13, 13, 17, 0.2), rgba(13, 13, 17, 0.85)), url('capa-doutorchacara.jpg.jpg');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 40px 20px;
    }
    .btn-jogar {
      display: inline-block; background-color: #ff0055; color: #ffffff; font-size: 1.2rem;
      font-weight: bold; text-transform: uppercase; padding: 16px 36px; border-radius: 50px;
      text-decoration: none; border: 2px solid #ffffff; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      transition: all 0.3s ease; margin-bottom: 20px; cursor: pointer;
    }
    .btn-jogar:hover { background-color: #00ffcc; color: #000000; box-shadow: 0 0 25px rgba(0, 255, 204, 0.9); transform: scale(1.08); }
    #area-arcade { min-height: 100vh; padding: 40px 20px; background-color: #121218; }
    .status-controle {
      display: inline-block; padding: 10px 20px; background-color: #1a1a24;
      border: 1px solid #33334d; border-radius: 20px; font-size: 0.95rem; color: #ffcc00; margin-bottom: 15px;
    }
    #gameCanvas {
      background: #000000; border: 3px solid #00ffcc; border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); max-width: 100%; display: block; margin: 0 auto;
    }
  </style>
</head>
<body>

  <header class="hero-background">
    <a href="#area-arcade" class="btn-jogar">INICIAR ARCADE REALISTA</a>
    <p style="letter-spacing: 2px; text-transform: uppercase; color: #d1d1e0;">27 FASES • MODO ARCADE COMPLETO</p>
  </header>

  <main id="area-arcade">
    <h2>Doutor Chácara Arcade (1986 Edition)</h2>
    <p style="margin-top: 5px; color: #a0a0b0; margin-bottom: 15px;">
      Mover: Setas / D-Pad | Agachar: Seta Baixo | Pulo: Espaço / Botão A | Diskarmor (Ataque 360°): Z / Botão B
    </p>

    <div class="status-controle" id="gamepad-status">
      🎮 Status: Conecte seu controle USB/PS2 e pressione qualquer botão.
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // CARREGAR IMAGEM DO DOUTOR CHÁCARA
    const playerImg = new Image();
    playerImg.src = 'capa-doutorchacara.jpg.jpg';

    let currentStage = 1;
    const maxStages = 27;
    let score = 0;
    let gameOver = false;

    // JOGADOR COM MOVIMENTOS COMPLETO DO RYGAR
    const player = {
      x: 50, y: 280, width: 45, height: 65,
      speed: 4.5, dx: 0, dy: 0,
      jumping: false, grounded: false, crouching: false,
      facing: 'right', aimingUp: false, aimingDown: false,
      attacking: false, attackTimer: 0, attackMaxTime: 14
    };

    const gravity = 0.65;
    const groundY = 370;

    // DISKARMOR (CORRENTE E DISCO REALISTA)
    const weapon = { x: 0, y: 0, length: 0, maxLength: 140, angle: 0 };

    // INIMIGOS
    const enemies = [];
    function spawnEnemies() {
      enemies.length = 0;
      const count = 3 + Math.floor(currentStage * 0.7);
      for (let i = 0; i < count; i++) {
        enemies.push({
          x: 450 + i * 160 + Math.random() * 40,
          y: groundY - 35, width: 35, height: 35,
          speed: 1.8 + (currentStage * 0.12), alive: true,
          type: Math.random() > 0.5 ? 'ground' : 'jumper'
        });
      }
    }
    spawnEnemies();

    // TECLADO
    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (["Space", "ArrowUp", "ArrowDown", "KeyZ", "KeyX"].includes(e.code)) e.preventDefault();
    });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });

    // GAMEPAD USB
    let gamepadIndex = null;
    window.addEventListener("gamepadconnected", (e) => {
      gamepadIndex = e.gamepad.index;
      document.getElementById("gamepad-status").style.color = "#00ffcc";
      document.getElementById("gamepad-status").innerHTML = `🎮 Controle Detectado: <strong>${e.gamepad.id}</strong>`;
    });
    window.addEventListener("gamepaddisconnected", () => { gamepadIndex = null; });

    function pollGamepad() {
      if (gamepadIndex === null) return;
      const gp = navigator.getGamepads()[gamepadIndex];
      if (!gp) return;

      // Direções
      player.aimingUp = gp.axes[1] < -0.5 || gp.buttons[12]?.pressed;
      player.crouching = gp.axes[1] > 0.5 || gp.buttons[13]?.pressed;

      if (gp.axes[0] < -0.3 || gp.buttons[14]?.pressed) player.dx = -player.speed;
      else if (gp.axes[0] > 0.3 || gp.buttons[15]?.pressed) player.dx = player.speed;
      else if (!keys["ArrowLeft"] && !keys["ArrowRight"]) player.dx = 0;

      // Pulo (Botão A)
      if ((gp.buttons[0]?.pressed) && player.grounded) {
        player.jumping = true; player.grounded = false; player.dy = -12;
      }

      // Ataque Diskarmor (Botão B / X)
      if ((gp.buttons[1]?.pressed || gp.buttons[2]?.pressed) && !player.attacking) {
        triggerAttack();
      }
    }

    function triggerAttack() {
      player.attacking = true;
      player.attackTimer = player.attackMaxTime;
    }

    function update() {
      if (gameOver) return;

      pollGamepad();

      // Mapeamento de Teclado
      if (gamepadIndex === null) {
        player.aimingUp = keys["ArrowUp"];
        player.crouching = keys["ArrowDown"] && player.grounded;

        if (keys["ArrowLeft"] && !player.crouching) {
          player.dx = -player.speed; player.facing = 'left';
        } else if (keys["ArrowRight"] && !player.crouching) {
          player.dx = player.speed; player.facing = 'right';
        } else {
          player.dx = 0;
        }

        if (keys["Space"] && player.grounded) {
          player.jumping = true; player.grounded = false; player.dy = -12;
        }

        if ((keys["KeyZ"] || keys["KeyX"]) && !player.attacking) {
          triggerAttack();
        }
      }

      // Gravidade e Pulo
      player.x += player.dx;
      player.dy += gravity;
      player.y += player.dy;

      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height;
        player.dy = 0; player.grounded = true; player.jumping = false;
      }

      if (player.x < 0) player.x = 0;

      // Troca de Fase (Chegar no fim da tela)
      if (player.x + player.width >= canvas.width) {
        if (currentStage < maxStages) {
          currentStage++; player.x = 20; spawnEnemies();
        } else {
          alert("ZEROU O JOGO! Você completou as 27 Fases de Rygar!");
          currentStage = 1; player.x = 20; score = 0; spawnEnemies();
        }
      }

      // LÓGICA DE ATAQUE EM 360 GRAUS (DISKARMOR ORIGINAL)
      if (player.attacking) {
        player.attackTimer--;
        const progress = 1 - (player.attackTimer / player.attackMaxTime);
        weapon.length = Math.sin(progress * Math.PI) * weapon.maxLength;

        if (player.aimingUp) {
          weapon.x = player.x + player.width / 2;
          weapon.y = player.y - weapon.length;
        } else if (player.crouching) {
          weapon.y = player.y + player.height - 15;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        } else {
          weapon.y = player.y + 25;
          weapon.x = (player.facing === 'right') ? player.x + player.width + weapon.length : player.x - weapon.length;
        }

        if (player.attackTimer <= 0) player.attacking = false;
      }

      // INIMIGOS
      enemies.forEach(enemy => {
        if (!enemy.alive) return;

        if (enemy.x > player.x) enemy.x -= enemy.speed;
        else enemy.x += enemy.speed;

        if (enemy.type === 'jumper' && Math.random() < 0.02 && enemy.y >= groundY - enemy.height) {
          enemy.y -= 50;
        } else if (enemy.y < groundY - enemy.height) {
          enemy.y += 2;
        }

        // Colisão com o Ataque
        if (player.attacking) {
          const hit = (enemy.x < weapon.x + 20 && enemy.x + enemy.width > weapon.x - 20 &&
                       enemy.y < weapon.y + 20 && enemy.y + enemy.height > weapon.y - 20);
          if (hit) {
            enemy.alive = false;
            score += 300;
          }
        }

        // Dano no Jogador
        if (enemy.alive &&
            player.x < enemy.x + enemy.width && player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height && player.y + player.height > enemy.y) {
          gameOver = true;
        }
      });
    }

    function draw() {
      // Fundo Arcade com gradiente de Pôr do Sol do Rygar
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "#1a0b2e"); grad.addColorStop(0.6, "#8b263e"); grad.addColorStop(1, "#3a1700");
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sol Vermelho do Rygar
      ctx.fillStyle = "#ff3300"; ctx.beginPath(); ctx.arc(680, 140, 50, 0, Math.PI * 2); ctx.fill();

      // Chão Retrô
      ctx.fillStyle = "#2b1810"; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.fillStyle = "#ffcc00"; ctx.fillRect(0, groundY, canvas.width, 3);

      // DESENHAR PERSONAGEM DO DOUTOR CHÁCARA
      const drawHeight = player.crouching ? player.height / 2 : player.height;
      const drawY = player.crouching ? player.y + player.height / 2 : player.y;

      if (playerImg.complete) {
        ctx.drawImage(playerImg, player.x, drawY, player.width, drawHeight);
      } else {
        ctx.fillStyle = "#ffffff"; ctx.fillRect(player.x, drawY, player.width, drawHeight);
      }

      // DESENHAR DISKARMOR (CORRENTE E DISCO)
      if (player.attacking) {
        ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y + 20);
        ctx.lineTo(weapon.x, weapon.y);
        ctx.stroke();

        // Disco Giratório
        ctx.fillStyle = "#00ffcc"; ctx.beginPath();
        ctx.arc(weapon.x, weapon.y, 12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
      }

      // INIMIGOS
      enemies.forEach(enemy => {
        if (enemy.alive) {
          ctx.fillStyle = enemy.type === 'jumper' ? "#ff0055" : "#ff9900";
          ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
        }
      });

      // HUD ARCADE
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px 'Segoe UI', sans-serif";
      ctx.fillText(`ROUND: ${currentStage} / ${maxStages}`, 20, 30);
      ctx.fillText(`SCORE: ${score}`, 200, 30);

      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff0055"; ctx.font = "bold 36px 'Segoe UI', sans-serif"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
