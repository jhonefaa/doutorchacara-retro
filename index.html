<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogando Rygar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-align: center;
            min-height: 100vh;

            /* CONFIGURAÇÃO DO PAPEL DE PAREDE PROPORCIONAL */
            background-image: url('fundo.jpg'); /* Substitua 'fundo.jpg' pelo nome da sua imagem no GitHub */
            background-color: #121212; /* Cor de reserva caso a imagem não carregue */
            background-size: cover; /* Faz o papel de parede preencher a tela proporcionalmente sem distorcer */
            background-position: center center; /* Centraliza a imagem na tela */
            background-repeat: no-repeat;
            background-attachment: fixed; /* Mantém o fundo fixo ao rolar a página */
        }

        /* Camada escura suave por cima do fundo para destacar o jogo */
        .overlay {
            background-color: rgba(0, 0, 0, 0.75);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .btn-back {
            color: #ff4757;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #ffffff;
        }

        h1 {
            margin: 5px 0 15px 0;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Container do Emulador */
        #emulator-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            margin: 0 auto;
            border: 2px solid #333;
            border-radius: 6px;
            overflow: hidden;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="overlay">
        <p><a href="index.html" class="btn-back">⬅ Voltar para o Menu Principal</a></p>
        <h1>Rygar: Legendary Warrior</h1>

        <div id="emulator-container">
            <div id="game"></div>
        </div>
    </div>

    <!-- Script de Configuração do Emulador MAME 2003-Plus -->
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'mame2003plus'; // Núcleo MAME 2003 Plus (Alta compatibilidade para Arcade)
        EJS_gameUrl = 'rygar.zip';  // Nome do seu arquivo de ROM no GitHub
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // Ajustes de estabilidade e imagem
        EJS_smooth = false;
        EJS_threads = false;
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
