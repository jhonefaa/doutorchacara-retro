<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doutor Chácara Retro - v1.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            background: url('fundo.jpg.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-overlay {
            width: 100%;
            min-height: 100vh;
            background-color: rgba(10, 10, 18, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #00d2d3;
            text-shadow: 0 0 10px rgba(0, 210, 211, 0.5);
        }

        .author-badge {
            font-size: 0.95rem;
            color: #ffda79;
            margin-top: 5px;
        }

        /* Painel do Usuário (Login) */
        .user-panel {
            background: rgba(30, 30, 45, 0.9);
            border: 1px solid #00d2d3;
            padding: 10px 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .user-panel input {
            padding: 6px 12px;
            border-radius: 5px;
            border: none;
            outline: none;
            background: #ffffff;
            color: #000000;
        }

        .btn-action {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-action:hover {
            background-color: #ff6b81;
        }

        /* Catálogo de Jogos */
        .catalog-container {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-left: 4px solid #00d2d3;
            padding-left: 10px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: rgba(20, 20, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00d2d3;
        }

        .game-preview {
            width: 100%;
            height: 140px;
            background-color: #000;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
        }

        .game-info h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        /* Interatividade */
        .interaction-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .interaction-container {
                grid-template-columns: 1fr;
            }
        }

        .box-panel {
            background: rgba(20, 20, 30, 0.85);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .support-box {
            background: rgba(255, 218, 121, 0.1);
            border: 1px dashed #ffda79;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            max-width: 1100px;
            width: 100%;
            margin-bottom: 20px;
        }

            color: #000;
            padding: 4px 8px;
            border-radius: 4px;

            font-family:
