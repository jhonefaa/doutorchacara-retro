<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doutor Chácara - Arcade Mobile v3.0 Online Multi-jogador</title>
    <!-- PeerJS para Conexão Multiplayer Online Gratuita em Tempo Real -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #111; font-family: 'Courier New', Courier, monospace; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 56.25vw; 
            max-width: 800px; 
            max-height: 450px; 
            background: #000; 
            overflow: hidden; 
            border: 2px solid #fff; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2); 
        }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: linear-gradient(to bottom, #1a0033, #000000); }
        
        .ui-panel { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; text-shadow: 2px 2px #000; z-index: 10; pointer-events: none; }
        .btn-ui { background: #333; color: #fff; border: 1px solid #fff; padding: 4px 8px; cursor: pointer; pointer-events: auto; font-family: inherit; font-size: 11px; }
        .btn-ui:active { background: #555; }
        
        #touch-controls { position: absolute; bottom: 8px; left: 10px; right: 10px; height: 90px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
        .joystick-zone { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; position: relative; }
        .joystick-knob { width: 32px; height: 32px; background: rgba(255,255,255,0.8); border-radius: 50%; position: absolute; top: 22px; left: 22px; }
        .action-buttons { display: flex; gap: 8px; }
        .btn-action { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #fff; font-weight: bold; font-size: 11px; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px #000; }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 0 #000; }
        #btn-jump { background: #2196F3; }
        #btn-attack { background: #4CAF50; }
        #btn-special { background: #FF9800; }

        /* Modais */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; padding: 10px; text-align: center; box-sizing: border-box; }
        .hidden { display: none !important; }
        .modal input, .modal select { padding: 6px; font-size: 12px; text-align: center; margin: 4px 0; font-family: inherit; width: 80%; max-width: 250px; }
        .modal button { padding: 6px 12px; font-size: 11px; cursor: pointer; background: #fff; color: #000; border: none; font-weight: bold; margin-top: 4px; }
        
        /* Chat Overlay */
        #chat-container { position: absolute; bottom: 100px; left: 10px; width: 220px; height: 120px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 5px; display: flex; flex-direction: column; z-index: 15; pointer-events: auto; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 4px; font-size: 10px; text-align: left; }
        #chat-input-box { display: flex; border-top: 1px solid rgba(255,255,255,0.3); }
        #chat-input { flex: 1; background: transparent; border: none; color: white; font-size: 10px; padding: 4px; outline: none; }
        #chat-send { background: #2196F3; border: none; color: white; font-size: 10px; padding: 4px 8px; cursor: pointer; }
        
        .char-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; max-width: 300px; }
        .char-card { border: 1px solid #fff; padding: 6px; cursor: pointer; border-radius: 4px; font-size: 10px; }
        .char-card.selected { border: 2px solid #00ff00; background: rgba(0,255,0,0.2); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="ui-panel">
        <div>
            <div>FASE: <span id="ui-stage">1</span> | PONTOS: <span id="ui-score">0</span></div>
            <div>VIDAS: <span id="ui-lives">❤️❤️❤️</span> | ON: <span id="ui-online-count">1/6</span></div>
        </div>
        <div>
            <button class="btn-ui" id="btn-config">⚙️ MENU / PAUSE</button>
        </div>
    </div>

    <!-- Chat ao Vivo -->
    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-box">
            <input type="text" id="chat-input" placeholder="Chat ao vivo..." maxlength="45">
            <button id="chat-send">Enviar</button>
        </div>
    </div>

    <div id="touch-controls">
        <div class="joystick-zone" id="joystick-zone">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <div class="btn-action" id="btn-attack">ESC.U</div>
            <div class="btn-action" id="btn-special">REL.I</div>
            <div class="btn-action" id="btn-jump">PULO</div>
        </div>
    </div>

    <!-- Modal de Autenticação Obrigatória -->
    <div id="modal-auth" class="modal">
        <h2>DOUTOR CHÁCARA MULTIPLAYER</h2>
        <p style="font-size:11px; margin-bottom: 8px;">Cadastre-se ou Entre para Jogar Online</p>
        <input type="text" id="auth-user" placeholder="Usuário">
        <input type="password" id="auth-pass" placeholder="Senha">
        <div>
            <button id="btn-login" style="background:#4CAF50; color:white;">ENTRAR</button>
            <button id="btn-register">CADASTRAR</button>
        </div>
        <p id="auth-status" style="color:#ff3333; font-size:10px; margin-top:5px;"></p>
    </div>

    <!-- Modal de Seleção de Personagem e Lobby Online -->
    <div id="modal-lobby" class="modal hidden">
        <h3>SELEÇÃO DE PERSONAGEM</h3>
        <div class="char-select-grid" id="char-grid"></div>
        
        <h3>SALA MULTIPLAYER (MÁX 6)</h3>
        <div>
            <button id="btn-create-room" style="background:#2196F3; color:white;">CRIAR SALA</button>
            <input type="text" id="join-room-id" placeholder="Código da Sala" style="width:120px;">
            <button id="btn-join-room">ENTRAR NA SALA</button>
        </div>
        <p id="lobby-room-info" style="font-size:10px; color:#00ff00; margin-top:5px;"></p>
        <button id="btn-start-game" style="background:#4CAF50; color:white; margin-top:10px; display:none;">INICIAR JOGO</button>
    </div>

    <div id="modal-gameover" class="modal hidden">
        <h1 id="go-title">GAME OVER</h1>
        <p id="go-message">Tente novamente!</p>
        <button id="btn-restart">REINICIAR FASE</button>
    </div>
</div>

<script>
/**
 * DOUTOR CHÁCARA - ONLINE MULTIPLAYER v3.0
 */

// Configuração dos Personagens (Cores mantendo a semelhança ao Doutor Chácara original)
const CHARACTERS = {
    doc:    { name: "Dr. Chácara",  color: "#003366", skin: "#ffcc99" },
    father: { name: "Pai (Violeta)", color: "#8a2be2", skin: "#ffcc99" },
    sister: { name: "Irmã (Rosa)",   color: "#ff69b4", skin: "#ffcc99" },
    son:    { name: "Filho (Verde)", color: "#2e8b57", skin: "#ffcc99" },
    daughter:{ name: "Filha (Amarelo)",color:"#ffd700", skin: "#ffcc99" },
    uncle:  { name: "Tio (Laranja)", color: "#ff4500", skin: "#ffcc99" }
};

let currentUser = null;
let selectedCharKey = 'doc';

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const state = {
    score: 0,
    lives: 3,
    stage: 1,
    isImmune: false,
    immunityTimer: 0,
    pinkShield: false,
    isGameOver: false,
    isPaused: false,
    lastPinkButterflyScore: 0,
    lastSuperInsectScore: 0,
    playersInExitZone: 0
};

// Estrutura de Rede / PeerJS Multiplayer
let peer = null;
let connections = [];
let remotePlayers = {}; // Guarda dados dos outros até 5 jogadores
let roomId = null;
let isHost = false;

// 1. AUTENTICAÇÃO
document.getElementById('btn-register').onclick = () => {
    const u = document.getElementById('auth-user').value.trim();
    const p = document.getElementById('auth-pass').value.trim();
    if (!u || !p) return showAuthStatus("Preencha usuário e senha!");
    
    if (localStorage.getItem(`user_${u}`)) {
        showAuthStatus("Usuário já existe!");
    } else {
        localStorage.setItem(`user_${u}`, JSON.stringify({ password: p }));
        showAuthStatus("Cadastrado com sucesso! Clique em Entrar.", "#00ff00");
    }
};

document.getElementById('btn-login').onclick = () => {
    const u = document.getElementById('auth-user').value.trim();
    const p = document.getElementById('auth-pass').value.trim();
    const data = localStorage.getItem(`user_${u}`);
    if (!data) return showAuthStatus("Usuário não encontrado!");
    
    const parsed = JSON.parse(data);
    if (parsed.password === p) {
        currentUser = u;
        document.getElementById('modal-auth').classList.add('hidden');
        openLobby();
    } else {
        showAuthStatus("Senha incorreta!");
    }
};

function showAuthStatus(msg, color = "#ff3333") {
    const el = document.getElementById('auth-status');
    el.style.color = color;
    el.innerText = msg;
}

// 2. LOBBY E PERSONAGENS
function openLobby() {
    document.getElementById('modal-lobby').classList.remove('hidden');
    const grid = document.getElementById('char-grid');
    grid.innerHTML = '';
    
    Object.keys(CHARACTERS).forEach(key => {
        const char = CHARACTERS[key];
        const card = document.createElement('div');
        card.className = `char-card ${key === selectedCharKey ? 'selected' : ''}`;
        card.style.borderColor = char.color;
        card.innerHTML = `<div style="width:20px;height:20px;background:${char.color};margin:0 auto 4px;"></div>${char.name}`;
        card.onclick = () => {
            document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedCharKey = key;
        };
        grid.appendChild(card);
    });
}

// 3. SISTEMA ONLINE (PeerJS)
function initPeer() {
    peer = new Peer();
    peer.on('open', id => {
        if (isHost) {
            roomId = id;
            document.getElementById('lobby-room-info').innerText = `Código da Sala: ${roomId} (Envie aos amigos)`;
            document.getElementById('btn-start-game').style.display = 'inline-block';
        }
    });

    peer.on('connection', conn => {
        if (connections.length >= 5) { // Máximo de 6 jogadores (Host + 5)
            conn.close();
            return;
        }
        setupConnection(conn);
    });
}

function setupConnection(conn) {
    connections.push(conn);
    updateOnlineCounter();

    conn.on('data', data => {
        handleNetworkData(data, conn);
    });

    conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        delete remotePlayers[conn.peer];
        updateOnlineCounter();
    });
}

document.getElementById('btn-create-room').onclick = () => {
    isHost = true;
    initPeer();
};

document.getElementById('btn-join-room').onclick = () => {
    const inputId = document.getElementById('join-room-id').value.trim();
    if (!inputId) return alert("Digite o código da sala!");
    
    isHost = false;
    peer = new Peer();
    peer.on('open', () => {
        const conn = peer.connect(inputId);
        setupConnection(conn);
        document.getElementById('lobby-room-info').innerText = "Conectado à sala com sucesso!";
        document.getElementById('modal-lobby').classList.add('hidden');
    });
};

document.getElementById('btn-start-game').onclick = () => {
    broadcast({ type: 'START_GAME' });
    document.getElementById('modal-lobby').classList.add('hidden');
};

function updateOnlineCounter() {
    document.getElementById('ui-online-count').innerText = `${connections.length + 1}/6`;
}

// Transmite dados para todos os conectados
function broadcast(data) {
    connections.forEach(conn => {
        if (conn.open) conn.send(data);
    });
}

function handleNetworkData(data, conn) {
    if (data.type === 'START_GAME') {
        document.getElementById('modal-lobby').classList.add('hidden');
    } else if (data.type === 'PLAYER_SYNC') {
        remotePlayers[conn.peer] = data.player;
    } else if (data.type === 'CHAT') {
        appendChatMessage(data.user, data.msg);
    } else if (data.type === 'STAGE_ADVANCE') {
        initStage(data.stage);
    }
}

// 4. CHAT EM TEMPO REAL
document.getElementById('chat-send').onclick = sendChatMessage;
document.getElementById('chat-input').addEventListener('keypress', e => {
    if (e.key === 'Enter') sendChatMessage();
});

function sendChatMessage() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;

    appendChatMessage(currentUser || "Eu", msg);
    broadcast({ type: 'CHAT', user: currentUser || "Anônimo", msg: msg });
    input.value = '';
}

function appendChatMessage(user, msg) {
    const chatMsgs = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.innerHTML = `<strong style="color:#2196F3;">${user}:</strong> ${msg}`;
    chatMsgs.appendChild(div);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

// 5. JOGADOR PRINCIPAL E LÓGICA DO JOGO
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

const player = {
    x: 50, y: 300, width: 40, height: 50, vx: 0, vy: 0, speed: 5, jumpPower: -12, grounded: false,
    shieldActive: false, shieldTimer: 0, shieldRange: 35, isCarriedAway: false,
    
    update() {
        if (state.isPaused) return;

        if (this.isCarriedAway) {
            this.y -= 3;
            return;
        }

        let moveX = 0;
        if (keys['KeyA'] || keys['ArrowLeft']) moveX = -1;
        if (keys['KeyD'] || keys['ArrowRight']) moveX = 1;
        if (touchMoveX !== 0) moveX = touchMoveX;

        this.vx = moveX * this.speed;

        if ((keys['Space'] || touchJump) && this.grounded) {
            this.vy = this.jumpPower;
            this.grounded = false;
            touchJump = false;
        }

        if ((keys['KeyU'] || touchAttack) && !this.shieldActive) {
            this.activateShield('U');
            touchAttack = false;
        }

        this.vy += 0.6;
        this.x += this.vx;
        this.y += this.vy;

        const groundY = 380;
        if (this.y + this.height >= groundY) {
            this.y = groundY - this.height;
            this.vy = 0;
            this.grounded = true;
        }

        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

        if (this.shieldTimer > 0) {
            this.shieldTimer--;
            if (this.shieldTimer <= 0) this.shieldActive = false;
        }

        // Transmitir posição para a rede
        if (peer && connections.length > 0) {
            broadcast({
                type: 'PLAYER_SYNC',
                player: {
                    x: this.x,
                    y: this.y,
                    charKey: selectedCharKey,
                    user: currentUser,
                    pinkShield: state.pinkShield
                }
            });
        }
    },

    activateShield(type) {
        this.shieldActive = true;
        this.shieldTimer = 60;
    },

    draw() {
        drawCharacterSprite(this.x, this.y, selectedCharKey, state.pinkShield, currentUser);
    }
};

// Renderização Unificada dos Personagens Semelhantes ao Doutor Chácara Original
function drawCharacterSprite(x, y, charKey, isPink, name) {
    ctx.save();
    const char = CHARACTERS[charKey] || CHARACTERS.doc;

    // Cabeça / Corpo
    ctx.fillStyle = char.skin; 
    ctx.fillRect(x + 10, y, 20, 15);
    
    ctx.fillStyle = isPink ? '#ff007f' : char.color; 
    ctx.fillRect(x + 5, y + 15, 30, 25);
    
    // Pés
    ctx.fillStyle = '#000'; 
    ctx.fillRect(x + 5, y + 40, 10, 10); 
    ctx.fillRect(x + 25, y + 40, 10, 10);

    // Nome acima do Personagem
    if (name) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px Courier';
        ctx.textAlign = 'center';
        ctx.fillText(name, x + 20, y - 5);
    }

    ctx.restore();
}

let enemies = [];

class Enemy {
    constructor(x, y) {
        this.x = x; this.y = y; this.width = 40; this.height = 40; this.speed = 2;
    }
    update() {
        this.x -= this.speed;
        if (this.x < -100) this.x = canvas.width + Math.random() * 200;
    }
    draw() {
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
}

function initStage(stageNum) {
    state.stage = stageNum;
    enemies = [];
    for(let i = 0; i < 3 + stageNum; i++) {
        enemies.push(new Enemy(600 + i * 250, 340));
    }
    document.getElementById('ui-stage').innerText = state.stage;
}

// LOOP PRINCIPAL
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!state.isGameOver) {
        player.update();
        player.draw();

        // Desenhar Jogadores Remotos (Multijogador)
        Object.keys(remotePlayers).forEach(id => {
            const rp = remotePlayers[id];
            drawCharacterSprite(rp.x, rp.y, rp.charKey, rp.pinkShield, rp.user);
        });

        // Inimigos e Mecânica Original de Pular no Cabeção
        enemies.forEach((enemy, index) => {
            enemy.update(); enemy.draw();

            const isFalling = player.vy > 0;
            const playerFeet = player.y + player.height;
            const enemyHead = enemy.y;

            if (isFalling && playerFeet >= enemyHead && playerFeet <= enemyHead + 15 && 
                player.x + player.width > enemy.x && player.x < enemy.x + enemy.width) {
                enemies.splice(index, 1);
                player.vy = -8;
                state.score += 200;
            }
        });

        // REGRA MULTIPLAYER: Só passa a fase se TODOS os jogadores chegarem na zona final (Direita da tela)
        const inExitZone = player.x >= canvas.width - 60;
        let totalPlayersInExit = inExitZone ? 1 : 0;

        Object.keys(remotePlayers).forEach(id => {
            if (remotePlayers[id].x >= canvas.width - 60) totalPlayersInExit++;
        });

        const totalPlayers = connections.length + 1;
        
        // Desenha Portal / Zona de Transição de Fase
        ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
        ctx.fillRect(canvas.width - 50, 300, 50, 80);
        ctx.fillStyle = '#fff';
        ctx.font = '10px Courier';
        ctx.fillText(`SAÍDA (${totalPlayersInExit}/${totalPlayers})`, canvas.width - 50, 290);

        if (totalPlayersInExit >= totalPlayers && isHost) {
            const nextStage = state.stage + 1;
            initStage(nextStage);
            broadcast({ type: 'STAGE_ADVANCE', stage: nextStage });
        }

        document.getElementById('ui-score').innerText = Math.floor(state.score);
    }

    requestAnimationFrame(gameLoop);
}

// Touch Controls Joystick
let touchMoveX = 0, touchJump = false, touchAttack = false;
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');

joystickZone.addEventListener('touchstart', handleJoystick);
joystickZone.addEventListener('touchmove', handleJoystick);
joystickZone.addEventListener('touchend', () => {
    joystickKnob.style.top = '22px'; joystickKnob.style.left = '22px'; touchMoveX = 0;
});

function handleJoystick(e) {
    e.preventDefault();
    const rect = joystickZone.getBoundingClientRect();
    const touch = e.touches[0];
    const x = touch.clientX - rect.left - 40;
    touchMoveX = Math.max(-1, Math.min(1, x / 30));
    joystickKnob.style.left = `${22 + touchMoveX * 20}px`;
}

document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); touchJump = true; });
document.getElementById('btn-attack').addEventListener('touchstart', (e) => { e.preventDefault(); touchAttack = true; });

// Iniciar Jogo
initStage(1);
gameLoop();

</script>
</body>
</html>
