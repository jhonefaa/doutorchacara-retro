<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Plataforma de Jogos Arcade</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        
        #emulator-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            margin: 20px auto;
            border: 2px solid #333;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Arcade Retro - Jogar Agora</h1>
    <p>Pressione a tecla de espaço ou clique para iniciar os controles.</p>

    <div id="emulator-container">
        <div id="game"></div>
    </div>

    <!-- Script de Configuração Otimizado -->
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'mame2000'; // Alterado para mame2000 (muito mais leve)
        EJS_gameUrl = 'rygar.zip'; // Certifique-se de que o nome da sua ROM está correto aqui
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // Configurações para remover a lentidão
        EJS_smooth = false; // Desativa suavização pesada da imagem
        EJS_threads = false; // Melhora a estabilidade no navegador
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
