<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doutor Chácara Retro - Portal de Jogos Clássicos</title>
  
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d0d11;
      color: #ffffff;
    }

    /* SEÇÃO DE CAPA COM A IMAGEM DE BACKGROUND */
    .hero-background {
      width: 100%;
      min-height: 100vh; /* Ocupa 100% da altura da tela */
      
      /* Substitua 'capa-doutorchacara.jpg' pelo caminho real da sua imagem */
      background-image: 
        linear-gradient(to bottom, rgba(13, 13, 17, 0.3), rgba(13, 13, 17, 0.85)),
        url('capa-doutorchacara.jpg');
      
      background-size: cover;       /* Ajusta a imagem para cobrir toda a área */
      background-position: center;  /* Centraliza o personagem e os fliperamas */
      background-repeat: no-repeat;
      background-attachment: fixed; /* Efeito Parallax ao rolar a página */

      display: flex;
      flex-direction: column;
      justify-content: flex-end;    /* Alinha o conteúdo na parte inferior */
      align-items: center;
      padding: 40px 20px;
      text-align: center;
    }

    /* ÁREA DO BOTÃO INTERATIVO POR CIMA DO BOTÃO DA IMAGEM */
    .btn-jogar {
      display: inline-block;
      background-color: #ff0055;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 50px;
      text-decoration: none;
      border: 2px solid #ffffff;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      transition: all 0.3s ease;
      margin-bottom: 25px;
      cursor: pointer;
    }

    .btn-jogar:hover {
      background-color: #00ffcc;
      color: #000000;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.9);
      transform: scale(1.08);
    }

    .subtitulo-rodape {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d1d1e0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* AJUSTES PARA CELULAR */
    @media (max-width: 768px) {
      .hero-background {
        background-attachment: scroll; /* Melhora a performance em celulares */
      }

      .btn-jogar {
        font-size: 1rem;
        padding: 12px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- SEÇÃO HERO COM O BACKGROUND DO DOUTOR CHÁCARA -->
  <header class="hero-background">
    <!-- Botão real clicável que fica posicionado no pé da imagem -->
    <a href="#catalogo-jogos" class="btn-jogar">COMEÇAR JOGO RETRO</a>
    <p class="subtitulo-rodape">SEU PORTAL DE JOGOS CLÁSSICOS</p>
  </header>

  <!-- O RESTANTE DO CONTEÚDO DO SEU SITE VEM AQUI -->
  <main id="catalogo-jogos" style="padding: 50px 20px; text-align: center;">
    <h2>Selecione seu Jogo</h2>
    <!-- Adicione seus jogos aqui -->
  </main>

</body>
</html>




<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Plataforma de Jogos Arcade</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        
        #emulator-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            margin: 20px auto;
            border: 2px solid #333;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Arcade Retro - Jogar Agora</h1>
    <p>Pressione a tecla de espaço ou clique para iniciar os controles.</p>

    <div id="emulator-container">
        <div id="game"></div>
    </div>

    <!-- Script com núcleo FBNeo (Leve e altamente compatível) -->
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'mame'; // Trocado para FinalBurn Neo
        EJS_gameUrl = 'rygar.zip'; // Nome do arquivo .zip no GitHub
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        EJS_smooth = false; // Desativa o filtro pesado para ganhar desempenho
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
